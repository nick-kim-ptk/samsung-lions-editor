<title>삼성라이온즈 앱 제작 요청 및 협의사항</title>
<meta name="description" content="관련 담당자가 요청사항과 답변을 공유하고, 처리 상태를 통해 진행 상황을 함께 관리합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F6F8FB; --sunken:#EBEFF5;
  --line:#DDE3EC; --line-strong:#C7D0DD;
  --text:#101828; --text-2:#3B4658; --muted:#6A7589;
  --accent:#0A4DA2; --accent-hover:#083F86; --accent-soft:#E4EDF9; --accent-text:#0A4DA2; --on-accent:#FFFFFF;
  --danger:#C4302B; --danger-soft:#FCE9E8;
  --s-requested:#4D5A6E; --s-requested-bg:#ECEFF4;
  --s-reviewing:#1B62D0; --s-reviewing-bg:#E3EDFD;
  --s-progress:#A55800; --s-progress-bg:#FCEFDD;
  --s-done:#157347; --s-done-bg:#E1F3E9;
  --s-hold:#6E6488; --s-hold-bg:#EFECF5;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.08);
  --shadow-panel:-12px 0 40px rgba(16,24,40,.16);
  --scrim:rgba(16,24,40,.38);
  --row-client:#F3F7FD; --row-client-hover:#EAF1FB;
  --r:10px;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D121B; --surface:#141B27; --surface-2:#18202E; --sunken:#1D2636;
    --line:#263145; --line-strong:#34415A;
    --text:#E7ECF4; --text-2:#C1CAD8; --muted:#8E9AAF;
    --accent:#3D84E6; --accent-hover:#5696EC; --accent-soft:#18294A; --accent-text:#7FB0F4; --on-accent:#FFFFFF;
    --danger:#F0706A; --danger-soft:#3A1C1E;
    --s-requested:#B3BDCC; --s-requested-bg:#232C3B;
    --s-reviewing:#7FB0F4; --s-reviewing-bg:#172A48;
    --s-progress:#F2B064; --s-progress-bg:#3A2A14;
    --s-done:#6FD3A0; --s-done-bg:#15352A;
    --s-hold:#B7AED0; --s-hold-bg:#2A2638;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-panel:-12px 0 40px rgba(0,0,0,.45);
    --scrim:rgba(0,0,0,.55);
    --row-client:#15203A; --row-client-hover:#1A2745;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D121B; --surface:#141B27; --surface-2:#18202E; --sunken:#1D2636;
  --line:#263145; --line-strong:#34415A;
  --text:#E7ECF4; --text-2:#C1CAD8; --muted:#8E9AAF;
  --accent:#3D84E6; --accent-hover:#5696EC; --accent-soft:#18294A; --accent-text:#7FB0F4; --on-accent:#FFFFFF;
  --danger:#F0706A; --danger-soft:#3A1C1E;
  --s-requested:#B3BDCC; --s-requested-bg:#232C3B;
  --s-reviewing:#7FB0F4; --s-reviewing-bg:#172A48;
  --s-progress:#F2B064; --s-progress-bg:#3A2A14;
  --s-done:#6FD3A0; --s-done-bg:#15352A;
  --s-hold:#B7AED0; --s-hold-bg:#2A2638;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-panel:-12px 0 40px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.55);
    --row-client:#15203A; --row-client-hover:#1A2745;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
@media (max-width:600px){.wrap{padding-inline:16px}}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px 20px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--accent-text);text-transform:uppercase}
.eyebrow .dot{width:8px;height:8px;border-radius:2px;background:var(--accent)}
h1{font-size:26px;line-height:1.25;margin:6px 0 2px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:transparent;color:var(--text-2)}
.icon-btn:hover{background:var(--sunken)}

.who{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;color:var(--text-2)}
.seg{display:inline-flex;background:var(--sunken);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.12)}

.notice{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--text-2);font-size:13px;margin-bottom:18px}
.notice b{color:var(--accent-text)}

/* status tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--text-2)}
.tab .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tab .sw{width:8px;height:8px;border-radius:50%}
.tab[aria-pressed="true"]{border-color:var(--text);background:var(--text);color:var(--bg)}
.tab[aria-pressed="true"] .n{color:inherit;opacity:.75}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 240px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.field,.search input,select.field{height:38px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px}
.search input{padding-left:36px}
select.field{width:auto;padding-right:30px}
.field:focus,.search input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list-head,.row{display:grid;grid-template-columns:92px minmax(0,1fr) 110px 96px;gap:16px;align-items:center;padding:0 18px}
.list-head{height:38px;font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line)}
.row{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding-block:14px;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.client{background:var(--row-client)}
.row.client:hover{background:var(--row-client-hover)}
.row.active,.row.client.active{background:var(--accent-soft)}
.row .code{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.row .main{min-width:0;display:flex;flex-direction:column;gap:4px}
.row .t{font-weight:600;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.row .sub span{display:inline-flex;align-items:center;gap:4px}
.row .sub svg.i{width:14px;height:14px}
.due{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.due.late{color:var(--danger);font-weight:600}
.due small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.due.late small{color:var(--danger)}
.more{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border:0;border-top:1px solid var(--line);background:var(--surface-2);font-weight:600;color:var(--text-2)}
.more:hover{background:var(--sunken);color:var(--text)}
.more .mono{font-size:12px;color:var(--muted);font-weight:500}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}

.cat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.cat svg.i{width:14px;height:14px;color:var(--accent-text)}
.prio{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.prio.urgent{background:var(--danger-soft);color:var(--danger)}
.prio.high{background:var(--s-progress-bg);color:var(--s-progress)}

.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;justify-self:start}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-requested{color:var(--s-requested);background:var(--s-requested-bg)}
.st-reviewing{color:var(--s-reviewing);background:var(--s-reviewing-bg)}
.st-in_progress{color:var(--s-progress);background:var(--s-progress-bg)}
.st-done{color:var(--s-done);background:var(--s-done-bg)}
.st-hold{color:var(--s-hold);background:var(--s-hold-bg)}

@media (max-width:720px){
  .list-head{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"code status" "main main" "due due";gap:6px 12px}
  .row .code{grid-area:code}.row .main{grid-area:main}.row .due{grid-area:due;display:flex;gap:6px}.row .pill{grid-area:status;justify-self:end}
  .row .t{white-space:normal}
  .due small{display:inline}
}

/* panel */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);box-shadow:var(--shadow-panel);z-index:21;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.panel.on{transform:none}
.panel-head{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px 20px;border-bottom:1px solid var(--line);min-height:60px}
.panel-head .grow{flex:1;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-body{flex:1;overflow-y:auto;padding:22px 24px 32px}
.panel-foot{border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:flex-end;background:var(--surface)}
.panel-foot .grow{flex:1}
.foot-who{border:0;background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 8px;border-radius:6px;min-width:0;max-width:55%;overflow:hidden;white-space:nowrap}
.foot-who:hover{background:var(--sunken)}
.tgt{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--sunken);color:var(--text-2)}
.tgt.admin{background:var(--s-hold-bg);color:var(--s-hold)}
.meta .wide{grid-column:1/-1}
.meta a{color:var(--accent-text);font-weight:500;overflow-wrap:anywhere}
@media (max-width:600px){.panel-body{padding:18px 16px 28px}}
@media (prefers-reduced-motion:reduce){.panel,.scrim{transition:none}}

h2{font-size:21px;line-height:1.35;margin:0 0 14px;letter-spacing:-.015em;text-wrap:balance}
h3{font-size:13px;font-weight:700;margin:0 0 10px;color:var(--text-2);display:flex;align-items:center;gap:6px}
h3 .n{font-family:var(--mono);color:var(--muted);font-weight:500}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 16px;margin:0 0 20px;padding:14px 16px;background:var(--surface-2);border-radius:var(--r)}
.meta div{min-width:0}
.meta dt{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.meta dd{margin:0;font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.section{margin-top:24px}
.body-text{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);font-size:14.5px;line-height:1.7}

.status-ctl{display:flex;flex-wrap:wrap;gap:6px}
.status-ctl button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;padding:0 12px;font-size:13px;font-weight:600;color:var(--muted)}
.status-ctl button:hover{border-color:var(--line-strong);color:var(--text)}
.status-ctl button[aria-pressed="true"]{border-color:transparent}
.status-ctl button.st-requested{color:var(--s-requested);background:var(--s-requested-bg)}
.status-ctl button.st-reviewing{color:var(--s-reviewing);background:var(--s-reviewing-bg)}
.status-ctl button.st-in_progress{color:var(--s-progress);background:var(--s-progress-bg)}
.status-ctl button.st-done{color:var(--s-done);background:var(--s-done-bg)}
.status-ctl button.st-hold{color:var(--s-hold);background:var(--s-hold-bg)}

.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.file{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0}
.file .thumb{aspect-ratio:4/3;background:var(--sunken);display:grid;place-items:center;color:var(--muted);overflow:hidden;border:0;padding:0;width:100%}
.file .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.file .fn{padding:7px 9px;font-size:12px;display:flex;flex-direction:column;min-width:0}
.file .fn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .fn small{color:var(--muted);font-family:var(--mono);font-size:11px}

.thread{display:flex;flex-direction:column;gap:14px}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--sunken);color:var(--text-2)}
.av.client{background:var(--accent);color:var(--on-accent)}
.msg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.msg-head b{font-weight:600}
.role{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--sunken);color:var(--muted)}
.role.client{background:var(--accent-soft);color:var(--accent-text)}
.role.ticketlink{background:var(--s-progress-bg);color:var(--s-progress)}
.av.ticketlink{background:var(--s-progress);color:var(--on-accent)}
.msg.ticketlink .bubble{background:var(--s-progress-bg)}
.by.ticketlink{color:var(--s-progress)}
.msg-head time{color:var(--muted);font-size:12px}
.msg .bubble{margin-top:4px;padding:10px 12px;background:var(--surface-2);border-radius:4px 10px 10px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.client .bubble{background:var(--accent-soft)}
.msg .files{margin-top:8px}
.sys{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;padding-left:42px}
.sys::before{content:"";width:14px;height:1px;background:var(--line-strong)}

.composer{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{display:block;width:100%;border:0;background:transparent;resize:vertical;min-height:84px;padding:12px 14px;outline:none;box-shadow:none}
.composer .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--line)}
.composer .bar .grow{flex:1}
.composer select{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 8px;font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;height:28px;padding:0 4px 0 10px;border-radius:6px;background:var(--sunken);font-size:12.5px}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.chip small{color:var(--muted);font-family:var(--mono);font-size:11px}
.chip button{border:0;background:transparent;width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--muted)}
.chip button:hover{background:var(--line)}

details.log summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.log summary::-webkit-details-marker{display:none}
details.log ol{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-2)}
details.log li{display:flex;gap:10px;flex-wrap:wrap}
details.log time{color:var(--muted);font-family:var(--mono);font-size:12px;min-width:92px}

/* composer: category step */
.step-label{font-size:12px;font-weight:700;color:var(--accent-text);letter-spacing:.04em;margin-bottom:4px}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.cat-tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s}
.cat-tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.cat-tile .ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.cat-tile:hover .ic{background:var(--accent);color:var(--on-accent)}
.cat-tile b{font-size:15px}
.cat-tile .txt{display:flex;flex-direction:column;gap:2px}
.cat-tile .txt span{font-size:12.5px;color:var(--muted);line-height:1.45}
@media (max-width:420px){.cats{grid-template-columns:1fr}.cat-tile{flex-direction:row;align-items:center}.cat-tile .txt{display:flex;flex-direction:column}}

.form{display:flex;flex-direction:column;gap:18px}
.form .lb{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text-2)}
.form .lb em{font-style:normal;color:var(--danger);margin-left:2px}
.form .lb small{font-weight:400;color:var(--muted);margin-left:6px}
.form textarea.field{height:auto;min-height:150px;padding:10px 12px;line-height:1.6;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.err{display:block;margin-top:5px;font-size:12.5px;color:var(--danger)}
.picked{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);background:var(--accent-soft)}
.picked .cat{font-size:14px}
.picked .grow{flex:1}
.linkish{border:0;background:none;color:var(--accent-text);font-weight:600;font-size:13px;padding:4px}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface-2);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text-2)}
.drop b{color:var(--accent-text)}
.drop + .chips{margin-top:10px}
.prio-seg button{padding:6px 16px}

function DemoStore(){
  const KEY="lions-req-demo-v3";
  let db = ls.get(KEY, null) || seedDemo();
  const save = () => ls.set(KEY, db);
  const find = id => db.reqs.find(r=>r.id===id);
  async function toAtt(files){
    const out=[];
    for(const f of files){
      let url=null;
      if(f.type.startsWith("image/") && f.size < 1.5*1048576){ try{ url = await readAsDataURL(f); }catch(e){} }
      out.push({id:"a"+Math.random().toString(36).slice(2), file_name:f.name, mime:f.type, size:f.size, url});
    }
    return out;
  }
  function log(r, to, by){ if(r.status===to) return; r.logs.push({from_status:r.status, to_status:to, changed_by:by, created_at:new Date().toISOString()}); r.status=to; }
  return {
    mode:"demo",
    async categories(){ return DEFAULT_CATEGORIES; },
    async list(){ return db.reqs.map(r=>({...r, reply_count:r.replies.length, file_count:r.attachments.length + r.replies.reduce((n,x)=>n+x.attachments.length,0)})); },
    async get(id){ return JSON.parse(JSON.stringify(find(id))); },
    async create(d, files, me){
      const now=new Date().toISOString();
      const r={id:++db.seq, ...d, status:"requested", author_name:me.name, author_role:me.role, created_at:now, updated_at:now, attachments:await toAtt(files), replies:[], logs:[]};
      db.reqs.unshift(r); save(); return r;
    },
    async reply(id, body, files, status, me){
      const r=find(id); const now=new Date().toISOString();
      if(body || files.length){
        r.replies.push({id:"r"+Math.random().toString(36).slice(2), body, author_name:me.name, author_role:me.role, created_at:now, attachments:await toAtt(files)});
        if(me.role!==r.author_role && r.status==="requested" && !status) log(r,"reviewing",me.name);
      }
      if(status) log(r,status,me.name);
      r.updated_at=now; save();
    },
    async setStatus(id, status, me){ const r=find(id); log(r,status,me.name); r.updated_at=new Date().toISOString(); save(); },
    reset(){ db=seedDemo(); ls.del(KEY); }
  };
}

    for(const f of files){
      // 스토리지 경로에는 한글·공백을 쓰지 않습니다. 원래 파일명은 DB에 따로 저장합니다.
      const ext=(f.name.includes(".") ? f.name.split(".").pop() : "").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,8);
      const uid = (crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(36).slice(2));
      const path=`${reqId}/${uid}${ext?"."+ext:""}`;
      must(await sb.storage.from(B).upload(path, f, {contentType:f.type||"application/octet-stream", upsert:false}));
      rows.push({request_id:reqId, reply_id:replyId, file_name:f.name, file_path:path, mime:f.type||null, size:f.size});
    }
    if(rows.length) must(await sb.from("attachments").insert(rows));
  }
  return {
    mode:"live",
    async categories(){ return must(await sb.from("categories").select("*").eq("active",true).order("sort")); },
    async list(){
      // Supabase는 한 번에 최대 1,000건만 돌려주므로 끝까지 나눠서 받습니다.
      const data=[]; const CH=1000;
      for(let from=0;;from+=CH){
        const part = must(await sb.from("requests").select("*, replies(count), attachments(count)").order("id",{ascending:false}).range(from, from+CH-1));
        data.push(...part); if(part.length < CH) break;
      }
      return data.map(r=>({...r, reply_count:r.replies?.[0]?.count||0, file_count:r.attachments?.[0]?.count||0}));
    },
    async get(id){
      const [req, replies, atts, logs] = await Promise.all([
        sb.from("requests").select("*").eq("id",id).single().then(must),
        sb.from("replies").select("*").eq("request_id",id).order("created_at").then(must),
        sb.from("attachments").select("*").eq("request_id",id).order("created_at").then(must),
        sb.from("status_logs").select("*").eq("request_id",id).order("created_at").then(must)
      ]);
      const urls={};
      if(atts.length){
        const signed = must(await sb.storage.from(B).createSignedUrls(atts.map(a=>a.file_path), 3600));
        signed.forEach(s=>{ if(s.signedUrl) urls[s.path]=s.signedUrl; });
      }
      const withUrl = a => ({...a, url:urls[a.file_path]||null});
      return {...req, attachments:atts.filter(a=>!a.reply_id).map(withUrl),
        replies:replies.map(r=>({...r, attachments:atts.filter(a=>a.reply_id===r.id).map(withUrl)})), logs};
    },
    async create(d, files, me){
      const row = must(await sb.from("requests").insert({...d, author_name:me.name, author_role:me.role}).select().single());
      await upload(row.id, null, files);
      return row;
    },
    async reply(id, body, files, status, me){
      if(body || files.length){
        const r = must(await sb.from("replies").insert({request_id:id, body, author_name:me.name, author_role:me.role}).select().single());
        await upload(id, r.id, files);
      }
      if(status) must(await sb.from("requests").update({status, status_changed_by:me.name}).eq("id",id));
    },
    async setStatus(id, status, me){ must(await sb.from("requests").update({status, status_changed_by:me.name}).eq("id",id)); }
  };
}

async function boot(){
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY){
    try{
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js");
      const baseUrl = CONFIG.SUPABASE_URL.trim().replace(/\/(rest|auth|storage)\/v1.*$/,"").replace(/\/+$/,"");
      S.sb = window.supabase.createClient(baseUrl, CONFIG.SUPABASE_ANON_KEY.trim());
      S.store = SupaStore(S.sb);
      S.sb.channel("board")
        .on("postgres_changes",{event:"*",schema:"public",table:"requests"},()=>refresh(true))
        .on("postgres_changes",{event:"*",schema:"public",table:"replies"},()=>refresh(true))
        .subscribe();
    }catch(e){
      console.error(e);
      $("#app").innerHTML = `<div class="login"><h1>연결하지 못했습니다</h1><p class="lede">Supabase 주소와 키를 확인해 주세요. (${esc(e.message||e)})</p></div>`;

  }
  S.me = ls.get(ME_KEY, null);
  try{ S.cats = await S.store.categories(); }catch(e){ S.cats = DEFAULT_CATEGORIES; }

  await refresh();
  const h = location.hash.replace("#","");
  if(/^REQ-\d+$/.test(h)) openDetail(parseInt(h.slice(4),10));
}

function renderTabs(){
  const base = baseFiltered();
  const cnt = s => base.filter(r=>r.status===s).length;
  const late = base.filter(isLate).length;
  const items = [{id:"all",label:"전체",n:base.length}, ...STATUSES.map(s=>({id:s.id,label:s.label,n:cnt(s.id),c:STATUS_COLOR[s.id]}))];
  if(late) items.push({id:"late", label:"기한 지남", n:late, c:"var(--danger)"});
  $("#tabs").innerHTML = items.map(t=>`<button class="tab" type="button" data-s="${t.id}" aria-pressed="${S.filter.status===t.id}">${t.c?`<span class="sw" style="background:${t.c}"></span>`:""}${t.label}<span class="n">${t.n}</span></button>`).join("");
  $("#tabs").onclick = e => { const b=e.target.closest(".tab"); if(!b) return; resetShown(); S.filter.status=b.dataset.s; renderTabs(); renderList(); };

function renderList(){
  const f=S.filter;
  let rows = baseFiltered().filter(r=>{
    if(f.status==="late"){ if(!isLate(r)) return false; }
    else if(f.status!=="all" && r.status!==f.status) return false;
    if(f.q){ const hay=(code(r.id)+" "+r.title+" "+(r.body||"")+" "+(r.screen_ref||"")+" "+(r.author_name||"")).toLowerCase(); if(!hay.includes(f.q)) return false; }
    return true;
  });
  const by = {
    updated:(a,b)=>new Date(b.updated_at)-new Date(a.updated_at),
    created:(a,b)=>new Date(b.created_at)-new Date(a.created_at),
    due:(a,b)=>(a.due_date||"9999")<(b.due_date||"9999")?-1:(a.due_date||"9999")>(b.due_date||"9999")?1:0,
    priority:(a,b)=>(PRIO_RANK[a.priority]-PRIO_RANK[b.priority]) || (new Date(b.updated_at)-new Date(a.updated_at))
  };
  rows.sort(by[f.sort]);
  const total = rows.length;
  rows = rows.slice(0, S.shown);
  const el=$("#list");
  if(!rows.length){
    el.innerHTML = `<div class="empty">${S.reqs.length ? "조건에 맞는 요청이 없습니다." : "아직 등록된 요청이 없습니다. 오른쪽 위 ‘새 요청’으로 시작하세요."}</div>`;
    return;
  }
  el.innerHTML = `<div class="list-head"><span>번호</span><span>요청</span><span>회신 기한</span><span>상태</span></div>` +
    rows.map(r=>{
      const c=catOf(r.category_id); const late=isLate(r);
      return `<button class="row ${r.author_role==="client"?"client":""} ${S.openId===r.id?"active":""}" type="button" data-id="${r.id}">
        <span class="code">${code(r.id)}</span>
        <span class="main">
          <span class="t">${r.priority!=="normal"?`<span class="prio ${r.priority}">${PRIORITIES.find(p=>p.id===r.priority).label}</span> `:""}${esc(r.title)}</span>
          <span class="sub">
            <span class="tgt ${r.target==="admin"?"admin":""}">${targetLabel(r.target)}</span>
            <span class="cat">${ic(c.icon)}${esc(c.name)}</span>
            <span class="by ${esc(r.author_role||"")}">${esc(r.author_name||"")} · ${ROLES[r.author_role]||""}</span>
            ${r.screen_ref?`<span>${ic("screen")}${esc(r.screen_ref)}</span>`:""}
            ${r.reply_count?`<span>${ic("chat")}답변 ${r.reply_count}</span>`:""}
            ${r.file_count?`<span>${ic("clip")}첨부 ${r.file_count}</span>`:""}
            <span>${ago(r.updated_at)}</span>
          </span>
        </span>
        <span class="due ${late?"late":""}">${r.due_date?fmtDate(r.due_date):"—"}${late?"<small> 기한 지남</small>":""}</span>
        <span class="pill st-${r.status}">${statusLabel(r.status)}</span>
      </button>`;
    }).join("") +
    (total > rows.length ? `<button class="more" type="button" id="moreBtn">더보기 <span class="mono">${rows.length} / ${total}</span></button>` : "");
  el.onclick = e => {

        <h3>${ic("chat")}답변 <span class="n">${r.replies.length}</span></h3>
        <div class="thread">
          ${events.length ? events.map(ev=> ev.kind==="log"
            ? `<div class="sys">${esc(ev.x.changed_by||"")}님이 상태를 ‘${statusLabel(ev.x.to_status)}’(으)로 변경 · ${ago(ev.t)}</div>`
            : (()=>{ const x=ev.x; const role=x.author_role; return `
              <div class="msg ${esc(role||"")}">
                <span class="av ${esc(role||"")}">${esc((x.author_name||"?").slice(0,1))}</span>
                <div>
                  <div class="msg-head"><b>${esc(x.author_name)}</b>${roleBadge(role)}<time datetime="${x.created_at}">${fmtDateTime(x.created_at)}</time></div>
                  ${x.body?`<div class="bubble">${esc(x.body)}</div>`:""}
                  ${filesHTML(x.attachments)}
                </div>
              </div>`; })()
          ).join("") : `<p class="lede" style="font-size:13px;margin:0">아직 답변이 없습니다.</p>`}
        </div>

        <div class="composer" id="replyBox">
          <label class="sr" for="replyText">답변 입력</label>
          <textarea id="replyText" maxlength="5000" placeholder="답변이나 추가 내용을 입력하세요 · 이미지는 붙여넣기도 됩니다"></textarea>
          <div class="chips" id="replyChips" style="padding:0 12px"></div>
          <div class="bar">
            <button class="btn ghost sm who-sm" type="button" id="replyWho" title="작성자 변경">${replyWhoHTML()}</button>
            <button class="btn ghost sm" type="button" id="replyAttach">${ic("clip")}첨부</button>
            <label class="sr" for="replyStatus">상태 함께 변경</label>
            <select id="replyStatus"><option value="">상태 유지</option>${statusOpts}</select>
            <span class="grow"></span>
            <button class="btn primary sm" type="button" id="replySend">${ic("send")}등록</button>
          </div>
        </div>
        <p class="lede" style="font-size:12px;margin-top:6px">Ctrl + Enter로 바로 등록됩니다.</p>
      </div>
    </div>`);

  $("#closeP").onclick = closePanel;
  const renderReplyChips = () => { $("#replyChips").innerHTML = chipsHTML(S.replyFiles,"reply"); $("#replyChips").style.paddingBottom = S.replyFiles.length?"10px":"0"; };
  renderReplyChips();
  $("#replyChips").onclick = e => { const b=e.target.closest("[data-rm]"); if(!b) return; S.replyFiles.splice(+b.dataset.rm.split(":")[1],1); renderReplyChips(); };
  $("#replyAttach").onclick = () => pickFiles(fs=>{ S.replyFiles.push(...fs); renderReplyChips(); });
  $("#replyText").addEventListener("paste", e=>{ const fs=[...(e.clipboardData?.files||[])]; if(fs.length){ e.preventDefault(); S.replyFiles.push(...checkFiles(fs.map(renamePasted))); renderReplyChips(); } });
  const box=$("#replyBox");
  box.addEventListener("dragover", e=>{ e.preventDefault(); });
  box.addEventListener("drop", e=>{ e.preventDefault(); S.replyFiles.push(...checkFiles([...e.dataTransfer.files])); renderReplyChips(); });

  const send = async () => {
    const body=$("#replyText").value.trim(); const st=$("#replyStatus").value;
    if(!body && !S.replyFiles.length && !st){ $("#replyText").focus(); return; }
    const btn=$("#replySend"); btn.disabled=true; btn.textContent="등록 중…";
    try{
      await S.store.reply(r.id, body, S.replyFiles, st||null, S.me);
      S.replyFiles=[]; toast(st ? `답변을 등록하고 ‘${statusLabel(st)}’(으)로 변경했습니다` : "답변을 등록했습니다");
      await refresh(); openDetail(r.id);
      setTimeout(()=>{ const pb=$(".panel-body"); if(pb) pb.scrollTop=pb.scrollHeight; }, 30);
    }catch(e){ console.error(e); toast("등록하지 못했습니다: "+(e.message||e)); btn.disabled=false; btn.innerHTML=ic("send")+"등록"; }
  };
  $("#replySend").onclick = () => needMe(send);
  $("#replyWho").onclick = () => openIdentity();
  $("#replyText").addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.ctrlKey||e.metaKey)) needMe(send); });

  $("#statusCtl").onclick = async e => {
    const b=e.target.closest("button"); if(!b || b.dataset.s===r.status) return;
    if(!S.me?.name) return openIdentity(()=>b.click());
    try{ await S.store.setStatus(r.id, b.dataset.s, S.me); toast(`‘${statusLabel(b.dataset.s)}’(으)로 변경했습니다`); await refresh(); openDetail(r.id, true); }
    catch(err){ toast("변경하지 못했습니다: "+(err.message||err)); }
  };
  bindLightbox($("#panel"));
}

function bindLightbox(root){
  root.querySelectorAll("[data-img]").forEach(b=>b.onclick=()=>{
    const lb=document.createElement("div"); lb.className="lightbox";
    lb.innerHTML=`<img src="${esc(b.dataset.img)}" alt=""><button class="icon-btn" type="button" aria-label="닫기">${ic("x")}</button>`;
    lb.onclick=ev=>{ if(ev.target.tagName!=="IMG") lb.remove(); };
    document.body.appendChild(lb);
  });
}

/* ---------- 파일 선택 ---------- */
function pickFiles(cb){
  const inp=$("#filepick"); inp.value="";
  inp.onchange=()=>cb(checkFiles([...inp.files]));
  inp.click();
}
function checkFiles(fs){
  const max=CONFIG.MAX_FILE_MB*1048576; const ok=[]; const big=[];
  fs.forEach(f=> f.size>max ? big.push(f.name) : ok.push(f));
  if(big.length) toast(`파일당 ${CONFIG.MAX_FILE_MB}MB까지 올릴 수 있습니다. 올리지 못한 파일: ${big.join(", ")}`);
  return ok;
}
function renamePasted(f){
  if(f.name && f.name!=="image.png") return f;
  const d=new Date(); const n=`붙여넣은_이미지_${d.getHours()}${String(d.getMinutes()).padStart(2,"0")}${String(d.getSeconds()).padStart(2,"0")}.png`;
  try{ return new File([f], n, {type:f.type}); }catch(e){ return f; }
}

/* ---------- 새 요청 작성 ---------- */
const DRAFT_KEY="lions-req-draft";
function openComposer(){
  S.openId=null; S.draftFiles=[]; renderList();
  const d = ls.get(DRAFT_KEY, null);
  if(d && d.category_id && (d.title||d.body)) return showForm(d.category_id, d);
  showCategoryStep();
}
function showCategoryStep(){
  openPanel(`
    <div class="panel-head"><div class="grow"><b>새 요청</b></div><button class="icon-btn" type="button" id="closeP" aria-label="닫기">${ic("x")}</button></div>
    <div class="panel-body">
      <div class="step-label">1 / 2 단계</div>
      <h2 style="margin-bottom:4px">어떤 요청인가요?</h2>
      <p class="lede">카테고리를 고르면 맞는 작성 안내가 나옵니다.</p>
      <div class="cats" id="cats">
        ${S.cats.map(c=>`<button class="cat-tile" type="button" data-c="${esc(c.id)}"><span class="ic">${ic(c.icon)}</span><span class="txt"><b>${esc(c.name)}</b><span>${esc(c.description||"")}</span></span></button>`).join("")}
      </div>
    </div>`);
  $("#closeP").onclick = closePanel;
  $("#cats").onclick = e => { const b=e.target.closest(".cat-tile"); if(b) showForm(b.dataset.c, ls.get(DRAFT_KEY,{})); };
}
function showForm(catId, draft={}){
  const c=catOf(catId);
  const prio = draft.priority || "normal";
  const target0 = draft.target || "app";
  openPanel(`
    <div class="panel-head">
      <button class="icon-btn" type="button" id="backP" aria-label="카테고리 다시 고르기">${ic("back")}</button>
      <div class="grow"><b>새 요청</b></div>
      <button class="icon-btn" type="button" id="closeP" aria-label="닫기">${ic("x")}</button>
    </div>
    <form class="panel-body form" id="reqForm" novalidate>
      <div>
        <div class="step-label">2 / 2 단계</div>
        <div class="picked"><span class="cat">${ic(c.icon)}${esc(c.name)}</span><span class="grow"></span><button class="linkish" type="button" id="changeCat">변경</button></div>
      </div>
      <div>
        <span class="lb" id="tgtLb">구분<em>*</em></span>
        <div class="seg role-seg" id="fTarget" role="group" aria-labelledby="tgtLb">${TARGETS.map(t=>`<button type="button" data-t="${t.id}" aria-pressed="${t.id===target0}">${t.label}</button>`).join("")}</div>
      </div>
      <div>
        <label class="lb" for="fTitle">제목<em>*</em></label>
        <input class="field" id="fTitle" maxlength="80" placeholder="한 줄로 요약해주세요" value="${esc(draft.title||"")}">
        <span class="err" id="eTitle" hidden>제목을 입력해주세요.</span>
      </div>
      <div>
        <label class="lb" for="fBody">내용<em>*</em></label>
        <textarea class="field" id="fBody" maxlength="5000" placeholder="${esc(c.hint||"요청 내용을 적어주세요.")}">${esc(draft.body||"")}</textarea>
        <span class="err" id="eBody" hidden>내용을 입력해주세요.</span>
      </div>
      <div class="two">
        <div>
          <label class="lb" for="fScreen">관련 화면<small>선택</small></label>
          <input class="field" id="fScreen" placeholder="예) HOME-01, ADMIN-03" value="${esc(draft.screen_ref||"")}">
        </div>
        <div>
          <label class="lb" for="fUrl">관련 URL<small>선택</small></label>
          <input class="field" id="fUrl" type="url" inputmode="url" placeholder="https://" value="${esc(draft.ref_url||"")}">
        </div>
      </div>
      <div class="two">
        <div>
          <label class="lb" for="fDue">회신 기한<small>선택</small></label>
          <input class="field" id="fDue" type="date" min="${todayStr()}" value="${esc(draft.due_date||"")}">
        </div>
        <div>
          <span class="lb" id="prioLb">우선순위</span>
          <div class="seg role-seg" id="fPrio" role="group" aria-labelledby="prioLb">${PRIORITIES.map(p=>`<button type="button" data-p="${p.id}" aria-pressed="${p.id===prio}">${p.label}</button>`).join("")}</div>
        </div>
      </div>
      <div>
        <span class="lb">자료·이미지 첨부<small>파일당 최대 ${CONFIG.MAX_FILE_MB}MB</small></span>
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="파일 첨부">파일을 끌어다 놓거나 <b>클릭해서 선택</b>하세요<br>이미지는 내용 칸에 붙여넣어도(Ctrl+V) 첨부됩니다</div>
        <div class="chips" id="fChips"></div>
      </div>
    </form>
    <div class="panel-foot">
      <button class="foot-who" type="button" id="formWho" title="작성자 변경">${formWhoHTML()}</button>
      <span class="grow"></span>
      <button class="btn ghost" type="button" id="cancelF">취소</button>
      <button class="btn primary" type="submit" form="reqForm" id="submitF">요청 등록</button>
    </div>`);

  let priority = prio, target = target0;
  $("#fTarget").onclick = e => { const b=e.target.closest("button"); if(!b) return; target=b.dataset.t; $("#fTarget").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); saveDraft(); };
  $("#formWho").onclick = () => openIdentity(()=>{ const w=$("#formWho"); if(w) w.innerHTML=formWhoHTML(); });
  const saveDraft = () => ls.set(DRAFT_KEY, {category_id:catId, target, title:$("#fTitle").value, body:$("#fBody").value, screen_ref:$("#fScreen").value, ref_url:$("#fUrl").value, due_date:$("#fDue").value, priority});
  const renderChips = () => { $("#fChips").innerHTML = chipsHTML(S.draftFiles,"draft"); };
  renderChips();
  ["#fTitle","#fBody","#fScreen","#fUrl","#fDue"].forEach(s=>$(s).addEventListener("input", saveDraft));
  $("#fPrio").onclick = e => { const b=e.target.closest("button"); if(!b) return; priority=b.dataset.p; $("#fPrio").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); saveDraft(); };
  $("#fChips").onclick = e => { const b=e.target.closest("[data-rm]"); if(!b) return; S.draftFiles.splice(+b.dataset.rm.split(":")[1],1); renderChips(); };
  const drop=$("#drop");
  drop.onclick = () => pickFiles(fs=>{ S.draftFiles.push(...fs); renderChips(); });
  drop.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); drop.click(); } };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); S.draftFiles.push(...checkFiles([...e.dataTransfer.files])); renderChips(); };
  $("#fBody").addEventListener("paste", e=>{ const fs=[...(e.clipboardData?.files||[])]; if(fs.length){ e.preventDefault(); S.draftFiles.push(...checkFiles(fs.map(renamePasted))); renderChips(); toast("이미지를 첨부했습니다"); } });

  $("#closeP").onclick = closePanel;
  $("#cancelF").onclick = () => { ls.del(DRAFT_KEY); closePanel(); };
  $("#backP").onclick = $("#changeCat").onclick = () => { saveDraft(); showCategoryStep(); };
  setTimeout(()=>$("#fTitle").focus(), 250);

  $("#reqForm").onsubmit = async e => {
    e.preventDefault();
    const title=$("#fTitle").value.trim(), body=$("#fBody").value.trim();
    $("#eTitle").hidden=!!title; $("#eBody").hidden=!!body;
    if(!title){ $("#fTitle").focus(); return; } if(!body){ $("#fBody").focus(); return; }
    if(!S.me?.name) return openIdentity(()=>{ $("#formWho").innerHTML=formWhoHTML(); $("#reqForm").requestSubmit(); });
    let url=$("#fUrl").value.trim(); if(url && !/^https?:\/\//i.test(url)) url="https://"+url;
    const btn=$("#submitF"); btn.disabled=true; btn.textContent= S.draftFiles.length ? "파일 올리는 중…" : "등록 중…";
    try{
      const row = await S.store.create({category_id:catId, target, title, body, screen_ref:$("#fScreen").value.trim()||null, ref_url:url||null, due_date:$("#fDue").value||null, priority}, S.draftFiles, S.me);
      ls.del(DRAFT_KEY); S.draftFiles=[];
      toast(`${code(row.id)} 요청을 등록했습니다`);
      S.filter.status="all"; await refresh(); openDetail(row.id);
    }catch(err){ console.error(err); toast("등록하지 못했습니다: "+(err.message||err)); btn.disabled=false; btn.textContent="요청 등록"; }
  };
}

boot();
</script>
