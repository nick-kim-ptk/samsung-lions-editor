<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼성라이온즈 기능 정의 및 화면 설계서</title>
<!-- Pretendard 웹폰트 (화면에 쓰인 글자만 나눠 받는 방식이라 가볍다) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --clr-brand:#0a3d91;
  --clr-brand-deeper:#062d6e;
  --clr-brand-deep:#081f56;
  --clr-brand-glow:#2f62cc;
  --clr-accent:#ffc20e;
  --bg-app:#0a1f4d;
  --bg-app-2:#0d2867;
  --panel:#ffffff;
  --panel-2:#f6f8fc;
  --line:#d7deeb;
  --line-2:#bcc7da;
  --ink:#15233f;
  --sub:#5b6a87;
  --sub-2:#8089a0;
  --ok:#1a8754;
  --warn:#b9750b;
  --draft:#808aa1;
  --danger:#c0392b;
  --danger-soft:#fde8ea;
  --hl:#fff4cc;
  --acc-soft:#e6efff;

  --fs-title:22px;
  --fs-fid:16px;
  --fs-h2:16px;
  --fs-h3:15px;
  --fs-base:14px;
  --fs-meta:13px;
  --fs-mini:12px;
  --fs-bdg:11.5px;

  /* v18 간격/리듬 표준 */
  --sp-0:2px; --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:20px; --sp-7:24px;
  --h-hdr:54px;
  --pill-h:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard Variable","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:linear-gradient(180deg,var(--bg-app) 0%,var(--bg-app-2) 100%);
  color:var(--ink);font-size:var(--fs-base);line-height:1.55;
  letter-spacing:-.1px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard Variable","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:linear-gradient(180deg,var(--bg-app) 0%,var(--bg-app-2) 100%);
  color:var(--ink);font-size:var(--fs-base);line-height:1.5;
}
.app{display:grid;grid-template-rows:50px 1fr;height:100vh}

.app{display:grid;grid-template-rows:var(--h-hdr) 1fr;height:100vh}
button,input,select,textarea{font-family:inherit}

header{
  display:flex;align-items:center;gap:var(--sp-4);
  padding:0 18px;height:var(--h-hdr);
  background:linear-gradient(90deg,var(--clr-brand-deep),var(--clr-brand));
  color:#fff;border-bottom:2px solid var(--clr-brand-deeper);
}
header h1{
  font-size:17px;font-weight:800;letter-spacing:-.2px;
  display:flex;align-items:center;gap:var(--sp-3);margin:0;
}
header h1 .sub{font-size:11.5px;font-weight:600;color:#a8c1ee;margin-left:6px;letter-spacing:0}
header .credit{display:inline-flex;align-items:center;justify-content:center;align-self:center;margin-left:auto;margin-right:var(--sp-3);font-size:13px;font-weight:700;color:rgba(234,240,255,.78);letter-spacing:.4px}
header h1{align-self:center}
header .pill{display:inline-flex;align-items:center;height:var(--pill-h);background:rgba(255,255,255,.12);padding:0 10px;border-radius:14px;color:#eaf0ff;font-size:var(--fs-mini);font-weight:600;letter-spacing:.1px}
header .sp{flex:1;min-width:var(--sp-3)}
/* 저장 필요 표시 — 제목 바로 오른쪽, 눈에 띄게 */
#unsavedBadge{display:none;align-items:center;gap:6px;height:26px;padding:0 12px 0 10px;border-radius:13px;background:var(--clr-accent);color:var(--clr-brand-deep);font-size:12.5px;font-weight:900;white-space:nowrap;letter-spacing:-.1px;box-shadow:0 0 0 3px rgba(255,194,14,.28)}
#unsavedBadge::before{content:"";width:8px;height:8px;border-radius:50%;background:#d7263d;animation:pulse 1.2s ease-in-out infinite}
header button{display:inline-flex;align-items:center;justify-content:center;height:var(--pill-h);background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:5px;padding:0 14px;font-size:var(--fs-base);cursor:pointer;font-weight:600;letter-spacing:-.1px}
header button:hover{background:rgba(255,255,255,.24)}
header button.primary{background:var(--clr-accent);color:var(--clr-brand-deep);border-color:var(--clr-accent);font-weight:800}
header button.primary:hover{background:#ffd443}
header button.closing{background:#fff;color:var(--clr-brand-deep);border-color:#fff;font-weight:800}
header button.closing:hover{background:#e8eefc}
header button.danger{background:rgba(255,255,255,.06);color:#ffd9c8;border-color:#c97a72}

.main{display:grid;grid-template-columns:minmax(220px,2fr) minmax(360px,4fr) minmax(360px,4fr);gap:var(--sp-4);padding:var(--sp-4);overflow:hidden}
.history-screen{display:none;padding:var(--sp-4);overflow:hidden;min-height:0}
.history-screen.show{display:flex}
.hist-compose{flex:none}
.hist-compose-label{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:6px}
.hist-compose-row{display:flex;gap:10px;align-items:stretch}
.hist-compose-row textarea{flex:1;min-height:64px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;resize:vertical;box-sizing:border-box}
.hist-compose-row textarea:focus{outline:none;border-color:var(--clr-brand);box-shadow:0 0 0 2px rgba(10,61,145,.16)}
.hist-compose-row button{flex:none;padding:0 26px;background:var(--clr-brand);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:800;font-size:14px}
.hist-compose-row button:hover{background:var(--clr-brand-deep)}
.hist-compose-tip{font-size:11.5px;color:var(--sub);margin-top:6px}
.hist-table{width:100%;border-collapse:collapse;font-size:13px}
.hist-table thead th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:9px 12px;font-size:12px;color:var(--sub);font-weight:800;border-bottom:1px solid var(--line);z-index:1}
.hist-table tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.hist-content{white-space:pre-wrap;word-break:break-word;line-height:1.6}
.hist-table tbody tr:last-child td{border-bottom:none}
.hist-table tbody tr:hover td{background:var(--acc-soft)}
.hist-ver{font-family:Consolas,monospace;font-weight:800;color:var(--clr-brand);white-space:nowrap}
.hist-chip{display:inline-block;border:1px solid var(--clr-brand);color:var(--clr-brand);border-radius:4px;padding:1px 6px;font-family:Consolas,monospace;font-size:12px;font-weight:800;cursor:pointer;margin-right:4px;white-space:nowrap}
.hist-chip:hover{background:var(--clr-brand);color:#fff}
.hist-date{white-space:nowrap;color:var(--sub);font-size:12.5px}
.hist-del{cursor:pointer;color:var(--sub-2)}
.hist-del:hover{color:var(--danger)}
.hist-by{font-weight:700;color:var(--text);white-space:nowrap}
.hist-author{color:var(--sub);font-weight:700;font-size:11.5px;margin-right:6px}
.hist-empty{text-align:center;color:var(--sub-2);font-size:13px;padding:40px 10px}
.col{background:var(--panel);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.35);box-shadow:0 6px 18px rgba(0,0,0,.18);min-width:0}
.col-h{display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);height:42px;border-bottom:1px solid var(--line);font-size:var(--fs-h2);font-weight:800;color:var(--ink);background:var(--panel-2);flex:none}
.col-h .pill{display:inline-flex;align-items:center;height:22px;background:var(--clr-brand);color:#fff;padding:0 10px;border-radius:11px;font-size:var(--fs-mini);font-weight:800;letter-spacing:.3px;flex:none}
.col-h .sp{flex:1;min-width:var(--sp-2)}
.col-h .info{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;background:#eef3fb;color:var(--sub);font-size:11.5px;font-weight:700;letter-spacing:-.1px;flex:none;white-space:nowrap}
.col-h button{display:inline-flex;align-items:center;height:26px;font-size:var(--fs-meta);background:#fff;border:1px solid var(--line);border-radius:13px;padding:0 12px;cursor:pointer;color:var(--ink);font-weight:700;flex:none}
.col-h button:hover{background:var(--bg-app-2);color:#fff;border-color:var(--clr-brand)}
.col-h button.primary{background:var(--clr-brand);color:#fff;border-color:var(--clr-brand)}
/* 구역 상세 패널 타이틀 옆 삭제 버튼 — 화면 삭제 버튼과 같은 아이콘 전용 버튼이지만, 이 패널은 배경이 밝아서 흰색 대신 danger 색으로 테두리를 맞춘다 */
/* .col-h button 의 기본 pill 스타일(패딩·둥근 테두리·회색 border 등)보다 확실히 우선 적용되도록 id로 지정 */
.col-h #btnDelSec2.icon-del-btn{flex:none;width:26px;height:26px;padding:0;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--danger);color:var(--danger);cursor:pointer}
.col-h #btnDelSec2.icon-del-btn:hover{background:var(--danger-soft)}
.col-b{flex:1;overflow:auto;padding:var(--sp-4);min-width:0}

.grp-row{font-size:14px;font-weight:800;padding:9px 12px;display:flex;align-items:center;gap:6px;border-radius:7px;cursor:pointer;background:var(--panel-2);margin-bottom:5px;color:var(--ink);border:1px solid var(--line)}
.grp-row:hover{background:var(--acc-soft)}
.grp-row .arrow{font-size:11px;color:var(--clr-brand);width:14px}
.grp-row .gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-row .n{color:var(--sub);font-weight:600;flex:none;text-align:right;font-size:var(--fs-mini);white-space:nowrap}
.grp-row .act{opacity:0;display:flex;gap:5px;color:var(--sub);font-size:var(--fs-mini);font-weight:600}
.grp-row:hover .act{opacity:1}
.grp-row .act span{cursor:pointer;padding:0 3px}
.grp-row .act span:hover{color:var(--danger)}

.scr-row{font-size:14px;padding:7px 10px 7px 26px;border-radius:6px;cursor:pointer;color:var(--sub);display:flex;gap:8px;align-items:center;margin-bottom:3px;border:1px solid transparent}
.scr-row .sid{color:var(--clr-brand);font-weight:800;font-family:Consolas,monospace;font-size:13.5px}
.scr-row .nm{font-size:14px;color:var(--ink);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr-row.active{background:var(--acc-soft);border-color:var(--clr-brand)}
.scr-row.active .sid,.scr-row.active .nm{color:var(--clr-brand-deep)}
.scr-row.dragging{opacity:.4}
.scr-row.drag-over{background:var(--hl);outline:2px dashed var(--clr-brand)}
.grp-row.drag-over{background:var(--hl);outline:2px dashed var(--clr-brand)}

.empty{color:var(--sub-2);text-align:center;padding:48px 16px;font-size:var(--fs-meta);line-height:1.6}
.empty .em-path{color:var(--clr-brand);font-weight:700}

.screen-head{padding:14px 18px 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;line-height:1.5}
.screen-head .title{margin:6px 0 0;gap:var(--sp-3);line-height:1.4}
.screen-head .meta{font-size:14px;color:var(--clr-brand);margin:2px 0 6px;display:flex;gap:10px;align-items:center;font-family:Consolas,monospace;flex-wrap:wrap;line-height:1.5}
.screen-head .meta .scrId{font-weight:800;letter-spacing:.2px;color:var(--clr-brand);background:#eef3fb;padding:3px 9px;border-radius:5px;font-size:13.5px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:13px;font-weight:700;background:#eef3fb;color:var(--ink);border:1px solid var(--line);white-space:nowrap;letter-spacing:-.1px;flex:none}
.chip-id{background:#eef3fb;color:var(--clr-brand);font-family:Consolas,monospace;font-weight:800;letter-spacing:.2px;font-size:13.5px}
.idcopy{flex:none;width:24px;height:24px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--clr-brand);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.idcopy:hover{background:var(--acc-soft)}
.idcopy.ok{color:var(--ok);border-color:var(--ok)}
.rel-link{color:var(--clr-brand);text-decoration:underline;cursor:pointer}
.chip-grp{background:#eef3fb;color:#5b6a87;font-weight:600}
.chip-tp{background:var(--clr-brand);color:#fff;padding:0 10px;height:24px;border-radius:12px;font-size:13px;font-weight:800;letter-spacing:.1px;border:0}
.chip-sep{display:inline-flex;align-items:center;color:var(--sub);font-weight:700;margin:0 2px;font-size:13px}
/* .meta-row 제거됨 — 우측 첫줄 ID chip 영역 삭제 */
.screen-head .meta .gid{color:var(--clr-brand);font-weight:900;font-size:15px;background:transparent;padding:0}
.screen-head .meta .grpName{color:var(--ink);font-family:"Pretendard Variable","Pretendard","Malgun Gothic",sans-serif;font-weight:700;font-size:13px}
.screen-head .title{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.screen-head .fid{font-family:Consolas,monospace;font-size:var(--fs-fid);font-weight:800;color:var(--clr-brand);background:transparent;padding:0}
.screen-head .fnm{font-size:var(--fs-title);font-weight:800;color:var(--ink)}
.screen-head input,.screen-head select{padding:6px 9px;border:1px solid var(--line);border-radius:4px;font-size:var(--fs-base);font-family:inherit;background:#fff}
.screen-head input:focus,.screen-head select:focus{outline:none;border-color:var(--clr-brand)}
.screen-head input.bordered{border:0;border-bottom:1px dashed var(--line);background:transparent;font-size:22px;font-weight:800;width:280px}
.screen-head .row{display:flex;gap:8px;margin-top:10px;font-size:var(--fs-meta);align-items:center;flex-wrap:wrap}
.screen-head .row .label{color:var(--sub);width:64px;flex:none;font-weight:700}

.badge{font-size:var(--fs-bdg);padding:3px 8px;border-radius:4px;font-weight:800;letter-spacing:.2px}
.b-wd{background:#e9edf5;color:var(--draft)}
.b-wr{background:#fff1d4;color:#8c5d00}
.b-ok{background:#dff4e8;color:var(--ok)}
.b-tp-func{background:var(--clr-brand);color:#fff}
.b-tp-ad{background:#ffe2c8;color:#a25b00}
.b-tp-out{background:#e8e6ff;color:#4338b0}
.b-tp-link{background:#d8e9ff;color:#1e4376}

.addsec{padding:0 16px;height:38px;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);background:var(--panel-2);border-bottom:1px solid var(--line);flex:none}
.addsec .addsec-tip{font-size:11.5px;color:var(--sub);font-weight:600;letter-spacing:-.1px;line-height:1.2}
.addsec .addsec-tip b{color:var(--clr-brand)}
.addsec button{display:inline-flex;align-items:center;height:26px;font-size:var(--fs-meta);background:var(--clr-brand);color:#fff;border:1px solid var(--clr-brand);border-radius:13px;padding:0 12px;cursor:pointer;font-weight:700;flex:none}
.addsec button:hover{background:var(--clr-brand-deep)}

/* ── 가운데 컬럼: 좌우 영역과 같은 흰색 카드 ── */
.col.mid-col .col-h #btnDelScr2{flex:none;width:26px;height:26px;padding:0;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--danger);color:var(--danger);cursor:pointer}
.col.mid-col .col-h #btnDelScr2:hover{background:var(--danger-soft)}
.col.mid-col #midTitle{font-weight:800;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col.mid-col .screen-head{background:#fff;padding:12px 16px 14px;border-bottom:1px solid var(--line)}
.col.mid-col .screen-head input.bordered{font-size:18px;width:100%}

.sec-list{padding:14px 12px 22px;flex:1;overflow:auto;min-width:0;min-height:0}
.midsplit{display:flex;align-items:stretch;gap:12px;padding:0 14px 14px;flex:1;min-height:0;overflow:hidden}
.sec{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;cursor:grab;display:flex;align-items:center;gap:10px;user-select:none;min-height:44px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.sec:hover{border-color:var(--line-2)}
/* 가운데 구역 카드 톤 — 진행상황(작성중/검토중/확정)에 맞춰 카드 전체 배경이 조화를 이루도록 함 */
.sec.selected{background:var(--acc-soft);border-color:var(--clr-brand);outline:1px solid var(--clr-brand)}
.sec.dragging{opacity:.4}
.sec.drag-over{border-top:3px solid var(--clr-brand)}
.sec .num{position:static;font-size:12.5px;color:#fff;font-weight:900;width:26px;height:26px;background:#bd3511;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 8px rgba(10,61,145,.4);border:2px solid #fff;align-self:center}
.sec .ti{font-size:var(--fs-base);font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.sec .bdgbox{display:flex;gap:4px;flex:none}
.sec .act{opacity:0;display:flex;gap:5px;color:var(--sub);font-size:var(--fs-mini);font-weight:700}
.sec:hover .act{opacity:1}
.sec .act span{cursor:pointer;padding:0 4px}
.sec .act span:hover{color:var(--danger)}

.sec-edit{padding:16px 18px;flex:1;overflow:auto;background:#fff}
/* 진행 상태 톤(작성중/검토중/확정) — 구역 영역 배경이 chip 색상과 조화를 이루도록 토닝 */
.sec-edit.t-wd{background:linear-gradient(180deg,#fbfdff 0%,#eef3fb 100%)}
.sec-edit.t-wr{background:linear-gradient(180deg,#fffaf0 0%,#ffe9c4 100%)}
.sec-edit.t-ok{background:linear-gradient(180deg,#f7fbf6 0%,#e2f1e3 100%)}
.sec-edit h3{font-size:var(--fs-h2);font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-edit .badgebox{display:flex;gap:6px}
.sec-edit .badgebox .badge{cursor:pointer;border:1px solid var(--line);user-select:none}
.sec-edit .badgebox .badge.active{border-color:currentColor;outline:1px solid currentColor;box-shadow:inset 0 0 0 1px currentColor}

.rower{margin-bottom:14px}
.rower .lbl{font-size:var(--fs-meta);font-weight:800;color:var(--ink);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.rower .lbl .req{color:var(--clr-accent);font-weight:900}
.rower input,.rower textarea,.rower select{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:var(--fs-base);font-family:inherit;background:#fff;color:var(--ink)}
.rower input:focus,.rower textarea:focus,.rower select:focus{outline:none;border-color:var(--clr-brand);box-shadow:0 0 0 2px rgba(10,61,145,.16)}
.rower textarea{min-height:80px;resize:vertical}
.rower.hl textarea{background:var(--hl);font-weight:700}
.rower.hl input{background:var(--hl);font-weight:700}
.rower.err input,.rower.err textarea{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.rower .tip{font-size:var(--fs-mini);color:var(--sub);margin-top:4px}
.rower .chipbox{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line);border-radius:5px;background:#fff;min-height:38px;align-items:center}
.rower .chip{background:var(--clr-brand);color:#fff;padding:3px 9px;border-radius:4px;font-size:var(--fs-mini);display:flex;gap:6px;align-items:center;font-family:Consolas,monospace;font-weight:800}
.rower .chip .x{cursor:pointer;font-size:14px;color:#ffd}
.rower .chip .x:hover{color:var(--clr-accent)}
.rower .chipadd{background:var(--clr-accent);color:var(--clr-brand-deep);border:0;border-radius:4px;padding:4px 11px;font-size:var(--fs-mini);cursor:pointer;font-weight:800}
.rower .chipadd:hover{background:#ffd443}

.typebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.typechip{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.typechip:hover{background:var(--acc-soft);border-color:var(--clr-brand)}
.typechip.on.func{background:var(--clr-brand);color:#fff;border-color:var(--clr-brand)}
.typechip.on.ad{background:#a25b00;color:#fff;border-color:#a25b00}
.typechip.on.out{background:#4338b0;color:#fff;border-color:#4338b0}
.typechip.on.link{background:#1e4376;color:#fff;border-color:#1e4376}
.typechip.on.prog{background:#5a6b85;color:#fff;border-color:#5a6b85}
.typechip.on.review{background:#b7791f;color:#fff;border-color:#b7791f}
.typechip.on.ok{background:#2e7d32;color:#fff;border-color:#2e7d32}

/* ── 진행 상황 / 구역 종류 나란히 배치 ── */
.rower-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.rower-row .rower{flex:1;margin-bottom:0;min-width:180px}

/* ── 구역 상세 아코디언: 작성된 항목만 기본 펼침, 미작성은 제목만 ── */
.acc-item{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc-item .acc-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-weight:800;font-size:var(--fs-meta);color:var(--ink);background:var(--panel-2);user-select:none}
.acc-item .acc-head:hover{background:var(--acc-soft)}
.acc-item .acc-arrow{font-size:11px;color:var(--clr-brand);width:12px;flex:none;transition:transform .15s}
.acc-item.is-open .acc-arrow{transform:rotate(90deg)}
.acc-item .acc-title{flex:1}
.acc-item .acc-dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.acc-item .acc-dot.filled{background:var(--ok)}
.acc-item .acc-panel{padding:12px 12px 14px;border-top:1px solid var(--line);display:none}
.acc-item.is-open .acc-panel{display:flex;flex-direction:column}
.acc-panel .rower{margin-bottom:0;flex:1;display:flex;flex-direction:column}
.acc-panel .rower textarea{flex:1;min-height:160px}
.acc-panel .rower input{min-height:44px}
/* 아코디언 패널 안에 rower로 감싸지 않고 직접 들어간 입력창들도 동일한 스타일이 적용되도록 보강 */
.acc-panel>textarea,.acc-panel>input,.acc-panel>select{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:var(--fs-base);font-family:inherit;background:#fff;color:var(--ink)}
.acc-panel>textarea:focus,.acc-panel>input:focus,.acc-panel>select:focus{outline:none;border-color:var(--clr-brand);box-shadow:0 0 0 2px rgba(10,61,145,.16)}
.acc-panel>textarea{flex:1;min-height:160px;resize:vertical}
.acc-panel>input{min-height:44px}
/* 구역 상세 입력폼(textarea): 기본 1줄 높이, Enter·줄바꿈이 늘어나면 그만큼 자동으로 높아진다.
   높이는 저장된 내용에서 매번 계산하므로 저장/새로고침 후에도 각 폼의 줄 수에 맞는 높이가 유지된다. */
.acc-item .acc-panel textarea[data-pf2]{flex:none;min-height:44px;resize:none;overflow:hidden;line-height:1.5}
/* 목적/개요(화면 헤더) 도 구역 상세 폼과 동일하게: 기본 1줄, 내용 줄 수만큼 자동으로 높아진다 */
.screen-head textarea[data-pf="subtitle"]{min-height:44px;resize:none;overflow:hidden;line-height:1.5}

.adbox{background:var(--danger-soft);border:1px solid var(--danger);border-radius:6px;padding:10px 12px;color:var(--danger);font-size:13px;font-weight:700;margin-bottom:10px}

.linkpreview{background:var(--acc-soft);border:1px solid var(--clr-brand);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.linkpreview:hover{background:var(--hl)}
.linkpreview.empty{background:var(--panel-2);border-style:dashed;color:var(--sub);cursor:default;font-size:13px}
.linkpreview .lkbtn{font-size:16px;font-weight:800;color:var(--clr-brand)}
.linkpreview .lkid{font-family:Consolas,monospace;font-size:12.5px;color:var(--sub);font-weight:700}

.imgbox{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:1px solid var(--line);border-radius:5px;background:#fff;min-height:56px;align-items:center;margin-top:6px}
.thumb{position:relative;width:72px;height:72px;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in;flex:none;background:var(--panel-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tx{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.62);color:#fff;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.thumb .tx:hover{background:var(--danger)}
/* 관련 자료 이미지: 영역보다 크면 영역 너비에 맞춰 축소(비율 유지), 작으면 원본 크기 그대로 표시 */
.relimgs{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:8px;border:1px solid var(--line);border-radius:5px;background:#fff}
.relimg{position:relative;display:block;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in;background:var(--panel-2)}
.relimg img{display:block;max-width:100%;height:auto}
/* 이미지 위쪽 바: [파일명] ··· [삭제]  — 삭제 버튼이 이미지를 가리지 않게 */
/* 공통 정의 화면 */
.defs-screen{display:none;grid-template-columns:minmax(260px,320px) 1fr;gap:var(--sp-4);padding:var(--sp-4);overflow:hidden;min-height:0}
.defs-screen.show{display:grid}
.defs-screen .col{min-height:0}
.defs-screen .grp-row.dcat{cursor:default}
.defs-screen .col-h .dtitle{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.defs-screen .col-h .icon-del-btn{flex:none;width:26px;height:26px;padding:0;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--danger);color:var(--danger)}
.defs-screen .col-h .icon-del-btn:hover{background:var(--danger-soft)}
.def-body{padding:16px 18px 24px}
.def-body textarea.dgrow{min-height:44px;resize:none;overflow:hidden;line-height:1.5}
.dtable-head{display:flex;align-items:center;gap:8px;margin:18px 0 6px}
.dtable-head .lbl{font-size:var(--fs-meta);font-weight:800}
.dtable-head .sp{flex:1}
.dhint{font-size:11.5px;color:var(--sub)}
.dbtn{height:26px;padding:0 12px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:var(--fs-meta);font-weight:700;cursor:pointer}
.dbtn:hover{border-color:var(--clr-brand);color:var(--clr-brand)}
.dbtn.primary{background:var(--clr-brand);border-color:var(--clr-brand);color:#fff}
.dtable-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;background:#fff}
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th{background:var(--panel-2);border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:middle;position:sticky;top:0;z-index:1}
.dtable td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top}
.dtable tr:last-child td{border-bottom:0}
.dtable th + th, .dtable td + td{border-left:1px solid #eef1f6}
.dtable .c-id{width:92px;white-space:nowrap}
.dtable td.c-id{padding-top:10px}
.dtable .rid{font-family:Consolas,monospace;font-weight:800;color:var(--clr-brand);font-size:12px}
.dtable .ruse{display:inline-block;margin-left:4px;margin-top:4px;padding:0 6px;border-radius:9px;background:#e7f4ec;color:var(--ok);font-size:10.5px;font-weight:800;cursor:pointer}
.dtable .c-act{width:62px;white-space:nowrap;text-align:center;color:var(--sub-2)}
.dtable td.c-act{padding-top:9px}
.dtable .c-act span{cursor:pointer;padding:0 3px;font-size:11px}
.dtable .c-act span.dis{opacity:.25;pointer-events:none}
.dtable .c-act span:hover{color:var(--clr-brand)}
.dtable .c-act .rx{font-size:15px}
.dtable .c-act .rx:hover{color:var(--danger)}
.dtable .colh{display:flex;align-items:center;gap:4px}
.dtable .colh input{flex:1;min-width:70px;height:28px;border:1px solid transparent;border-radius:4px;background:transparent;padding:0 6px;font-weight:800;font-size:12.5px;color:var(--ink)}
.dtable .colh input:hover{border-color:var(--line)}
.dtable .colh input:focus{outline:none;border-color:var(--clr-brand);background:#fff}
.dtable .colx{cursor:pointer;color:var(--sub-2);font-size:14px;padding:0 3px}
.dtable .colx:hover{color:var(--danger)}
.dtable textarea.dcell{width:100%;min-width:90px;min-height:32px;border:1px solid transparent;border-radius:4px;padding:6px 7px;font-size:13px;line-height:1.45;resize:none;overflow:hidden;background:transparent;color:var(--ink)}
.dtable textarea.dcell:hover{border-color:var(--line)}
.dtable textarea.dcell:focus{outline:none;border-color:var(--clr-brand);background:#fff;box-shadow:0 0 0 2px rgba(10,61,145,.12)}
.dtable tr.flash td{background:var(--hl);transition:background .3s}
.dtable .dempty{text-align:center;color:var(--sub-2);padding:18px}
.dusage{margin-top:22px}
.dusage .lbl{font-size:var(--fs-meta);font-weight:800;display:flex;align-items:center;gap:6px}
.dcount{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9px;background:#eef3fb;color:var(--clr-brand);font-size:11px}
.scrlink .sl-nm em{font-style:normal;font-weight:600;color:var(--sub);font-size:12.5px}
/* 화면 상단: 공통 정의 자동 모음 */
.defchips{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:6px 0 2px}
.defchips .lbl{font-size:11.5px;font-weight:800;color:var(--sub);margin-right:2px}
.defchip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;background:#f1ecff;color:#4338b0;border:1px solid #d8cffb;font-size:11.5px;font-weight:800;cursor:pointer}
.defchip:hover{background:#4338b0;color:#fff}
/* 화면 이미지 위 구역 영역 */
.shotbox{position:relative;display:block;width:100%}
.shotbox img{width:100%!important;max-width:none!important}
.area-layer{position:absolute;inset:0;pointer-events:none}
.area-box{position:absolute;border:2px solid #bd3511;border-radius:3px;background:rgba(189,53,17,.05);pointer-events:auto;cursor:pointer}
.area-box:hover{background:rgba(189,53,17,.12)}
.area-box.sel{border-width:3px;background:rgba(189,53,17,.16);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.area-no{position:absolute;top:-11px;left:-11px;width:22px;height:22px;border-radius:50%;background:#bd3511;color:#fff;border:2px solid #fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3);pointer-events:none;font-family:"Pretendard Variable","Pretendard","Malgun Gothic",sans-serif}
.imgbar label.img-rm{cursor:pointer}
/* 영역 편집 창 */
.ae{position:fixed;inset:16px;background:#fff;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.ae-head{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.ae-head b{font-size:15px}
.ae-head .sp{flex:1}
.ae-sub{font-size:12.5px;color:var(--sub);font-weight:700}
.ae-btn{height:32px;padding:0 13px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-weight:800;font-size:12.5px;cursor:pointer}
.ae-btn:hover:not(:disabled){border-color:var(--clr-brand);color:var(--clr-brand)}
.ae-btn:disabled{opacity:.4;cursor:default}
.ae-btn.primary{background:var(--clr-brand);border-color:var(--clr-brand);color:#fff}
.ae-btn.primary:hover:not(:disabled){background:var(--clr-brand-deep);color:#fff}
.ae-body{flex:1;min-height:0;display:flex}
.ae-stage{flex:1;min-width:0;overflow:auto;background:#e6ebf3;display:flex;justify-content:center;align-items:flex-start;padding:28px}
.ae-canvas{position:relative;width:min(520px,100%);flex:none;user-select:none;touch-action:none;cursor:crosshair}
.ae-canvas img{display:block;width:100%;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.18);background:#fff}
.ae-layer{position:absolute;inset:0}
.ae-box{position:absolute;border:2px solid #bd3511;border-radius:3px;background:rgba(189,53,17,.06);cursor:move}
.ae-box.cur{border-width:3px;background:rgba(189,53,17,.16)}
.ae-box .h{position:absolute;width:12px;height:12px;background:#fff;border:2px solid #bd3511;border-radius:2px}
.ae-box .h.nw{left:-8px;top:-8px;cursor:nwse-resize}
.ae-box .h.ne{right:-8px;top:-8px;cursor:nesw-resize}
.ae-box .h.sw{left:-8px;bottom:-8px;cursor:nesw-resize}
.ae-box .h.se{right:-8px;bottom:-8px;cursor:nwse-resize}
.ae-side{width:300px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
.ae-tip{padding:12px 14px;font-size:12.5px;color:var(--sub);line-height:1.6;border-bottom:1px solid var(--line)}
.ae-tip b{color:var(--clr-brand)}
.ae-list{flex:1;overflow:auto;padding:10px}
.ae-row{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 8px 0 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.ae-row:hover{border-color:var(--line-2)}
.ae-row.cur{border-color:var(--clr-brand);background:var(--acc-soft);outline:1px solid var(--clr-brand)}
.ae-no{flex:none;width:22px;height:22px;border-radius:50%;background:#bd3511;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.ae-nm{flex:1;min-width:0;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ae-st{flex:none;font-size:11px;font-weight:800;color:var(--sub-2)}
.ae-st.ok{color:var(--ok)}
.ae-x{flex:none;width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:15px;cursor:pointer}
.ae-x:hover{background:var(--danger-soft);color:var(--danger)}
.ae-empty{padding:24px 12px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7}
/* 와이어프레임 화면 링크 */
.wf-row{display:flex;gap:6px;align-items:center;min-height:40px}
.wf-row input{flex:1;min-width:0;height:38px;font-family:Consolas,monospace}
.wf-state{flex:1;min-width:0;display:inline-flex;align-items:center;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);color:var(--ink);font-size:13px;font-weight:700}
.wf-btn{flex:none;height:38px;padding:0 14px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:var(--fs-meta);font-weight:800;cursor:pointer}
.wf-btn:hover{border-color:var(--clr-brand);color:var(--clr-brand)}
.wf-btn.primary{background:var(--clr-brand);border-color:var(--clr-brand);color:#fff}
.wf-btn.primary:hover{background:var(--clr-brand-deep);color:#fff}
.imgcard{display:flex;flex-direction:column;gap:5px;max-width:100%}
.imgbar{display:flex;align-items:center;gap:8px;min-height:26px}
.imgbar .nm{flex:1;min-width:0;font-size:11.5px;font-weight:700;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrshot .imgbar{flex-wrap:wrap;gap:4px}
.scrshot .imgbar .img-rm{padding:0 7px;font-size:11px}
.imgbar .img-rm{flex:none;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--sub);font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit}
.imgbar .img-rm:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.imgadd{background:var(--acc-soft);color:var(--clr-brand);border:1px dashed var(--clr-brand);border-radius:6px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer}
.imgadd:hover{background:var(--clr-brand);color:#fff}

.scrshot{margin:0;flex:0 0 40%;min-width:130px;min-height:0;display:flex;flex-direction:column}
.scrshot .add{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:160px;border:2px dashed var(--line-2);border-radius:10px;background:var(--panel-2);color:var(--sub-2);cursor:pointer;font-size:13px;font-weight:700;text-align:center}
.scrshot .add:hover{background:var(--acc-soft);border-color:var(--clr-brand);color:var(--clr-brand)}
.scrshot .add .plus{font-size:26px;font-weight:400;line-height:1}
.scrshot .preview{flex:1;min-height:0;position:relative;display:flex;justify-content:center;align-items:flex-start;padding:10px;background:var(--panel-2);border-radius:10px;overflow:auto}
.scrshot .preview img{width:412px;max-width:100%;display:block;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:zoom-in}
.scrshot .preview .imgcard{width:412px;max-width:100%}
#secList.sec-list{flex:1}

.imglb{position:fixed;inset:0;background:rgba(5,15,40,.86);display:none;align-items:center;justify-content:center;z-index:400;cursor:zoom-out;flex-direction:column}
.imglb.show{display:flex}
.imglb img{max-width:88vw;max-height:82vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
.imglb .cap{color:#cbd6ee;font-size:13px;margin-top:10px;font-family:"Pretendard Variable","Pretendard","Malgun Gothic",sans-serif}

.modalbg{position:fixed;inset:0;background:rgba(8,31,86,.78);display:none;align-items:center;justify-content:center;z-index:200}
.modalbg.show{display:flex}
.modal{background:#fff;border-radius:10px;width:600px;max-width:92%;max-height:84vh;display:flex;flex-direction:column;font-size:var(--fs-base);color:var(--ink);border:2px solid var(--clr-brand);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.modal h3{padding:14px 18px;border-bottom:2px solid var(--clr-brand);font-size:var(--fs-h2);display:flex;align-items:center;gap:8px;background:var(--panel-2)}
.modal h3 .sp{flex:1}
.modal .body{padding:8px 0;flex:1;overflow:auto}
.modal .grp-h{padding:9px 16px;background:var(--bg-app-2);color:#fff;font-weight:800;font-size:var(--fs-meta);display:flex;justify-content:space-between;align-items:center}
.modal .grp-h .n{color:#c9d4ec;font-weight:600}
.modal .pick{padding:8px 16px;cursor:pointer;font-size:var(--fs-base);display:flex;gap:10px;align-items:center;font-family:Consolas,monospace}
.modal .pick:hover{background:var(--acc-soft)}
.modal .pick.checked{background:var(--hl)}
.modal .pick .sid{color:var(--clr-brand);font-weight:800;width:170px;font-size:13.5px}
.modal .pick .nm{font-family:"Pretendard Variable","Pretendard","Malgun Gothic",sans-serif;color:var(--ink);font-size:var(--fs-base);font-weight:700}
.modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:6px;background:var(--panel-2)}
.modal .ft button{padding:8px 18px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:var(--fs-base);font-weight:700}
.modal .ft button.primary{background:var(--clr-brand);color:#fff;border-color:var(--clr-brand)}
.modal .ft button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.modal .ft button.danger:hover{background:#a93226}
.ui-msg{padding:18px 20px;font-size:14px;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.ui-msg .ui-warn{display:block;margin-top:12px;padding:10px 12px;border-radius:6px;background:var(--danger-soft);color:#8e2a1f;font-size:12.5px;font-weight:600}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--clr-brand-deep);color:#fff;padding:9px 18px;border-radius:5px;font-size:var(--fs-base);opacity:0;transition:opacity .25s;z-index:300;font-weight:700;max-width:70%}
.toast.show{opacity:1} .toast.err{background:var(--danger)}

.placeholder{background:var(--acc-soft);border-left:4px solid var(--clr-brand);padding:12px 14px;border-radius:0 5px 5px 0;color:var(--ink);font-size:var(--fs-base);margin:6px 2px 14px;line-height:1.6;font-weight:600}
/* ---- v16 상단 정리 ---- */
.data-menu{position:relative}
.data-menu select{padding:6px 10px;border:1px solid #c8d1e0;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:#333}
.data-menu select:hover{background:#f6f8fc}
.data-menu .lbl{font-size:12px;color:#888;margin-right:4px}
.syncBlock{display:inline-flex;align-items:center;gap:var(--sp-3);padding:0 12px;height:var(--pill-h);border:1px solid rgba(255,255,255,.28);border-radius:14px;background:rgba(255,255,255,.06);flex:none}
.syncBlock .syncDot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(26,135,84,.7);flex:none}
.syncBlock .syncDot.err{background:var(--danger);box-shadow:0 0 6px rgba(192,57,43,.7)}
.syncBlock .syncDot.busy{background:var(--warn);box-shadow:0 0 6px rgba(185,117,11,.7);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.syncBlock #syncChip{display:inline-flex;align-items:center;width:170px;font-size:11.5px;font-weight:600;letter-spacing:-.1px;color:#cfe0ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.syncBlock .sep{width:1px;height:14px;background:rgba(255,255,255,.2);flex:none}
.syncBlock .data-menu{display:inline-flex;align-items:center;gap:6px;flex:none}
.syncBlock .data-menu .lbl{color:#a8c1ee;margin-right:2px;font-size:11px;font-weight:600;letter-spacing:0}
.syncBlock .data-menu select{height:24px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28);font-size:11.5px;padding:0 22px 0 8px;border-radius:4px;font-weight:600;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.syncBlock .data-menu select:hover{border-color:rgba(255,255,255,.45)}
.syncBlock .data-menu select option{background:#fff;color:#222}


/* 페이지 성향 뱃지 (STATIC / ADMIN / API / USER) */
.screen-head .meta .ptags{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;font-family:"Pretendard Variable","Pretendard","Malgun Gothic",sans-serif}
.ptag{--c:#64748b;display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;border:1px solid var(--c);color:var(--c);background:#fff;font-size:11px;font-weight:800;letter-spacing:.4px;cursor:pointer;opacity:.38;user-select:none;font-family:inherit;transition:opacity .12s,background .12s}
.ptag:hover{opacity:.75}
.ptag.on{opacity:1;background:var(--c);color:#fff}
.screen-head .meta .ptag-lbl{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-family:"Pretendard Variable","Pretendard","Malgun Gothic",sans-serif;font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap}
.screen-head .meta{position:relative}
.screen-head .meta .ptag-lbl + .ptags{margin-left:0}
.ptag-help{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);background:#fff;color:var(--sub);font-size:11px;font-weight:900;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:inherit}
.ptag-help:hover,.ptag-help.open{background:var(--clr-brand);border-color:var(--clr-brand);color:#fff}
.ptag-pop{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:50;width:340px;max-width:calc(100vw - 40px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(8,31,86,.22);padding:12px 14px;white-space:normal;cursor:default}
.ptag-pop.show{display:block}
.ptag-pop .pp-h{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:8px}
.ptag-pop .pp-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid #eef2f8}
.ptag-pop .pp-key{flex:none;width:58px;display:inline-flex;align-items:center;justify-content:center;height:20px;border-radius:10px;background:var(--c);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.4px}
.ptag-pop .pp-desc{font-size:12px;font-weight:500;color:var(--ink);line-height:1.5}
/* 충돌 선택 / 초안 창 */
.cf-guide{padding:10px 18px;font-size:12.5px;color:var(--sub);background:#f8faff;border-bottom:1px solid var(--line);line-height:1.6}
.cf-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
.cf-h{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;font-family:"Pretendard Variable","Pretendard","Malgun Gothic",sans-serif}
.cf-h b{font-size:13px;color:var(--ink)}
.cf-h span{font-size:11.5px;color:var(--sub);font-weight:600}
.cf-field{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.cf-fl{font-size:11.5px;font-weight:800;color:var(--clr-brand);margin-bottom:4px}
.cf-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cf-opt{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:pointer;font-family:"Pretendard Variable","Pretendard","Malgun Gothic",sans-serif;position:relative}
.cf-opt:has(input:checked){border-color:var(--clr-brand);background:var(--acc-soft)}
.cf-opt input{position:absolute;top:8px;right:8px}
.cf-tag{font-size:11px;font-weight:800;color:#a25b00}
.cf-tag.srv{color:var(--clr-brand)}
.cf-val{font-size:12.5px;color:var(--ink);white-space:pre-wrap;word-break:break-word;max-height:140px;overflow:auto;padding-right:18px}
/* 연결 화면 한 줄 (연관 화면 ID · 페이지연결 공통) */
.defpick{display:flex;gap:6px}
.defpick select{flex:1;min-width:0;border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:var(--fs-base);font-family:inherit;background:#fff;color:var(--ink)}
.defpick select:disabled{opacity:.6}
.scrlinks{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.scrlink{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 6px 0 12px;border:1px solid var(--clr-brand);border-radius:6px;background:var(--acc-soft);cursor:pointer;font-family:"Pretendard Variable","Pretendard","Malgun Gothic",sans-serif}
.scrlink:hover{background:var(--hl)}
.scrlink .sl-id{font-family:Consolas,monospace;font-size:13px;font-weight:800;color:var(--clr-brand);flex:none}
.scrlink .sl-nm{flex:1;min-width:0;font-size:14px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrlink.gone{border-color:var(--line-2);background:var(--panel-2);cursor:default}
.scrlink.gone .sl-id,.scrlink.gone .sl-nm{color:var(--sub-2);font-weight:600}
.scrlink .sl-x{flex:none;width:28px;height:28px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;line-height:1;color:var(--sub);cursor:pointer}
.scrlink .sl-x:hover{background:var(--danger-soft);color:var(--danger)}
/* 검색·필터 */
.tree-filter{flex:none;padding:10px 12px 8px;border-bottom:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:7px}
.tree-filter .tf-q{width:100%;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit}
.tree-filter .tf-q:focus{outline:none;border-color:var(--clr-brand);box-shadow:0 0 0 2px rgba(10,61,145,.14)}
.tree-filter .tf-row{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.tree-filter .tf-lbl{font-size:11px;font-weight:800;color:var(--sub);width:28px;flex:none}
.tf-chip{--c:#5b6a87;height:22px;padding:0 6px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:10.5px;font-weight:800;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.tf-chip i{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block}
.tf-chip.on{background:var(--c);border-color:var(--c);color:#fff}
.tf-chip.on i{background:#fff}
.tf-reset{margin-left:auto;font-size:11px;font-weight:700;color:var(--clr-brand);cursor:pointer;background:none;border:0;padding:0 2px;font-family:inherit}
.scr-row{border-left:3px solid transparent}
.scr-row.st-wr{border-left-color:#e0a33a}
.scr-row.st-ok{border-left-color:#2e9d5b}
.grp-row .n .prog{display:inline-block;width:34px;height:5px;border-radius:3px;background:#dfe5ef;margin-left:6px;vertical-align:middle;overflow:hidden}
.grp-row .n .prog b{display:block;height:100%;background:#2e9d5b}
.tagdots{display:inline-flex;gap:3px;flex:none;align-items:center}
.tagdots i{display:block;width:8px;height:8px;border-radius:50%;background:var(--c)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>삼성라이온즈 기능 정의 및 화면 설계서</h1>
    <button type="button" id="btnUser" title="닉네임 변경">👤 닉네임 입력</button>
    <span id="unsavedBadge" title="서버에 아직 저장되지 않은 변경이 있어요 · 저장 버튼 또는 Ctrl+S">저장 필요</span>
    <span class="sp"></span>
    <button type="button" id="btnDefs" title="Push·금칙어·API·토스트 등 여러 화면이 함께 쓰는 정의를 관리해요">공통 정의</button>
    <button type="button" id="btnHistory">변경 이력</button>
    <button type="button" id="btnRequest">요청사항</button>
    <span class="syncBlock" role="group" aria-label="서버 상태">
      <span class="syncDot" id="syncDot"></span>
      <span id="syncChip">연결 준비 중…</span>
      <span class="sep"></span>
      <span class="data-menu"><span class="lbl">데이터</span>
        <select id="dataMenu" aria-label="데이터 관리 메뉴">
          <option value="" selected>관리</option>
          <option value="pull">서버 최신 불러오기 (내 변경 유지)</option>
          <option value="discard">내 변경 버리고 서버 데이터로</option>
          <option value="exp">JSON 내보내기</option>
          <option value="csv">CSV 내보내기</option>
          <option value="imp">JSON 가져오기</option>
        </select>
      </span>
    </span>
    <input type="file" id="imp" accept=".json" style="display:none">
    <button type="button" id="syncBanner" style="display:none;margin-right:8px;background:#e6f0ff;color:var(--clr-brand-deep);border-color:#9fbdf0;font-size:12px;font-weight:800">🔄 새 변경</button>
    <button type="button" id="btnSave" class="primary">저장</button>
  </header>

  <div class="main" id="mainView">
    <div class="col">
      <div class="col-h"><span class="info" id="treeInfo">전체 0</span>
        <span class="sp"></span>
        <button type="button" id="btnAddScr" class="primary">+ 화면</button>
        <button type="button" id="btnAddGrp">+ 그룹</button>
      </div>
      <div class="tree-filter" id="treeFilter"></div>
      <div class="col-b" id="tree"></div>
    </div>

    <div class="col mid-col">
          <div class="col-h">
            <span class="pill" id="midTitlePill">-</span>
            <span id="midTitle">화면 선택 필요</span>
            <span class="sp"></span>
            <button type="button" id="btnDelScr2" style="display:none" title="화면 삭제" aria-label="화면 삭제"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" clip-rule="evenodd" fill-rule="evenodd" xmlns="http://www.w3.org/2000/svg"><path d="m4.015 5.494h-.253c-.413 0-.747-.335-.747-.747s.334-.747.747-.747h5.253v-1c0-.535.474-1 1-1h4c.526 0 1 .465 1 1v1h5.254c.412 0 .746.335.746.747s-.334.747-.746.747h-.254v15.435c0 .591-.448 1.071-1 1.071-2.873 0-11.127 0-14 0-.552 0-1-.48-1-1.071zm14.5 0h-13v15.006h13zm-4.25 2.506c-.414 0-.75.336-.75.75v8.5c0 .414.336.75.75.75s.75-.336.75-.75v-8.5c0-.414-.336-.75-.75-.75zm-4.5 0c-.414 0-.75.336-.75.75v8.5c0 .414.336.75.75.75s.75-.336.75-.75v-8.5c0-.414-.336-.75-.75-.75zm3.75-4v-.5h-3v.5z"/></svg></button>
          </div>
          <div class="screen-head" id="screenHead" style="display:none"></div>
          <div class="addsec" id="addsec" style="display:none">
            <span class="addsec-tip">페이지 영역 내 구역 정보를 확인합니다.</span>
            <button type="button" id="btnAddSec">+ 구역</button>
          </div>
          <div class="sec-list" id="secList"></div>
    </div>

    <div class="col">
      <div class="col-h"><span class="pill">구역 상세</span><span id="secDetailTitle">구역 설명 상세</span><span class="sp"></span><button type="button" id="btnDelSec2" class="icon-del-btn" data-act="del-sec" title="구역 삭제" aria-label="구역 삭제" style="display:none"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" clip-rule="evenodd" fill-rule="evenodd" xmlns="http://www.w3.org/2000/svg"><path d="m4.015 5.494h-.253c-.413 0-.747-.335-.747-.747s.334-.747.747-.747h5.253v-1c0-.535.474-1 1-1h4c.526 0 1 .465 1 1v1h5.254c.412 0 .746.335.746.747s-.334.747-.746.747h-.254v15.435c0 .591-.448 1.071-1 1.071-2.873 0-11.127 0-14 0-.552 0-1-.48-1-1.071zm14.5 0h-13v15.006h13zm-4.25 2.506c-.414 0-.75.336-.75.75v8.5c0 .414.336.75.75.75s.75-.336.75-.75v-8.5c0-.414-.336-.75-.75-.75zm-4.5 0c-.414 0-.75.336-.75.75v8.5c0 .414.336.75.75.75s.75-.336.75-.75v-8.5c0-.414-.336-.75-.75-.75zm3.75-4v-.5h-3v.5z"/></svg></button></div>
      <div class="sec-edit t-wd" id="secEdit"></div>
    </div>
  </div>

  <div class="defs-screen" id="defsScreen">
    <div class="col">
      <div class="col-h"><span class="info" id="defInfo">전체 0</span><span class="sp"></span>
        <button type="button" id="btnAddDef" class="primary">+ 공통 정의</button></div>
      <div class="tree-filter"><input class="tf-q" id="defQ" type="search" placeholder="ID · 이름 검색" autocomplete="off"></div>
      <div class="col-b" id="defList"></div>
    </div>
    <div class="col">
      <div class="col-h" id="defHead"></div>
      <div class="col-b def-body" id="defDetail"></div>
    </div>
  </div>

  <div class="history-screen" id="historyScreen">
    <div class="col" style="flex:1">
      <div class="col-h">
        <span class="pill">이력 관리</span>

        <span class="sp"></span>
        <input id="historySearch" type="text" placeholder="내용 · 화면ID · 작성자 검색" style="height:26px;padding:0 10px;border:1px solid var(--line);border-radius:13px;font-size:12.5px;font-family:inherit;width:220px">
      </div>
      <div class="col-b" style="display:flex;flex-direction:column;gap:14px;overflow:hidden">
        <div class="hist-compose">
          <div class="hist-compose-label" style="display:flex;align-items:center;gap:8px">수정내역
            <button type="button" id="btnHistoryDraft" style="margin-left:auto;height:24px;padding:0 10px;border:1px solid var(--clr-brand);background:#fff;color:var(--clr-brand);border-radius:12px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit" title="마지막 이력 등록 이후 내가 저장한 변경을 초안으로 불러와요">쌓인 초안 불러오기</button>
          </div>

            <textarea id="historyInput" maxlength="5000" placeholder="예) #001-SL-CM-01 수정, #002-SL-CM-02 수정"></textarea>

</div>

      <button type="button" id="btnModalOk" class="primary">선택 완료</button>

</div>

<script>
"use strict";
(function(){
  /* =====================================================================
     삼성라이온즈 기능 정의 및 화면 설계서
     · 데이터는 Supabase 의 sl_groups / sl_screens / sl_sections / sl_history 테이블에 행 단위로 저장
     · [저장] 을 누르면 "바뀐 행만" 골라서 sl_save 함수 한 번으로 보낸다 (한 트랜잭션 — 전부 성공 or 전부 취소)
     · 다른 사람이 먼저 고친 행을 덮어쓰려 하면 서버가 거절 → 충돌 목록을 보여주고 아무것도 저장하지 않음
     · 저장 전 작업은 브라우저에 자동 보관 → 새로고침/탭 닫힘 후에도 복원 가능
     ===================================================================== */

  // ── 안전망 / 유틸
  function safe(fn, fb){ try{return fn();}catch(e){console.error("[safe]",e&&(e.stack||e.message||e));return typeof fb==="function"?fb():fb;} }
  function esc(s){ return s==null?"":String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function str(v){ return v==null ? "" : String(v); }
  function toInt(v, fb){ var n = Number(v); return isFinite(n) ? Math.round(n) : (fb||0); }
  // 화면의 "URL 링크"는 http(s):// 주소만 허용 (javascript:/data: 등은 저장하지 않음)
  function _sanitizeLinkUrl(u){
    u = (u==null?"":String(u)).trim();
    if(!u) return "";
    if(/^(javascript|data|vbscript|file|blob):/i.test(u)) return "";
    if(!/^https?:\/\//i.test(u)) u = "https://" + u.replace(/^\/\//,"");
    if(!/^https?:\/\//i.test(u)) return "";
    return u;
  }
  function todayStr(){
    var d=new Date();
    return d.getFullYear().toString().slice(2)+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");
  }
  function uid(p){ p=p||"id"; return p+"_"+Math.random().toString(36).slice(2,8)+"_"+Date.now().toString(36).slice(-3); }
  // 키 순서와 상관없이 같은 내용이면 같은 문자열 — 변경 여부 비교용
  function stable(v){
    if(v===null || v===undefined || typeof v!=="object") return JSON.stringify(v===undefined?null:v);
    if(Array.isArray(v)) return "["+v.map(stable).join(",")+"]";
    return "{"+Object.keys(v).filter(function(k){return v[k]!==undefined;}).sort().map(function(k){return JSON.stringify(k)+":"+stable(v[k]);}).join(",")+"}";
  }

  function buildChanges(base, cur, ver){

    .forEach(function(t){

        if(!b[id]){ ch[t[1]].push(Object.assign({}, u[id], {base_version:null})); n++; }
        else if(stable(b[id]) !== stable(u[id])){ ch[t[1]].push(Object.assign({}, u[id], {base_version:(v[id]!=null?v[id]:null)})); n++; }

  function toast(msg, err){
    var t=document.getElementById("toast"); if(!t) return;
    t.textContent=msg; t.className="toast show"+(err?" err":"");
    clearTimeout(toast._t); toast._t=setTimeout(function(){t.className="toast";}, err?2600:1600);
  }
  function _sbChip(t,c){
    var el=document.getElementById("syncChip"); var dot=document.getElementById("syncDot"); if(!el) return;
    var color = c||"#cfe0ff";
    el.textContent=t; el.title=t; el.style.color=color;
    if(dot){
      dot.classList.remove("err","busy");
      dot.style.background = color; dot.style.boxShadow = "0 0 6px " + color;
      if(/실패|에러|오류|충돌/i.test(t)) dot.classList.add("err");
      else if(/중…|중\.\.\./.test(t)) dot.classList.add("busy");
    }
  }

  /* ===================== 서버 통신 ===================== */
  function _readJson(r){
    return r.text().then(function(t){
      var j = null; if(t){ try{ j = JSON.parse(t); }catch(_){ j = null; } }
      if(!r.ok){
        var err = new Error((j && (j.message||j.error)) || ("HTTP "+r.status));
        err.status = r.status; err.body = j; throw err;
      }
      return j;
    });
  }
  // 한 번에 1000행씩 끝까지 읽는다 (행이 많아져도 잘리지 않게)
  function sbGetAll(table, order){
    var all = [], PAGE = 1000;
    function next(off){
      var url = SB.url+"/rest/v1/"+table+"?select=*&order="+order+"&limit="+PAGE+"&offset="+off;
      return fetch(url, { method:"GET", headers:_sbH() }).then(_readJson).then(function(rows){
        if(!Array.isArray(rows)) throw new Error(table+" 응답 형식 오류");
        all = all.concat(rows);
        return rows.length === PAGE ? next(off+PAGE) : all;
      });
    }
    return next(0);
  }
  // 서버 3개 테이블 + 마지막 변경 번호를 읽는다.
  // 변경 번호를 "먼저" 읽어야 그 사이 생긴 변경을 놓치지 않는다 (중복 알림은 괜찮고, 누락은 안 됨)
  var _schemaWarned = false;
  var _defsReady = false, _defCodeMax = 0;
  // 지금까지 만들어진 공통 정의 번호 중 가장 큰 값 (지워진 번호도 재사용하지 않기 위해 변경 기록에서 찾는다)
  function fetchDefCodeMax(){
    // 정의가 "만들어진" 기록(op=I)만 읽는다 — 정의마다 한 번뿐이라 수정이 많아도 가볍다
    return fetch(SB.url+"/rest/v1/sl_changes?select=row_id&tbl=eq.def&op=eq.I&limit=10000", { headers:_sbH() })
      .then(_readJson).then(function(rows){
        var mx = 0;
        (rows||[]).forEach(function(r){ var m = /^CD-?(\d+)$/.exec(r.row_id||""); if(m) mx = Math.max(mx, parseInt(m[1],10)); });
        return mx;
      }).catch(function(){ return 0; });
  }
  function fetchLastChangeId(){
    return fetch(SB.url+"/rest/v1/sl_changes?select=id&order=id.desc&limit=1", { headers:_sbH() })
      .then(_readJson).then(function(rows){ return (rows && rows[0]) ? Number(rows[0].id) : 0; })
      .catch(function(){ return null; });   // 변경 기록 테이블이 없으면(SQL 미갱신) 알림 기능만 꺼진다
  }
  function fetchServer(){
    var lastId = null;
    return fetchLastChangeId().then(function(id){
      lastId = id;
      return Promise.all([
        sbGetAll(T_GROUPS,   "sort_order.asc,id.asc"),
        sbGetAll(T_SCREENS,  "screen_id.asc"),
        sbGetAll(T_SECTIONS, "screen_id.asc,sort_order.asc,id.asc"),
        sbGetAll("sl_defs", "id.asc").catch(function(){ return null; }),   // 테이블이 없으면(SQL 미갱신) 공통 정의만 비활성
        fetchDefCodeMax()
      ]);
    }).then(function(res){
      var ver = { groups:{}, screens:{}, sections:{}, defs:{} }, meta = { groups:{}, screens:{}, sections:{}, defs:{} };
      _defsReady = res[3] !== null; _defCodeMax = res[4] || 0;
      (res[3]||[]).forEach(function(r){ ver.defs[r.id] = r.version; meta.defs[r.id] = {by:r.updated_by, at:r.updated_at}; });
      res[0].forEach(function(r){ ver.groups[r.id] = r.version; meta.groups[r.id] = {by:r.updated_by, at:r.updated_at}; });
      res[1].forEach(function(r){ ver.screens[r.screen_id] = r.version; meta.screens[r.screen_id] = {by:r.updated_by, at:r.updated_at}; });
      res[2].forEach(function(r){ ver.sections[r.id] = r.version; meta.sections[r.id] = {by:r.updated_by, at:r.updated_at}; });
      var st = stateFromRows(res[0], res[1], res[2], res[3]||[]);
      if(!_schemaWarned && ((res[1].length && !("tags" in res[1][0])) || (res[2].length && !("area" in res[2][0] && "def_refs" in res[2][0])) || res[3] === null || lastId === null)){
        _schemaWarned = true;
        uiAlert("서버 설정이 최신이 아니에요.\n설정 SQL 파일을 SQL Editor에서 한 번 더 실행해 주세요.\n(실행 전에는 공통 정의, 연계 구분·구역 영역 저장, 새 변경 알림, 이력 초안이 동작하지 않아요)");
      }
      return { g:res[0], s:res[1], c:res[2], ver:ver, meta:meta, lastId:lastId, rows:rowsFromState(st) };
    });
  }
  function _missingTableMsg(e){
    var m = (e && e.message) || "";
    if((e && e.status===404) || /does not exist|schema cache|PGRST20[25]/i.test(m + " " + stable(e && e.body)))
      return "서버에 새 테이블/함수가 없어요 — 설정 SQL 을 먼저 실행해 주세요";
    return null;
  }
  function _rowsToArrays(rows){
    function vals(o){ return Object.keys(o||{}).map(function(k){ return o[k]; }); }
    return stateFromRows(vals(rows.groups), vals(rows.screens), vals(rows.sections), vals(rows.defs));
  }
  function _hasLocalChanges(){ return !!(BASE && buildChanges(BASE, rowsFromState(STATE), VER).count > 0); }

  // 서버에서 받은 내용으로 기준본을 바꾸고, 화면은 rows(합쳐진 결과 또는 서버 그대로)로 채운다
  function _applyServer(d, rows){
    var st = _rowsToArrays(rows || d.rows);
    STATE.groups = st.groups; STATE.screens = st.screens; STATE.defs = st.defs;
    BASE = d.rows; VER = d.ver; META = d.meta; _pulled = true; _navWarned = false;
    if(d.lastId !== null) _lastChangeId = d.lastId;
    _unsynced = buildChanges(BASE, rowsFromState(STATE), VER).count > 0;
    _hideSyncBanner();
    applyUi(); persistLocal(); _updateUnsavedBadge(); renderAll();
    flushDeletes();
  }

  // 서버 최신 데이터로 화면을 새로 채운다 (지금 화면의 미저장 변경은 버려짐 — 호출 전에 확인할 것)
  function pullAll(){
    if(!SB.url) return Promise.resolve();
    _sbChip("서버에서 불러오는 중…","#ffd166");
    return fetchServer().then(function(d){
      if(!d.g.length && !d.s.length){
        // 서버가 완전히 비어 있으면 기본 그룹 7개를 준비해 둔다 (저장해야 서버에 올라감)
        _applyServer(d, { groups:GROUPS_DEF.reduce(function(o,g,i){ o["grp_"+g.code] = {id:"grp_"+g.code, code:g.code, name:g.name, sort_order:i}; return o; }, {}), screens:{}, sections:{}, defs:{} });
        toast("서버가 비어 있어 기본 그룹을 준비했어요. 저장하면 서버에 올라갑니다.");
      } else {
        _applyServer(d);
      }
      _sbChip("서버 불러옴 · "+new Date().toLocaleTimeString(),"#8fe3ab");
    }).catch(function(e){
      console.warn("[pull]", e);
      var msg = _missingTableMsg(e);
      _sbChip(msg ? "설정 필요 · 새 테이블 없음" : "서버 연결 실패 · 브라우저 보관본으로 작업","#ff9c96");
      if(msg) uiAlert(msg + "\n\n(자세한 오류: " + (e && e.message) + ")");
      throw e;
    });
  }

  /* ===================== 합치기 (내 변경 유지 + 서버 최신 반영) =====================
     기준본(BASE) · 내 것(cur) · 서버 것(srv) 세 가지를 칸 단위로 비교한다.
       - 나만 바꾼 칸 → 내 값 / 서버만 바꾼 칸 → 서버 값 / 둘 다 같은 값 → 그대로
       - 둘 다 다르게 바꾼 칸 → 충돌 (선택 창에서 고름)
       - 내가 지웠는데 서버가 고침, 내가 고쳤는데 서버가 지움, 같은 ID 를 둘 다 추가 → 행 단위 충돌 */
  var DERIVED = { screens:{ status:1 } };   // 자동 계산되는 칸은 충돌로 보지 않는다
  function rebase(base, cur, srv){
    var merged = clone(srv), conflicts = [];
    merged.defs = merged.defs || {};
    ["groups","screens","sections","defs"].forEach(function(t){
      var b = base[t]||{}, c = cur[t]||{}, s = srv[t]||{};
      var ids = {}; Object.keys(b).forEach(function(k){ids[k]=1;}); Object.keys(c).forEach(function(k){ids[k]=1;});
      Object.keys(ids).forEach(function(id){
        var B = b[id], C = c[id], S = s[id];
        if(B && C && stable(B)===stable(C)) return;                 // 내가 안 건드림 → 서버 값
        if(!B && C){                                                 // 내가 추가
          if(!S) merged[t][id] = clone(C);
          else if(stable(S)!==stable(C)) conflicts.push({kind:"dup", t:t, id:id, mine:C, server:S});
          return;
        }
        if(B && !C){                                                 // 내가 삭제
          if(!S) return;
          if(stable(S)===stable(B)) delete merged[t][id];
          else conflicts.push({kind:"delEdited", t:t, id:id, mine:null, server:S});
          return;
        }
        if(!S){ conflicts.push({kind:"editDeleted", t:t, id:id, mine:C, server:null}); return; }   // 내가 고쳤는데 서버에서 삭제됨
        var row = clone(S), fields = [];
        Object.keys(C).forEach(function(f){
          if(DERIVED[t] && DERIVED[t][f]) return;
          if(stable(C[f])===stable(B[f])) return;                    // 내가 안 바꾼 칸
          if(stable(S[f])===stable(B[f])) row[f] = clone(C[f]);      // 서버는 안 바꿈 → 내 값
          else if(stable(S[f])!==stable(C[f])) fields.push(f);       // 둘 다 다르게 바꿈 → 충돌
        });
        merged[t][id] = row;
        if(fields.length) conflicts.push({kind:"field", t:t, id:id, fields:fields, mine:C, server:S});
      });
    });
    // 서버에서 화면이 삭제됐는데 내가 그 안의 구역을 고친 경우 → "화면" 하나의 충돌로 묶는다
    var scrGone = {};
    conflicts.forEach(function(x){ if(x.t==="screens" && x.kind==="editDeleted") scrGone[x.id]=1; });
    conflicts = conflicts.filter(function(x){
      if(x.t!=="sections" || x.kind!=="editDeleted") return true;
      var sid = x.mine && x.mine.screen_id;
      if(!sid || (srv.screens||{})[sid]) return true;
      if(!scrGone[sid] && cur.screens[sid]){
        scrGone[sid] = 1;
        conflicts.push({kind:"editDeleted", t:"screens", id:sid, mine:cur.screens[sid], server:null});
      }
      return false;
    });
    return { merged:merged, conflicts:conflicts, cur:cur };
  }
  // 충돌에서 고른 값을 합친 결과에 반영
  function applyChoices(r, choices){
    var m = r.merged;
    r.conflicts.forEach(function(x, i){
      var ch = choices[i] || {};
      if(x.kind==="field"){
        x.fields.forEach(function(f){ if(ch[f]==="mine") m[x.t][x.id][f] = clone(x.mine[f]); });
      } else if(ch.row==="mine"){
        if(x.kind==="delEdited") delete m[x.t][x.id];
        else {
          m[x.t][x.id] = clone(x.mine);
          if(x.t==="screens"){   // 화면을 되살리면 내 화면의 구역도 함께 되살린다
            Object.keys(r.cur.sections).forEach(function(k){
              if(r.cur.sections[k].screen_id===x.id) m.sections[k] = clone(r.cur.sections[k]);
            });
          }
        }
      }
    });
    // 정리: 화면이 없는 구역은 버리고, 없는 그룹을 가리키는 화면은 "분류 미지정"으로
    Object.keys(m.sections).forEach(function(k){ if(!m.screens[m.sections[k].screen_id]) delete m.sections[k]; });
    Object.keys(m.screens).forEach(function(k){ if(m.screens[k].group_id && !m.groups[m.screens[k].group_id]) m.screens[k].group_id = null; });
    return m;
  }

  var _syncing = false;
  // 서버 최신을 가져와 내 변경과 합친다. 충돌이 있으면 고르는 창을 띄운다.
  // 반환: true(반영됨) / false(취소됨)
  function syncFromServer(opts){
    opts = opts || {};
    if(_syncing) return Promise.resolve(false);
    if(!_pulled || !BASE || !_hasLocalChanges()){
      return pullAll().then(function(){ return true; }, function(){ return false; });
    }
    _syncing = true;
    _sbChip("서버 최신과 합치는 중…","#ffd166");
    return fetchServer().then(function(d){
      var r = rebase(BASE, rowsFromState(STATE), d.rows);
      var go = r.conflicts.length ? openConflictModal(r, d, opts) : Promise.resolve([]);
      return go.then(function(choices){
        if(!choices){ _sbChip("합치기 취소 · 내 화면 그대로","#ffd166"); return false; }
        _applyServer(d, applyChoices(r, choices));
        _sbChip("서버 최신과 합침 · "+new Date().toLocaleTimeString(),"#8fe3ab");
        toast(r.conflicts.length ? "충돌 "+r.conflicts.length+"건을 정리해서 합쳤어요" : "서버 최신 내용과 내 변경을 합쳤어요");
        return true;
      });
    }).catch(function(e){
      console.warn("[sync]", e);
      _sbChip("서버 연결 실패 · 내 화면 그대로","#ff9c96");
      toast(_missingTableMsg(e) || "서버 최신을 가져오지 못했어요", true);
      return false;
    }).then(function(v){ _syncing = false; return v; });
  }

  // ── 충돌 선택 창
  var FIELD_LABELS = {
    groups:  { code:"약칭", name:"그룹명", sort_order:"순서" },
    defs:    { name:"정의명", description:"설명", category:"분류", status:"진행 상황", columns:"칸 구성", rows:"항목 표", prefix:"줄 ID 앞부분", next_row:"줄 번호" },
    screens: { title:"제목", subtitle:"목적/개요", link:"와이어프레임 화면 링크", tags:"연계 구분", mock_image:"화면 이미지", group_id:"그룹", seq:"순번", status:"진행 상황" },
    sections:{ title:"구역 이름", sec_type:"구역 종류", status:"진행 상황", author:"작성자", description:"기능 설명", target:"관련 자료",
               images:"관련 자료 이미지", requirement:"고려 요소", exception_note:"예외", feedback:"광고주 요청", note:"메모",
               out_url:"이동 URL", out_label:"표시 라벨", linked_screen_id:"연결할 화면", related:"연관 화면 ID", sort_order:"순서", screen_id:"화면", area:"이미지 영역" }
  };
  function _fieldLabel(t, f){ return (FIELD_LABELS[t] && FIELD_LABELS[t][f]) || f; }
  function _showVal(t, f, v){
    if(v===null || v===undefined || v==="" || (Array.isArray(v) && !v.length)) return "(비어 있음)";
    if(f==="columns") return (v||[]).map(function(c){ return c.name; }).join(" | ");
    if(f==="rows") return (v||[]).length + "줄" + ((v||[]).length ? " · " + v.slice(0,3).map(function(r){ var c = r.cells||{}; var k = Object.keys(c)[0]; return r.id + (k ? " " + c[k] : ""); }).join(" / ") + (v.length>3 ? " …" : "") : "");
    if(f==="def_refs") return (v||[]).join(", ");
    if(f==="images") return "이미지 " + v.length + "개" + (v.length ? " · " + v.map(function(x){return x && x.name;}).filter(Boolean).join(", ") : "");
    if(f==="mock_image") return (v && v.name) || "이미지";
    if(f==="area") return "영역 지정됨 (가로 "+Math.round(v.x*100)+"% · 폭 "+Math.round(v.w*100)+"%)";
    if(f==="group_id"){ var g = (STATE.groups||[]).find(function(x){return x.id===v;}); return g ? _fmtGroup(g,"tree") : v; }
    if(Array.isArray(v)) return v.join(", ");
    var s = String(v);
    return s.length > 400 ? s.slice(0,400) + "…" : s;
  }
  function _rowTitle(x){
    var r = x.mine || x.server || {};
    if(x.t==="groups") return "그룹 " + ((r.code||"") + " " + (r.name||"")).trim();
    if(x.t==="defs") return "공통 정의 " + x.id + " '" + (r.name||"") + "'";
    if(x.t==="screens") return "#" + x.id + " 화면 '" + (r.title||"") + "'";
    return "#" + (r.screen_id||"") + " › 구역 '" + (r.title||"") + "'";
  }
  function _whoAt(meta){
    if(!meta) return "";
    var t = meta.at ? new Date(meta.at) : null;
    return (meta.by ? meta.by + "님" : "다른 사람") + (t && !isNaN(t) ? " · " + t.toLocaleString() : "");
  }
  function openConflictModal(r, d, opts){
    return new Promise(function(resolve){
      var KIND_MSG = {
        dup:"같은 ID 를 다른 사람이 먼저 추가했어요.",
        delEdited:"내가 삭제했는데, 다른 사람이 그 사이 수정했어요.",
        editDeleted:"내가 수정했는데, 다른 사람이 그 사이 삭제했어요."
      };
      var ROW_OPTS = {
        dup:["내 내용으로 덮어쓰기","서버 것 유지"],
        delEdited:["삭제하기 (내 선택)","서버 것 유지"],
        editDeleted:["내 것으로 되살리기","삭제 유지 (서버)"]
      };
      var html = r.conflicts.map(function(x, i){
        var meta = d.meta[x.t] && d.meta[x.t][x.id];
        var head = '<div class="cf-h"><b>'+esc(_rowTitle(x))+'</b><span>'+esc(x.kind==="field" ? "서버: "+_whoAt(meta) : KIND_MSG[x.kind] + (meta ? " ("+_whoAt(meta)+")" : ""))+'</span></div>';
        if(x.kind==="field"){
          return '<div class="cf-item">'+head + x.fields.map(function(f){
            var nm = "cf_"+i+"_"+f;
            return '<div class="cf-field"><div class="cf-fl">'+esc(_fieldLabel(x.t,f))+'</div><div class="cf-opts">'
              + '<label class="cf-opt"><input type="radio" name="'+nm+'" value="mine" data-i="'+i+'" data-f="'+esc(f)+'"><span class="cf-tag">내 값</span><span class="cf-val">'+esc(_showVal(x.t,f,x.mine[f]))+'</span></label>'
              + '<label class="cf-opt"><input type="radio" name="'+nm+'" value="server" data-i="'+i+'" data-f="'+esc(f)+'" checked><span class="cf-tag srv">서버 값</span><span class="cf-val">'+esc(_showVal(x.t,f,x.server[f]))+'</span></label>'
              + '</div></div>';
          }).join("") + '</div>';
        }
        var nm2 = "cf_"+i+"_row", o = ROW_OPTS[x.kind];
        return '<div class="cf-item">'+head+'<div class="cf-opts">'
          + '<label class="cf-opt"><input type="radio" name="'+nm2+'" value="mine" data-i="'+i+'" data-f="row"><span class="cf-tag">'+esc(o[0])+'</span></label>'
          + '<label class="cf-opt"><input type="radio" name="'+nm2+'" value="server" data-i="'+i+'" data-f="row" checked><span class="cf-tag srv">'+esc(o[1])+'</span></label>'
          + '</div></div>';
      }).join("");
      var bg = document.createElement("div"); bg.className = "modalbg show"; bg.id = "conflictBg";
      bg.innerHTML = '<div class="modal" style="width:760px">'
        + '<h3>다른 사람과 같은 곳을 고쳤어요 <span class="sp"></span><span style="font-size:12.5px;color:var(--sub);font-weight:700">'+r.conflicts.length+'건</span></h3>'
        + '<div class="cf-guide">겹치지 않는 변경은 이미 자동으로 합쳤어요. 아래 항목만 어느 쪽을 남길지 골라 주세요. (기본값: 서버 값)</div>'
        + '<div class="body" style="padding:6px 16px 12px">'+html+'</div>'
        + '<div class="ft"><button type="button" data-act="cf-all-mine" style="margin-right:auto">모두 내 값</button>'
        +   '<button type="button" data-act="cf-all-srv" style="margin-right:auto">모두 서버 값</button>'
        +   '<button type="button" data-act="cf-cancel">취소</button>'
        +   '<button type="button" class="primary" data-act="cf-ok">'+(opts.thenSave ? "적용 후 저장" : "적용")+'</button></div></div>';
      document.body.appendChild(bg);
      bg.addEventListener("click", function(e){
        var a = e.target.dataset && e.target.dataset.act; if(!a) return;
        if(a==="cf-all-mine" || a==="cf-all-srv"){
          var v = a==="cf-all-mine" ? "mine" : "server";
          bg.querySelectorAll('input[type=radio][value="'+v+'"]').forEach(function(x){ x.checked = true; });
          return;
        }
        if(a==="cf-cancel"){ bg.remove(); resolve(null); return; }
        if(a==="cf-ok"){
          var choices = r.conflicts.map(function(){ return {}; });
          bg.querySelectorAll("input[type=radio]:checked").forEach(function(x){ choices[+x.dataset.i][x.dataset.f] = x.value; });
          bg.remove(); resolve(choices);
