    _focusSoon(bg, document.getElementById("addScrTitle"), 40);
    function close(){ bg.remove(); }
    function commit(){
      var id = ((document.getElementById("addScrId").value) || "").trim() || defId;
      var title = ((document.getElementById("addScrTitle").value) || "").trim();
      if(!title){ toast("화면 이름을 입력해 주세요", true); return; }
      if(id==="__pending__"){ toast("사용할 수 없는 화면 ID 예요", true); return; }
      if(findScreen(id)){ toast("이미 사용 중인 화면 ID 입니다", true); return; }
      close();
      var s = newScreenShell(id.split("-")[2] || "HM");
      s.screenId = id; s.title = title;
      s.seq = parseInt(id.split("-")[3],10) || 0;
      STATE.screens.push(s);
      resyncAllScreenIds();
      var g = (STATE.groups||[]).find(function(x){return x.id===s.groupId;}); if(g) g._open = true;
      STATE.selectedScreenId = s.screenId; STATE.selectedSectionId = null;
      save(); renderAll();
      toast("화면 추가됨: "+s.screenId);
    }
    bg.addEventListener("click", function(e){
      var n = e.target;
      while(n && n!==bg){
        if(n.dataset && n.dataset.act==="add-scr-close"){ close(); return; }
        if(n.dataset && n.dataset.act==="add-scr-ok"){ commit(); return; }
        n = n.parentNode;
      }
      if(e.target===bg) close();
    });
    document.getElementById("addScrTitle").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); commit(); } });
  }
  function suggestNextId(){
    var screens = STATE.screens||[];
    var last = null, lastTotal = -1;
    screens.forEach(function(s){
      var m = typeof s.screenId==="string" && s.screenId.match(/^(\d+)-SL-([A-Z0-9]+)-(\d+)$/);
      if(m){ var t = parseInt(m[1],10); if(t > lastTotal){ lastTotal = t; last = {total:t, grp:m[2], seq:parseInt(m[3],10)}; } }
    });
    if(last) return String(last.total+1).padStart(3,"0")+"-SL-"+last.grp+"-"+String(last.seq+1).padStart(2,"0");
    var firstGrp = (STATE.groups||[]).find(function(g){return g.code==="HM";}) || (STATE.groups||[])[0] || {id:"",code:"HM"};
    var cnt = screens.filter(function(x){return x.groupId===firstGrp.id;}).length;
    return String(screens.length+1).padStart(3,"0")+"-SL-"+firstGrp.code+"-"+String(cnt+1).padStart(2,"0");
  }
  // 삭제하려는 화면들을 다른 화면의 구역이 가리키고 있는지 찾는다 (연관 화면 / 페이지연결)
  function _refsTo(sids){
    var out = [];
    (STATE.screens||[]).forEach(function(s){
      if(sids.indexOf(s.screenId)>=0) return;
      (s.sections||[]).forEach(function(sec){
        sids.forEach(function(t){
          if((sec.related||[]).indexOf(t)>=0) out.push("· #"+s.screenId+" › '"+(sec.title||"구역")+"' 연관 화면 → "+t);
          if(normType(sec.type)==="페이지연결" && sec.linkedScreenId===t) out.push("· #"+s.screenId+" › '"+(sec.title||"구역")+"' 페이지연결 → "+t);
        });
      });
    });
    return out;
  }
  function _refsWarn(sids){
    var refs = _refsTo(sids);
    if(!refs.length) return "";
    return "\n\n⚠ 이 화면을 가리키는 구역이 "+refs.length+"곳 있어요. 삭제하면 연결이 끊긴 채로 남습니다.\n"
         + refs.slice(0,10).join("\n") + (refs.length>10 ? "\n… 외 "+(refs.length-10)+"곳" : "");
  }
  function delScr(sid){
    var s0 = findScreen(sid);
    uiConfirm({ title:"화면 삭제", ok:"삭제", danger:true, width:500,
      message:"'"+sid+"'" + (s0 && s0.title ? " "+s0.title : "") + " 화면을 삭제할까요?\n"
        + (((s0&&s0.sections)||[]).length ? "안의 구역 "+s0.sections.length+"개도 함께 삭제돼요. " : "") + "저장을 눌러야 서버에 반영돼요.",
      warn:_refsWarn([sid]).trim() || null }).then(function(y){ if(y) _delScrNow(sid); });
  }
  function _delScrNow(sid){
    STATE.screens = STATE.screens.filter(function(x){return x.screenId!==sid;});
    if(STATE.selectedScreenId===sid){ STATE.selectedScreenId=null; STATE.selectedSectionId=null; }
    resyncAllScreenIds(); save(); renderAll();
  }
  function selScr(sid){
    _wfEditSid = null;
    if(sid !== STATE.selectedScreenId) _maybeWarnUnsaved();
    STATE.selectedScreenId = sid;
    var s = findScreen(sid);
    var first = s && s.sections && s.sections.length ? (s.sections.slice().sort(function(a,b){return (a.order||0)-(b.order||0);})[0]) : null;
    STATE.selectedSectionId = first ? first.id : null;
    renderAll();
  }
  function toggleGrp(gid){
    var g = (STATE.groups||[]).find(function(x){return x.id===gid;}); if(!g) return;
    g._open = (g._open===false);
    renderTree(); saveUi();
  }
  function renameGrp(gid){
    var g = (STATE.groups||[]).find(function(x){return x.id===gid;}); if(!g) return;
    uiPrompt({ title:"그룹 이름 변경", label:"그룹명", value:g.name, ok:"변경", required:true, tip:"약칭("+g.code+")은 그대로 유지돼요." }).then(function(n){
      if(!n || !n.trim()) return;
      g.name = n.trim(); save(); renderAll();
    });
  }
  function delGrp(gid){
    var inGrp = (STATE.screens||[]).filter(function(s){return s.groupId===gid;}).map(function(s){return s.screenId;});
    var cnt = inGrp.length;
    var g0 = (STATE.groups||[]).find(function(x){return x.id===gid;});
    uiConfirm({ title:"그룹 삭제", ok:"삭제", danger:true, width:500,
      message:"'"+(g0 ? _fmtGroup(g0,"tree") : gid)+"' 그룹을 삭제할까요?" + (cnt ? "\n안에 있는 화면 "+cnt+"개도 같이 삭제돼요." : "") + "\n저장을 눌러야 서버에 반영돼요.",
      warn:_refsWarn(inGrp).trim() || null }).then(function(y){ if(y) _delGrpNow(gid); });
  }
  function _delGrpNow(gid){
    STATE.groups = STATE.groups.filter(function(x){return x.id!==gid;});
    STATE.screens = STATE.screens.filter(function(x){return x.groupId!==gid;});
    if(STATE.selectedScreenId && !findScreen(STATE.selectedScreenId)){ STATE.selectedScreenId = null; STATE.selectedSectionId = null; }
    resyncAllScreenIds(); save(); renderAll();
  }
  function addSection(){
    var s = findScreen(STATE.selectedScreenId);
    if(!s){ toast("좌측에서 화면을 선택해 주세요", true); return; }
    uiPrompt({ title:"구역 추가", label:"구역 이름", value:"구역 "+((s.sections||[]).length+1), ok:"추가", required:true,
               tip:"'"+s.screenId+"' 화면의 맨 아래에 추가돼요." }).then(function(name){
      if(name && name.trim()) _addSectionNow(s, name.trim());
    });
  }
  function _addSectionNow(s, name){
    var maxOrder = (s.sections||[]).reduce(function(m,x){ return Math.max(m, x.order||0); }, -1);
    var sec = newSection(name, maxOrder+1);
    s.sections.push(sec);
    STATE.selectedSectionId = sec.id;
    save(); renderAll();
  }
  function delSection(sid, secid){
    var sc = findScreen(sid), se = sc && (sc.sections||[]).find(function(x){return x.id===secid;});
    uiConfirm({ title:"구역 삭제", ok:"삭제", danger:true,
      message:"'"+((se && se.title) || "구역")+"' 구역을 삭제할까요?"
        + (se && normArea(se.area) ? "\n이 구역의 이미지 영역 표시도 함께 삭제되고, 뒤 구역 번호가 하나씩 당겨져요." : "")
        + "\n저장을 눌러야 서버에 반영돼요." }).then(function(y){ if(y) _delSectionNow(sid, secid); });
  }
  function _delSectionNow(sid, secid){
    var s = findScreen(sid); if(!s) return;
    s.sections = (s.sections||[]).filter(function(x){return x.id!==secid;});
    if(STATE.selectedSectionId===secid){
      var first = s.sections.slice().sort(function(a,b){return (a.order||0)-(b.order||0);})[0];
      STATE.selectedSectionId = first ? first.id : null;
    }
    save(); renderAll();
  }

  /* ===================== 내보내기 / 가져오기 ===================== */
  function _download(name, blob){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }
  // 기존 편집기와 같은 형식(groups / screens)으로 내보낸다 → 양쪽 편집기 어디서든 가져오기 가능
  function exportJson(tag){
    safe(function(){
      var out = { schema:4, version:"1.0", updated:todayStr(), proj:"삼성라이온즈 앱 신규 개편",
                  groups:(STATE.groups||[]).map(function(g){ return {id:g.id, code:g.code, name:g.name, order:g.order, _open:true}; }),
                  screens:clone(STATE.screens||[]), defs:clone(STATE.defs||[]) };
      _download("samsung_lions_spec_"+(tag?tag+"_":"")+todayStr()+".json", new Blob([JSON.stringify(out,null,2)], {type:"application/json"}));
      toast("JSON 내보내기 완료");
    });
  }
  function exportCsv(){
    safe(function(){
      var groups = {};
      (STATE.groups||[]).forEach(function(g){ groups[g.id]=g; });
      var q = function(v){ if(v==null) return ""; var s=String(v).replace(/"/g,'""'); return /[",\r\n]/.test(s) ? ('"'+s+'"') : s; };
      var lines = ["screenId,title,group,tags,status,sections,sectionTitles"];
      (STATE.screens||[]).slice().sort(_byScreenIdNum).forEach(function(s){
        var g = groups[s.groupId];
        var secs = (s.sections||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
        lines.push([ q(s.screenId), q(s.title), q(g ? (g.code+" "+(g.name||"")) : ""), q(normTags(s.tags).join(" ")), q(screenStatus(s)),
                     secs.length, q(secs.map(function(x){return x.title;}).join(" / ")) ].join(","));
      });
      _download("samsung_lions_"+todayStr()+".csv", new Blob(["﻿" + lines.join("\r\n") + "\r\n"], {type:"text/csv;charset=utf-8"}));
      toast("CSV 내보내기 완료 · "+(STATE.screens||[]).length+"개 화면");
    });
  }
  function importJson(e){
    var f = e.target.files && e.target.files[0]; if(!f) return;
    e.target.value = "";
    var r = new FileReader();
    r.onload = function(){
      var d = null; try{ d = JSON.parse(r.result); }catch(_){}
      if(!d || !Array.isArray(d.groups) || !Array.isArray(d.screens)){ toast("가져오기 실패 · 편집기 JSON 파일이 아니에요", true); return; }
      var st = normalizeState(d);
      uiConfirm({ title:"JSON 가져오기", ok:"가져오기", width:500,
        message:"'"+f.name+"' 내용(화면 "+st.screens.length+"개)으로 지금 화면을 바꿀까요?\n아직 서버에는 올라가지 않아요.",
        warn:"[저장]을 누르면 서버가 이 파일 내용과 똑같이 맞춰져요. 파일에 없는 화면·구역은 서버에서도 삭제돼요." }).then(function(y){
        if(!y) return;
        STATE.groups = st.groups; STATE.screens = st.screens;
        if(Array.isArray(d.defs)) STATE.defs = st.defs;   // 공통 정의가 없는 예전 파일이면 지금 공통 정의는 유지
        resyncAllScreenIds();
        applyUi(); save(); renderAll();
        toast("가져오기 완료 · 저장을 눌러야 서버에 반영돼요");
      });
    };
    r.readAsText(f);
  }
  function reloadFromServer(){
    var dirty = _hasLocalChanges() || (!BASE && _unsynced);
    if(!dirty){ pullAll().catch(function(){}); return; }
    uiConfirm({ title:"내 변경 버리기", ok:"버리고 되돌리기", danger:true, focusCancel:true,
      message:"저장하지 않은 내 변경을 버리고 서버 데이터로 되돌릴까요?\n버리기 전에 JSON 백업 파일을 내려받아요." }).then(function(y){
      if(!y) return;
      exportJson("미저장백업");
      pullAll().catch(function(){});
    });
  }

  /* ===================== 이벤트 연결 ===================== */

    document.getElementById("btnDefs").onclick = toggleDefsScreen;

      else if(v === "exp") exportJson();
      else if(v === "csv") exportCsv();
      else if(v === "imp") document.getElementById("imp").click();

    document.body.onclick = function(e){

        var a = t.dataset && t.dataset.act;

          switch(a){
            case "toggle-grp":  toggleGrp(t.dataset.gid); return;
            case "rename-grp":  e.stopPropagation(); renameGrp(t.dataset.gid); return;
            case "del-grp":     e.stopPropagation(); delGrp(t.dataset.gid); return;
            case "sel-scr":     selScr(t.dataset.sid); return;
            case "del-sec":     e.stopPropagation(); delSection(t.dataset.sid, t.dataset.secId); return;
            case "del-history": e.stopPropagation(); delHistoryEntry(t.dataset.hid); return;
            case "goto-history-screen": e.stopPropagation(); gotoHistoryScreen(t.dataset.sid); return;
            case "goto-def": e.stopPropagation(); openDef(t.dataset.def, t.dataset.row || null); return;
          }
        }
        t = t.parentNode;
      }

    document.getElementById("btnModalOk").onclick = function(){ closeAddRelatedModal(true); };
    document.getElementById("btnModalCancel").onclick = function(){ closeAddRelatedModal(false); };
    document.getElementById("imglb").onclick = function(){ document.getElementById("imglb").classList.remove("show"); };
    function closeTagHelp(){
      document.querySelectorAll(".ptag-pop.show").forEach(function(p){ p.classList.remove("show"); });
      document.querySelectorAll(".ptag-help.open").forEach(function(b){ b.classList.remove("open"); b.setAttribute("aria-expanded","false"); });
    }
    document.addEventListener("click", closeTagHelp);
    document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeTagHelp(); });
    document.addEventListener("keydown", function(e){
      if((e.ctrlKey || e.metaKey) && (e.key==="s" || e.key==="S")){ e.preventDefault(); saveToServer(); }
    });
  }

  /* ===================== 시작 ===================== */
  function boot(){
    attachHeader();
    _renderUserBtn();
    if(!SB.user) setTimeout(function(){ askName({required:true}); }, 300);
    var local = readLocal();
    var hasLocal = !!(local && local.state && Array.isArray(local.state.screens));
    if(hasLocal){
      // 브라우저 보관본을 먼저 보여준다 (서버 응답을 기다리는 동안 빈 화면 방지)
      var st = normalizeState(local.state);
      STATE.groups = st.groups; STATE.screens = st.screens; STATE.defs = st.defs;
      BASE = local.base || null;
      VER  = local.ver  || { groups:{}, screens:{}, sections:{} };
      VER.defs = VER.defs || {};
      _pulled = !!(local.pulled && local.base);
      PENDING_DEL = Array.isArray(local.pendingDel) ? local.pendingDel : [];
      _unsynced = !!local.unsynced;
      applyUi(); _updateUnsavedBadge(); renderAll();
    } else {
      renderAll();
    }

    if(hasLocal && local.unsynced){
      var when = local.t ? new Date(local.t).toLocaleString() : "";
      _sbChip("미저장 작업 복원됨 · 저장 필요","#ffd166");
      setTimeout(function(){
        uiConfirm({ title:"저장하지 않은 작업이 있어요", ok:"이어서 작업하기", cancel:"버리고 서버 최신 불러오기", dismiss:true, width:480,
          message:"지난번에 서버에 저장하지 않은 변경사항이 있어요.\n("+when+")\n\n이어서 작업하면 서버 최신 내용과 합친 뒤 계속할 수 있어요.\n버리는 경우에는 JSON 백업 파일을 먼저 내려받아요." }).then(function(keep){
          if(keep){
            toast("이전 작업을 복원했어요 · 서버 최신과 합치는 중…");
            syncFromServer().then(function(ok){ if(ok) toast("이전 작업을 서버 최신과 합쳤어요 · 저장을 눌러야 서버에 반영돼요"); });
          }
          else { exportJson("미저장백업"); pullAll().catch(function(){}); }
        });
      }, 60);
    } else {
      pullAll().catch(function(){
        if(hasLocal) _sbChip("서버 연결 실패 · 마지막 보관본 표시 중","#ff9c96");
      });
    }
  }

  setInterval(pollOnce, POLL_MS);
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") pollOnce(); });

  window.addEventListener("beforeunload", function(e){
    try{
      clearTimeout(_persistT); clearTimeout(_dirtyT);
      if(BASE) _unsynced = buildChanges(BASE, rowsFromState(STATE), VER).count > 0;
      persistLocal();
      if(_unsynced){ e.preventDefault(); e.returnValue = ""; return ""; }
    }catch(_){}
  });
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") persistLocal(); });
  // 한글 입력 보정: 글자를 조합하는 중에 다른 칸을 누르면(특히 Mac·Safari) 마지막 글자가 확정되면서
  // input 이벤트가 오지 않는 경우가 있다 → 저장값에 마지막 글자가 빠지고, 화면이 다시 그려질 때 한 글자가 사라져 보임.
  // 칸을 벗어날 때·조합이 끝날 때 값이 마지막으로 알린 값과 다르면 input 이벤트를 한 번 더 보내 저장값을 맞춘다.
  (function(){
    var seen = new WeakMap();
    function isText(el){ return el && (el.tagName==="TEXTAREA" || (el.tagName==="INPUT" && /^(text|search|url|email|)$/i.test(el.type||""))); }
    document.addEventListener("input", function(e){ if(isText(e.target)) seen.set(e.target, e.target.value); }, true);
    function resync(el){
      if(!isText(el) || !el.isConnected) return;
      var last = seen.has(el) ? seen.get(el) : el.defaultValue;
      if(el.value !== last){ seen.set(el, el.value); el.dispatchEvent(new Event("input", { bubbles:true })); }
    }
    document.addEventListener("compositionend", function(e){ var el = e.target; setTimeout(function(){ resync(el); }, 0); }, true);
    document.addEventListener("focusout", function(e){ resync(e.target); }, true);
  })();
  window.addEventListener("error", function(ev){ console.warn("[win]", ev.message); });
  window.addEventListener("unhandledrejection", function(ev){ console.warn("[rej]", ev.reason); });

  // 테스트용 진입점 (화면 동작에는 영향 없음)
  window.__SL = { get STATE(){return STATE;}, get BASE(){return BASE;}, get VER(){return VER;}, rowsFromState:rowsFromState, buildChanges:buildChanges, pollOnce:pollOnce, rebase:rebase, buildDraft:buildDraft, get PENDING_DEL(){return PENDING_DEL;} };

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
