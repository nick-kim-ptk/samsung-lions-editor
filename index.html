  /* ===================== 새 변경 알림 (1분마다, 탭이 보일 때만) ===================== */
  var META = { groups:{}, screens:{}, sections:{}, defs:{} };
  var _lastChangeId = null;   // 마지막으로 서버와 맞춘 시점의 변경 번호
  var _myTx = [];             // 내가 저장한 묶음 번호 (내 변경은 알림에서 제외)
  var POLL_MS = 60*1000;
  function _isEditing(){
    var a = document.activeElement;
    if(document.querySelector(".modalbg.show")) return true;
    return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest("#mainView, #historyScreen, #defsScreen"));
  }
  function pollOnce(){
    if(!SB.url || !_pulled || _lastChangeId===null || _saving || _syncing || document.visibilityState!=="visible") return;
    fetch(SB.url+"/rest/v1/sl_changes?select=id,txid,by_user&id=gt."+_lastChangeId+"&order=id.asc&limit=1000", { headers:_sbH() })
      .then(_readJson).then(function(rows){
        if(!Array.isArray(rows) || !rows.length){ _hideSyncBanner(); return; }
        var foreign = rows.filter(function(r){ return _myTx.indexOf(String(r.txid))<0; });
        if(!foreign.length){ _lastChangeId = Number(rows[rows.length-1].id); _hideSyncBanner(); return; }
        var who = []; foreign.forEach(function(r){ if(r.by_user && who.indexOf(r.by_user)<0) who.push(r.by_user); });
        if(!_hasLocalChanges() && !_isEditing()){
          // 내 미저장 변경이 없고 입력 중도 아니면 조용히 최신으로 맞춘다
          pullAll().then(function(){ toast((who.join(", ")||"다른 사람")+"님의 변경 "+foreign.length+"건을 반영했어요"); }, function(){});
        } else {
          _showSyncBanner(foreign.length, who);
        }
      }).catch(function(e){ console.warn("[poll]", e); });
  }
  function _showSyncBanner(n, who){
    var b = document.getElementById("syncBanner"); if(!b) return;
    b.textContent = "🔄 새 변경 "+n+"건 · 불러오기";
    b.title = (who.length ? who.join(", ")+"님이 수정했어요. " : "") + "누르면 내 변경은 유지한 채 합쳐요.";
    b.style.display = "inline-flex";
  }
  function _hideSyncBanner(){ var b = document.getElementById("syncBanner"); if(b) b.style.display = "none"; }

  // [저장] — 이름·비밀번호 확인 → 바뀐 행 계산 → sl_save 호출 (전부 성공 or 전부 취소)
  function saveToServer(){
    if(_saving){ toast("저장 중이에요…"); return; }
    if(!SB.url){ toast("서버 설정이 없어요", true); return; }
    ensureName().then(function(n){ if(!n) return false; return _checkSavePassword(); }).then(function(ok){
      if(!ok) return;
      var ready = _pulled && BASE ? Promise.resolve(true) : _prepareBaseWithoutPull();
      ready.then(function(go){ if(go) _doSave(0); });
    });
  }
  // 서버 기준본 없이 작업한 경우(처음부터 오프라인이었던 경우 등): 서버 최신과 합친 뒤 저장
  function _prepareBaseWithoutPull(){
    return uiConfirm({ title:"서버 확인 없이 저장", ok:"계속 저장", danger:true, focusCancel:true,
      message:"서버 최신 데이터를 확인하지 못한 상태에서 작업했어요.\n이대로 저장하면 서버 내용이 지금 화면과 똑같이 맞춰집니다.",
      warn:"다른 사람의 변경이 덮어써질 수 있어요." }).then(function(go){ return go ? _fetchBaseOnly() : false; });
  }
  function _fetchBaseOnly(){
    _sbChip("서버 버전 확인 중…","#ffd166");
    return fetchServer().then(function(d){
      BASE = d.rows; VER = d.ver; META = d.meta; _pulled = true;
      if(d.lastId !== null) _lastChangeId = d.lastId;
      return true;
    }).catch(function(e){
      _sbChip("서버 연결 실패 · 저장 안 됨","#ff9c96");
      toast(_missingTableMsg(e) || "서버에 연결할 수 없어요. 잠시 후 다시 저장해 주세요", true);
      return false;
    });
  }
  function _doSave(attempt){
    var cur = rowsFromState(STATE);
    var built = buildChanges(BASE, cur, VER);
    if(built.count === 0){
      _unsynced = false; _updateUnsavedBadge(); persistLocal();
      toast("변경된 내용이 없어요");
      return;
    }
    _saving = true;
    _sbChip("서버 저장 중… ("+built.count+"건)","#ffd166");
    fetch(SB.url + "/rest/v1/rpc/sl_save", {
      method:"POST", headers:_sbH(),
      body: JSON.stringify({ p_changes: built.changes, p_user: SB.user })
    }).then(_readJson).then(function(res){
      res = res || {};
      ["groups","screens","sections","defs"].forEach(function(t){
        var m = res[t] || {};
        VER[t] = VER[t] || {};
        Object.keys(m).forEach(function(k){ VER[t][k] = m[k]; });
      });
      built.changes.groups_delete.forEach(function(x){ delete VER.groups[x.id]; });
      built.changes.screens_delete.forEach(function(x){ delete VER.screens[x.id]; });
      built.changes.sections_delete.forEach(function(x){ delete VER.sections[x.id]; });
      built.changes.defs_delete.forEach(function(x){ if(VER.defs) delete VER.defs[x.id]; });
      var _nowIso = new Date().toISOString();
      ["groups","screens","sections","defs"].forEach(function(t){
        META[t] = META[t] || {};
        Object.keys(res[t] || {}).forEach(function(k){ META[t][k] = { by:SB.user, at:_nowIso }; });
      });
      var _dh = document.querySelector("#defDetail .dhint"), _dd = _defSel && findDef(_defSel);
      if(_dh && _dd) _dh.textContent = _defUpdatedText(_dd);
      if(res.txid != null){ _myTx.push(String(res.txid)); if(_myTx.length > 100) _myTx.shift(); }
      BASE = cur;   // 저장 버튼을 누른 시점의 내용이 새 기준본 (저장 도중 고친 내용은 다음 저장에 반영됨)
      _unsynced = buildChanges(BASE, rowsFromState(STATE), VER).count > 0;
      _updateUnsavedBadge(); persistLocal();
      flushDeletes();
      _sbChip("서버 저장됨 · "+SB.user+" · "+new Date().toLocaleTimeString(),"#8fe3ab");
      toast("저장됨 · "+built.count+"건 반영");
      _saving = false;
      showDraftAfterSave();
    }).catch(function(e){
      _saving = false;
      console.warn("[save]", e);
      var body = e && e.body;
      if(/sl_defs_prefix_key/.test((body && (body.message||"")) + " " + (e && e.message))){
        _sbChip("저장 안 됨 · 공통 정의 번호 겹침","#ff9c96");
        uiAlert("다른 사람이 같은 번호로 공통 정의를 먼저 만들었어요.\n'서버 최신 불러오기'를 한 뒤, 공통 정의를 다시 만들어 주세요.\n(이번 저장은 전부 취소됐어요)");
        return;
      }
      if(body && body.message === "SL_CONFLICT"){
        // 서버 데이터는 그대로. 서버 최신과 합친 뒤(충돌은 선택) 한 번 더 저장한다
        if(attempt >= 2){ _sbChip("저장 충돌 반복 · 잠시 후 다시 저장해 주세요","#ff9c96"); return; }
        _sbChip("다른 사람 변경과 겹침 · 합치는 중…","#ffd166");
        toast("다른 사람이 먼저 저장한 내용이 있어서 합친 뒤 다시 저장할게요");
        syncFromServer({ thenSave:true }).then(function(ok){
          if(ok) _doSave(attempt + 1);
          else _sbChip("저장 안 됨 · 합치기 취소","#ff9c96");
        });
        return;
      }
      var msg = _missingTableMsg(e);
      _sbChip(msg ? "설정 필요 · 저장 안 됨" : "서버 저장 실패 · 브라우저엔 보관됨","#ff9c96");
      if(msg) uiAlert(msg);
      else toast("저장 실패: " + ((body && body.message) || (e && e.message) || "알 수 없는 오류"), true);
    });
  }

  /* ===================== 이력 자동 초안 =====================
     "내가 마지막으로 이력을 등록(또는 '기록 안 함')한 뒤 생긴 내 변경" 을 변경 기록에서 모아 문장으로 만든다.
     [나중에] 를 누르면 그대로 쌓여서 다음 저장 때 합쳐진 초안이 나온다. (서버 기준이라 다른 PC 에서도 이어짐) */
  function _enc(v){ return encodeURIComponent(v); }
  // 이력 초안 시작 시점 — 이 시각 이전의 변경은 초안에 넣지 않고, 이 시각 전에는 저장 후 초안 창도 띄우지 않는다.
  // (대대적인 내용 교체 기간에는 이력을 관리하지 않기 위함. 날짜를 바꾸려면 이 한 줄만 고치면 된다)
  var HISTORY_START = "2026-09-28T00:00:00+09:00";
  function _histStart(){ return new Date(window.__SL_HISTORY_START || HISTORY_START); }
  function _histStarted(){ return Date.now() >= _histStart().getTime(); }
  function _histStartLabel(){ var d = _histStart(); return (d.getMonth()+1) + "/" + d.getDate(); }
  function fetchMark(){
    return fetch(SB.url+"/rest/v1/sl_user_marks?select=change_id&author=eq."+_enc(SB.user), { headers:_sbH() })
      .then(_readJson).then(function(rows){ return (rows && rows[0]) ? Number(rows[0].change_id)||0 : 0; });
  }
  function setMark(id){
    return fetch(SB.url+"/rest/v1/sl_user_marks", {
      method:"POST",
      headers:Object.assign({}, _sbH(), { "Prefer":"resolution=merge-duplicates,return=minimal" }),
      body:JSON.stringify([{ author:SB.user, change_id:id, updated_at:new Date().toISOString() }])
    }).then(_readJson);
  }
  function fetchDraft(){
    if(!SB.url || !SB.user) return Promise.resolve({ text:"", maxId:0, count:0 });
    return fetchMark().then(function(mark){
      var sel = "id,tbl,row_id,screen_id,op,fields,nt:new->>title,ot:old->>title,nn:new->>name,onm:old->>name,nc:new->>code,oc:old->>code,nst:new->>status";
      return fetch(SB.url+"/rest/v1/sl_changes?select="+sel+"&by_user=eq."+_enc(SB.user)+"&id=gt."+mark+"&at=gte."+_enc(_histStart().toISOString())+"&order=id.asc&limit=2000", { headers:_sbH() })
        .then(_readJson);
    }).then(function(rows){ return buildDraft(rows || []); });
  }
  function buildDraft(rows){
    var maxId = 0, byRow = {}, order = [];
    rows.forEach(function(r){
      maxId = Math.max(maxId, Number(r.id)||0);
      var k = r.tbl + "|" + r.row_id;
      if(!byRow[k]){ byRow[k] = { tbl:r.tbl, id:r.row_id, sid:r.screen_id, first:r.op, last:r.op, fields:{}, title:"", st:"" }; order.push(k); }
      var x = byRow[k];
      x.last = r.op;
      if(r.screen_id) x.sid = r.screen_id;
      (r.fields||[]).forEach(function(f){ x.fields[f] = 1; });
      if(r.tbl==="group") x.title = ((r.nc||r.oc||"") + " " + (r.nn||r.onm||"")).trim() || x.title;
      else if(r.tbl==="def") x.title = r.nn || r.onm || x.title;
      else x.title = r.nt || r.ot || x.title;
      if(r.nst) x.st = r.nst;
    });
    var SKIP = { screen:{ status:1, seq:1 }, section:{}, group:{}, def:{ next_row:1 } };
    var LBL = { screen:FIELD_LABELS.screens, section:FIELD_LABELS.sections, group:FIELD_LABELS.groups, def:FIELD_LABELS.defs };
    function what(x){
      if(x.first==="I" && x.last==="D") return null;          // 추가했다가 지운 것 → 생략
      if(x.first==="I") return "추가";
      if(x.last==="D") return "삭제";
      var fs = Object.keys(x.fields).filter(function(f){ return !SKIP[x.tbl][f]; });
      if(!fs.length) return null;
      return fs.map(function(f){
        var l = LBL[x.tbl][f] || f;
        return (x.tbl==="section" && f==="status" && x.st) ? l + " → " + x.st : l;
      }).join("·") + " 수정";
    }
    var groupLines = [], screens = {}, scrDeleted = {};
    order.forEach(function(k){ var x = byRow[k]; if(x.tbl==="screen" && what(x)==="삭제") scrDeleted[x.id] = 1; });
    order.forEach(function(k){
      var x = byRow[k], w = what(x);
      if(!w) return;
      if(x.tbl==="group"){ groupLines.push("그룹 '"+x.title+"' "+w); return; }
      if(x.tbl==="def"){ groupLines.push("#"+x.id+" 공통 정의 '"+x.title+"' "+w); return; }
      var sid = x.tbl==="screen" ? x.id : (x.sid||"");
      if(x.tbl==="section" && w==="삭제" && scrDeleted[sid]) return;   // 화면 삭제에 딸려 지워진 구역은 생략
      if(!screens[sid]) screens[sid] = { head:"", parts:[] };
      if(x.tbl==="screen"){
        screens[sid].head = (w==="추가" || w==="삭제") ? "화면 '"+x.title+"' "+w : w;
      } else {
        screens[sid].parts.push("구역 '"+x.title+"' "+w);
      }
    });
    var sids = Object.keys(screens).sort(function(a,b){ return _byScreenIdNum({screenId:a},{screenId:b}); });
    var lines = groupLines.concat(sids.map(function(sid){
      var s = screens[sid];
      return "#" + sid + " " + [s.head].concat(s.parts).filter(Boolean).join(", ");
    }));
    return { text:lines.join("\n"), maxId:maxId, count:rows.length };
  }
  function _postHistory(text){
    var entry = { id:uid("hist"), text:text, author:SB.user||"익명", ts:Date.now(), dateStr:_histTimeStr() };
    return fetch(SB.url + "/rest/v1/" + T_HISTORY, {
      method:"POST", headers:_sbH(),
      body: JSON.stringify([{ id:entry.id, content:entry.text, author:entry.author, ts:entry.ts, date_str:entry.dateStr }])
    }).then(_readJson).then(function(){
      STATE.changelog = STATE.changelog || [];
      STATE.changelog.unshift(entry);
      return entry;
    });
  }
  function showDraftAfterSave(){
    if(!_histStarted()) return;   // 시작일 전에는 초안 창을 띄우지 않음
    fetchDraft().then(function(d){
      if(!d.text) return;
      openDraftModal(d);
    }).catch(function(e){ console.warn("[draft]", e); });
  }
  function openDraftModal(d){
    if(document.getElementById("draftBg")) return;
    var bg = document.createElement("div"); bg.className = "modalbg show"; bg.id = "draftBg";
    bg.innerHTML = '<div class="modal" style="width:640px">'
      + '<h3>이력 초안 <span class="sp"></span><span style="font-size:12.5px;color:var(--sub);font-weight:700">'+esc(SB.user)+' · 변경 '+d.count+'건</span></h3>'
      + '<div class="cf-guide">마지막으로 이력을 등록한 뒤 내가 저장한 변경을 모았어요. 필요하면 고친 뒤 등록하세요.<br>[나중에]를 누르면 다음 저장 내용과 합쳐져서 쌓여요.</div>'
      + '<div class="body" style="padding:10px 16px 14px"><textarea id="draftText" maxlength="'+HISTORY_TEXT_MAX+'" style="width:100%;min-height:180px;padding:10px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:13.5px;line-height:1.6;resize:vertical">'+esc(d.text)+'</textarea></div>'
      + '<div class="ft"><button type="button" data-act="dr-skip" style="margin-right:auto;color:var(--sub)" title="이번까지의 변경은 이력으로 남기지 않고 초안에서 비워요">기록 안 함</button>'
      +   '<button type="button" data-act="dr-later">나중에</button>'
      +   '<button type="button" class="primary" data-act="dr-ok">등록</button></div></div>';
    document.body.appendChild(bg);
    bg.addEventListener("click", function(e){
      var a = e.target.dataset && e.target.dataset.act; if(!a) return;
      if(a==="dr-later"){ bg.remove(); toast("초안은 쌓아 둘게요 · 이력 화면에서도 불러올 수 있어요"); return; }
      if(a==="dr-skip"){
        uiConfirm({ title:"초안 비우기", ok:"비우기", danger:true, message:"이번까지의 변경을 이력으로 남기지 않고 초안을 비울까요?" }).then(function(y){
          if(!y) return;
          setMark(d.maxId).then(function(){ bg.remove(); toast("초안을 비웠어요"); }, function(){ toast("처리하지 못했어요 · 잠시 후 다시 시도해 주세요", true); });
        });
        return;
      }
      if(a==="dr-ok"){
        var txt = (document.getElementById("draftText").value||"").trim();
        if(!txt){ toast("내용을 입력해 주세요", true); return; }
        _checkSavePassword().then(function(ok){
          if(!ok) return;
          _postHistory(txt.slice(0, HISTORY_TEXT_MAX)).then(function(){
            return setMark(d.maxId).catch(function(){ toast("이력은 등록됐지만 초안 비우기에 실패했어요", true); });
          }).then(function(){
            bg.remove(); toast("이력 등록됨");
            if(document.getElementById("historyScreen").classList.contains("show")) renderHistoryList();
          }, function(e){
            console.warn("[draft post]", e);
            toast(_missingTableMsg(e) || "이력 등록 실패 · 잠시 후 다시 시도해 주세요", true);
          });
        });
      }
    });
  }

  // 창이 열리고 잠시 뒤 첫 입력칸으로 커서를 옮기되, 그사이 사용자가 이미 다른 칸에 들어가 있으면 건드리지 않는다
  function _focusSoon(bg, el, delay){
    setTimeout(function(){
      if(!el || !el.isConnected) return;
      var a = document.activeElement;
      if(a && a !== document.body && bg.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
      el.focus(); if(el.select) el.select();
    }, delay || 30);
  }
  // ── 공통 모달: 시스템 alert/confirm/prompt 대신 편집기 스타일로 묻는다
  //   uiConfirm → Promise<boolean>, uiPrompt → Promise<string|null>
  //   Enter = 확인, Esc·바깥 클릭 = 취소(dismiss 값)
  function _uiModal(opts, bodyHtml, onOk){
    return new Promise(function(resolve){
      var bg = document.createElement("div"); bg.className = "modalbg show"; bg.setAttribute("data-ui","1");
      bg.innerHTML = '<div class="modal" style="width:'+(opts.width||440)+'px" role="dialog" aria-modal="true">'
        + '<h3>'+esc(opts.title||"확인")+'</h3>' + bodyHtml
        + '<div class="ft">'
        +   (opts.cancel===false ? '' : '<button type="button" data-ui="cancel">'+esc(opts.cancel||"취소")+'</button>')
        +   '<button type="button" class="'+(opts.danger ? "danger" : "primary")+'" data-ui="ok">'+esc(opts.ok||"확인")+'</button>'
        + '</div></div>';
      document.body.appendChild(bg);
      var prevFocus = document.activeElement;
      function close(v){
        document.removeEventListener("keydown", onKey, true);
        bg.remove();
        try{ if(prevFocus && prevFocus.focus) prevFocus.focus(); }catch(_){}
        resolve(v);
      }
      function ok(){ var v = onOk ? onOk(bg) : true; if(v === undefined) return; close(v); }
      function onKey(e){
        if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); close(opts.dismiss !== undefined ? opts.dismiss : (onOk ? null : false)); }
        else if(e.key==="Enter" && !(e.target && e.target.tagName==="TEXTAREA")){ e.preventDefault(); e.stopPropagation(); ok(); }
      }
      document.addEventListener("keydown", onKey, true);
      bg.addEventListener("click", function(e){
        var a = e.target.dataset && e.target.dataset.ui;
        if(a==="ok") ok();
        else if(a==="cancel") close(onOk ? null : false);
        else if(e.target===bg) close(opts.dismiss !== undefined ? opts.dismiss : (onOk ? null : false));
      });
      _focusSoon(bg, bg.querySelector("input") || bg.querySelector('[data-ui="'+(opts.focusCancel ? "cancel" : "ok")+'"]'));
    });
  }

  // ── 클립보드 복사
  function copyText(text){
    function fallback(){
      var ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      return ok;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).catch(fallback);
    }
    return Promise.resolve(fallback());
  }

  // ── 저장 시 비밀번호 확인 (기존 편집기와 같은 비밀번호)
  var SAVE_PASSWORD_HASH = "158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab";
  function _sha256Hex(text){
    var buf = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", buf).then(function(hashBuf){
      return Array.from(new Uint8Array(hashBuf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    });
  }
  var _pwOkUntil = 0;   // 비밀번호를 한 번 맞히면 10분 동안은 다시 묻지 않는다
  function _checkSavePassword(){
    if(Date.now() < _pwOkUntil) return Promise.resolve(true);
    return uiPrompt({ title:"저장 비밀번호", label:"비밀번호", password:true, ok:"확인", width:380,
                      tip:"한 번 맞히면 10분 동안은 다시 묻지 않아요." }).then(function(pw){
    if(pw===null) return false;
    if(!(window.crypto && window.crypto.subtle)){
      toast("이 브라우저에서는 비밀번호 확인을 할 수 없어요 (https 주소에서 열어 주세요)", true);
      return false;
    }
    return _sha256Hex(pw).then(function(hex){
      if(hex !== SAVE_PASSWORD_HASH){ toast("비밀번호가 올바르지 않습니다", true); return false; }
      _pwOkUntil = Date.now() + 10*60*1000;
      return true;
    });
    });
  }

  /* ===================== 화면 그리기 (기존 편집기와 동일한 UI) ===================== */
  function _fmtGroup(g, mode){
    var code = (g && g.code) || "";
    var raw  = ((g && g.name) || "").trim();
    var nm0  = raw.replace(/^\((.+)\)$/, "$1").trim();
    var nm   = nm0;
    if(code){
      var escC = code.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      var m  = nm0.match(new RegExp("^" + escC + "\\s*\\(?(.+?)\\)?\\s*$"));
      if(m && m[1] && m[1] !== code) nm = m[1].trim();
    }
    if(mode === "header") return nm || code;
    return code ? (nm ? (code + " " + nm) : code) : nm;
  }

  function filterActive(){ return !!(FILTER.q.trim() || FILTER.tags.length || FILTER.st.length); }
  function matchScreen(s){
    var q = FILTER.q.trim().toLowerCase();
    if(q && (s.screenId+" "+(s.title||"")).toLowerCase().indexOf(q)<0) return false;
    if(FILTER.tags.length){
      var tags = normTags(s.tags);
      var hit = FILTER.tags.some(function(k){ return k==="NONE" ? !tags.length : tags.indexOf(k)>=0; });
      if(!hit) return false;
    }
    if(FILTER.st.length && FILTER.st.indexOf(screenStatus(s))<0) return false;
    return true;
  }
  // 검색창은 한 번만 만들고 다시 그리지 않는다.

  function renderTree(){

    groups.forEach(function(g){
      var all = (STATE.screens||[]).filter(function(s){return s.groupId===g.id;});
      var items = fa ? all.filter(matchScreen) : all;
      if(fa && !items.length) return;
      var nOk = all.filter(function(s){return screenStatus(s)==="확정";}).length;
      var nWr = all.filter(function(s){return screenStatus(s)==="검토중";}).length;
      var pct = all.length ? Math.round(nOk*100/all.length) : 0;
      var arrow = (g._open===false && !fa) ? "▸" : "▾";
      html += '<div class="grp-row" data-gid="'+esc(g.id)+'" data-act="toggle-grp">'

            +     '<span data-act="del-grp" data-gid="'+esc(g.id)+'" title="삭제">🗑</span>'
            +   '</span>'
            +   '<span class="n" title="확정 '+nOk+' · 검토중 '+nWr+' · 작성중 '+(all.length-nOk-nWr)+' (화면 기준)">'
            +     (fa ? items.length+' / ' : '') + '확정 '+nOk+'/'+all.length
            +     '<span class="prog"><b style="width:'+pct+'%"></b></span></span>'
            + '</div>';
      if(g._open!==false || fa){
        items.slice().sort(_byScreenIdNum).forEach(function(s){
          html += '<div class="scr-row '+_stCls(s)+' '+(STATE.selectedScreenId===s.screenId?'active':'')+'" data-sid="'+esc(s.screenId)+'" data-act="sel-scr" title="진행: '+screenStatus(s)+'">'
                +   '<span class="sid">'+esc(s.screenId)+'</span>'

    var orphans = (STATE.screens||[]).filter(function(s){return !(STATE.groups||[]).some(function(g){return g.id===s.groupId;});});
    if(fa) orphans = orphans.filter(matchScreen);
    if(orphans.length){
      html += '<div class="grp-row"><span class="arrow">▾</span><span class="gname">분류 미지정</span><span class="n">'+orphans.length+'</span></div>';
      orphans.slice().sort(_byScreenIdNum).forEach(function(s){
        html += '<div class="scr-row '+_stCls(s)+' '+(STATE.selectedScreenId===s.screenId?'active':'')+'" data-sid="'+esc(s.screenId)+'" data-act="sel-scr" title="진행: '+screenStatus(s)+'">'
              +   '<span class="sid">'+esc(s.screenId)+'</span>'
              +   '<span class="nm">'+esc(s.title||"")+'</span>'+_tagDots(s)+'</div>';
      });
    }
    if(!groups.length && !orphans.length) html='<div class="empty">그룹이 없습니다. "+ 그룹" 으로 추가해 주세요.</div>';
    else if(fa && !html) html='<div class="empty">조건에 맞는 화면이 없어요.</div>';
    tree.innerHTML = html;
  }
  function _stCls(s){ var v = screenStatus(s); return v==="확정" ? "st-ok" : v==="검토중" ? "st-wr" : ""; }
  function _tagDots(s){
    var tags = normTags(s.tags);
    if(!tags.length) return "";
    return '<span class="tagdots" title="'+esc(tags.join(" · "))+'">'
         + tags.map(function(k){ return '<i style="--c:'+tagColor(k)+'"></i>'; }).join("") + '</span>';

  function _byScreenIdNum(a,b){
    function num(s){ var m = typeof s.screenId==="string" && s.screenId.match(/^(\d+)/); return m ? parseInt(m[1],10) : (s.seq||0); }
    return (num(a)-num(b)) || (a.screenId<b.screenId?-1:a.screenId>b.screenId?1:0);

  // ── 와이어프레임 화면 링크: 등록 후에는 주소를 숨기고 [수정] [이동 ↗] 만 보여준다
  var _wfEditSid = null;   // 수정 중인 화면 ID
  function renderWfLink(s){
    var box = document.getElementById("wfBox"); if(!box) return;
    var editing = !s.link || _wfEditSid === s.screenId;
    var html = '<div class="lbl">와이어프레임 화면 링크</div>';
    if(!editing){
      html += '<div class="wf-row"><span class="wf-state">🔗 링크 등록됨</span>'
            + '<button type="button" class="wf-btn" data-wf="edit">수정</button>'
            + '<button type="button" class="wf-btn primary" data-wf="go">이동 ↗</button></div>';
    } else {
      html += '<div class="wf-row"><input type="url" id="wfInput" value="'+esc(s.link||"")+'" placeholder="https://" autocomplete="off" spellcheck="false">'
            + '<button type="button" class="wf-btn primary" data-wf="apply">'+(s.link ? "저장" : "등록")+'</button>'
            + (s.link ? '<button type="button" class="wf-btn" data-wf="cancel">취소</button>' : '')
            + '</div>'
            + (s.link ? '<div class="tip">비우고 저장하면 링크가 삭제돼요.</div>' : '');
    }
    box.innerHTML = html;
    var inp = document.getElementById("wfInput");
    var done = false;   // 적용/취소가 한 번 처리되면 이후 입력칸 이벤트(change 등)는 무시
    function apply(){
      if(done) return;
      var raw = (inp.value||"").trim(), clean = _sanitizeLinkUrl(raw);
      if(raw && !clean){ toast("http(s):// 로 시작하는 주소만 등록할 수 있어요", true); inp.focus(); return; }
      var before = s.link || "";
      done = true;
      _wfEditSid = null;
      if(clean !== before){
        s.link = clean; save();
        toast(clean ? (before ? "링크 수정됨" : "링크 등록됨") + " · 저장을 눌러야 서버에 반영돼요" : "링크 삭제됨 · 저장을 눌러야 서버에 반영돼요");
      }
      renderWfLink(s);
    }
    function cancel(){ if(done) return; done = true; _wfEditSid = null; renderWfLink(s); }
    box.querySelectorAll("[data-wf]").forEach(function(b){
      b.addEventListener("mousedown", function(e){ e.preventDefault(); });   // 입력칸 blur(자동 적용)보다 버튼이 먼저 처리되게
      b.addEventListener("click", function(){
        var a = b.dataset.wf;
        if(a==="go"){
          var u = _sanitizeLinkUrl(s.link);
          if(!u){ toast("열 수 없는 형식의 주소예요", true); return; }
          window.open(u, "_blank", "noopener");
        }
        else if(a==="edit"){ _wfEditSid = s.screenId; renderWfLink(s); var i = document.getElementById("wfInput"); if(i){ i.focus(); i.select(); } }
        else if(a==="apply") apply();
        else if(a==="cancel") cancel();
      });
    });
    if(inp){
      inp.addEventListener("keydown", function(e){
        if(e.key==="Enter"){ e.preventDefault(); apply(); }
        else if(e.key==="Escape" && s.link){ e.preventDefault(); cancel(); }
      });
      inp.addEventListener("change", function(){ if(!done) apply(); });  // 입력 후 바깥을 눌러도 적용
    }
  }

  function _storageDelete(path){
    if(!path || !SB.url) return Promise.resolve();
    return fetch(SB.url + "/storage/v1/object/" + SB_BUCKET + "/" + path, {
      method:"DELETE", headers:{ "apikey":SB.key, "Authorization":"Bearer "+SB.key }
    }).catch(function(){ /* 서버 파일 삭제 실패는 무시 */ });
  }
  // 이미지를 지워도 바로 서버 파일을 지우지 않고 목록에 모아 둔다.
  // 저장이 성공한 뒤, 지금 화면과 서버 기준본 어디에서도 쓰지 않는 파일만 실제로 지운다.
  // (저장 안 하고 끄거나 충돌로 저장이 취소돼도 서버 데이터의 이미지가 깨지지 않게)
  function queueDelete(path){
    if(path && PENDING_DEL.indexOf(path)<0){ PENDING_DEL.push(path); persistLocalSoon(); }
  }
  function _fileRefs(rows, into){
    if(!rows) return into;
    Object.keys(rows.screens||{}).forEach(function(k){ var m = rows.screens[k].mock_image; if(m && m.path) into[m.path]=1; });
    Object.keys(rows.sections||{}).forEach(function(k){ (rows.sections[k].images||[]).forEach(function(im){ if(im && im.path) into[im.path]=1; }); });
    return into;
  }
  function flushDeletes(){
    if(!PENDING_DEL.length || !SB.url) return;
    var refs = _fileRefs(BASE, _fileRefs(rowsFromState(STATE), {}));
    var keep = [];
    PENDING_DEL.forEach(function(p){ if(refs[p]) keep.push(p); else _storageDelete(p); });
    PENDING_DEL = keep; persistLocal();
  }
  function _storageUpload(path, f){
    return fetch(SB.url + "/storage/v1/object/" + SB_BUCKET + "/" + path, {
      method:"POST",
      headers:{ "apikey":SB.key, "Authorization":"Bearer "+SB.key, "Content-Type":f.type||"application/octet-stream", "x-upsert":"true" },
      body:f
    }).then(function(res){
      if(!res.ok) return res.text().then(function(t){ throw new Error(t || ("HTTP "+res.status)); });
    });
  }

  var TRASH_SVG = '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd" aria-hidden="true"><path d="m4.015 5.494h-.253c-.413 0-.747-.335-.747-.747s.334-.747.747-.747h5.253v-1c0-.535.474-1 1-1h4c.526 0 1 .465 1 1v1h5.254c.412 0 .746.335.746.747s-.334.747-.746.747h-.254v15.435c0 .591-.448 1.071-1 1.071-2.873 0-11.127 0-14 0-.552 0-1-.48-1-1.071zm14.5 0h-13v15.006h13zm-4.25 2.506c-.414 0-.75.336-.75.75v8.5c0 .414.336.75.75.75s.75-.336.75-.75v-8.5c0-.414-.336-.75-.75-.75zm-4.5 0c-.414 0-.75.336-.75.75v8.5c0 .414.336.75.75.75s.75-.336.75-.75v-8.5c0-.414-.336-.75-.75-.75zm3.75-4v-.5h-3v.5z"/></svg>';
  function _imgBar(name, attrs){
    return '<div class="imgbar"><span class="nm" title="'+esc(name||"")+'">'+esc(name||"이미지")+'</span>'
         + '<button type="button" class="img-rm" '+attrs+' title="이미지 삭제">'+TRASH_SVG+'삭제</button></div>';

  /* ===================== 화면 이미지 + 구역 영역(빨간 네모) =====================
     원칙: 구역 리스트가 주인이고, 네모는 각 구역의 "area" 칸에 붙는 표시일 뿐이다.
       · 이미지 쪽에서 무엇을 해도(삭제·교체·네모 지우기·전체 지우기·취소) 구역은 절대 생기거나 지워지지 않는다.
       · 네모 위치는 이미지 "가로 폭" 기준 비율 {x,y,w,h} — 해상도가 달라지거나 아래로 길어진 이미지로 바꿔도 위쪽은 제자리.
       · 번호는 구역 순서를 그대로 따른다 (이미지에 굽지 않고 위에 겹쳐 그림). */
  var AREA_COLOR = "#dd3327";
  function normArea(a){
    if(!a || typeof a!=="object") return null;
    var r = function(v){ v = Number(v); return isFinite(v) ? Math.round(v*10000)/10000 : NaN; };
    var o = { x:r(a.x), y:r(a.y), w:r(a.w), h:r(a.h) };
    if([o.x,o.y,o.w,o.h].some(isNaN) || o.w <= 0 || o.h <= 0) return null;
    return o;
  }
  // ratio = 이미지 세로/가로. 가로 폭 기준 좌표를 이미지 박스 안의 % 위치로 바꾼다.
  function _areaCss(a, ratio){
    return "left:"+(a.x*100)+"%;top:"+(a.y/ratio*100)+"%;width:"+(a.w*100)+"%;height:"+(a.h/ratio*100)+"%";
  }
  function _orderedSecs(s){ return (s.sections||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);}); }

  function renderScrShot(shot, s){
    if(s.mockImage && s.mockImage.url){
      shot.innerHTML =
          '<div class="preview"><div class="imgcard">'
        +   '<div class="imgbar">'
        +     '<button type="button" class="img-rm" data-act="area-edit" title="구역 영역(빨간 네모) 지정·수정">▣ 영역 편집</button>'
        +     '<span class="sp" style="flex:1"></span>'

        +     '<button type="button" class="img-rm" data-act="scrshot-del" title="이미지 삭제">'+TRASH_SVG+'삭제</button></div>'
        +   '<div class="shotbox"><img src="'+esc(s.mockImage.url)+'" alt="'+esc(s.mockImage.name||"")+'"><div class="area-layer"></div></div>'
        + '</div></div>';
    } else {
      shot.innerHTML =
          '<label class="add"><span class="plus">+</span><span>화면을 등록하세요</span>'
        +   '<span style="font-size:11.5px;font-weight:600">등록하면서 구역 영역을 지정할 수 있어요</span>'
        +   '<input type="file" accept="image/*" data-act="scrshot-file" style="display:none"></label>';
    }
    var pick = function(sel){ var el = shot.querySelector(sel); if(el) el.onchange = function(e){
      var f = e.target.files && e.target.files[0]; e.target.value = "";
      if(f) openAreaEditor(s, f);
    }; };
    pick("[data-act='scrshot-file']"); pick("[data-act='scrshot-replace']");
    var ed = shot.querySelector("[data-act='area-edit']");
    if(ed) ed.onclick = function(){ openAreaEditor(s, null); };
    var rm = shot.querySelector("[data-act='scrshot-del']");
    if(rm) rm.onclick = function(e){
      e.stopPropagation();
      uiConfirm({ title:"화면 이미지 삭제", ok:"삭제", danger:true,
        message:"'"+s.screenId+"' 화면 이미지를 삭제할까요?\n구역과 구역 영역 표시는 그대로 남아서, 새 이미지를 올리면 다시 쓸 수 있어요.\n저장을 눌러야 서버에 반영돼요." }).then(function(y){
        if(!y) return;
        var old = s.mockImage; s.mockImage = null;
        save(); renderMid(); toast("화면 이미지 삭제됨 · 저장을 눌러야 서버에 반영돼요");
        if(old) queueDelete(old.path);
      });
    };
    var img = shot.querySelector(".shotbox img");
    if(img){
      var draw = function(){ _drawAreaLayer(shot, s, img); };
      if(img.complete && img.naturalWidth) draw(); else img.addEventListener("load", draw);
      img.onclick = function(e){ e.stopPropagation(); openShotLightbox(s.mockImage); };
    }
  }
  // 가운데 이미지 위에 구역 번호 네모를 겹쳐 그린다. 네모를 누르면 그 구역이 선택된다.
  function _drawAreaLayer(shot, s, img){
    var layer = shot.querySelector(".area-layer"); if(!layer || !img.naturalWidth) return;
    var ratio = img.naturalHeight / img.naturalWidth;
    layer.innerHTML = _orderedSecs(s).map(function(sec, i){
      var a = normArea(sec.area); if(!a) return "";
      var sel = STATE.selectedSectionId===sec.id ? " sel" : "";
      return '<div class="area-box'+sel+'" data-sec-id="'+esc(sec.id)+'" style="'+_areaCss(a, ratio)+'" title="'+esc((i+1)+". "+(sec.title||"구역"))+'"><span class="area-no">'+(i+1)+'</span></div>';
    }).join("");
    layer.querySelectorAll(".area-box").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        STATE.selectedSectionId = b.dataset.secId; saveUi();
        renderMid(); renderDetail();
      });
    });
  }
  function openShotLightbox(im){
    if(!im || !im.url) return;
    document.getElementById("imglbImg").src = im.url;
    document.getElementById("imglbCap").textContent = (im.name||"화면 이미지")+" · 클릭하면 닫힘";
    document.getElementById("imglb").classList.add("show");
  }

  // 5MB 가 넘는 이미지는 가로 1600px 이하로 줄여서 올린다 (영역은 비율이라 크기가 바뀌어도 그대로 맞음)
  function _prepareUpload(f){
    if(f.size <= 5*1024*1024) return Promise.resolve({ blob:f, ext:((/\.([a-zA-Z0-9]+)$/.exec(f.name||"")||[])[1]||"png").toLowerCase(), type:f.type });
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(f), im = new Image();
      im.onload = function(){
        var w = Math.min(1600, im.naturalWidth), h = Math.round(im.naturalHeight * w / im.naturalWidth);
        var c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(im, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){
          if(!b) return reject(new Error("encode"));
          if(b.size > 5*1024*1024) return reject(new Error("too big"));
          resolve({ blob:b, ext:"jpg", type:"image/jpeg" });
        }, "image/jpeg", 0.88);
      };
      im.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("load")); };
      im.src = url;
    });
  }
  function _uploadScreenImage(s, f){
    return _prepareUpload(f).then(function(p){
      var path = "screens/" + s.screenId + "." + p.ext;
      return fetch(SB.url + "/storage/v1/object/" + SB_BUCKET + "/" + path, {
        method:"POST",
        headers:{ "apikey":SB.key, "Authorization":"Bearer "+SB.key, "Content-Type":p.type||"application/octet-stream", "x-upsert":"true" },
        body:p.blob
      }).then(function(res){
        if(!res.ok) return res.text().then(function(t){ throw new Error(t || ("HTTP "+res.status)); });
        return { id:uid("shot"), name:f.name, path:path, url:SB.url + "/storage/v1/object/public/" + SB_BUCKET + "/" + path + "?v=" + Date.now() };
      });
    });
  }

  /* ── 영역 편집 창 ──
     file 이 있으면 "새 이미지 등록/교체", 없으면 "지금 이미지에서 영역만 편집".
     [완료] 전에는 아무것도 바뀌지 않고, [취소]하면 업로드도 하지 않는다. */
  function openAreaEditor(s, file){
    if(document.getElementById("areaEd")) return;
    if(file && !SB.url){ toast("서버 연결이 없어 이미지 업로드가 안 돼요", true); return; }
    if(file && !/^image\//.test(file.type||"")){ toast("이미지 파일만 올릴 수 있어요", true); return; }
    var secs = _orderedSecs(s);
    var work = {};                   // 구역 id → area (편집 중인 사본)
    secs.forEach(function(x){ var a = normArea(x.area); if(a) work[x.id] = a; });
    var start = stable(work);
    var undo = [];
    var cur = (STATE.selectedSectionId && secs.some(function(x){return x.id===STATE.selectedSectionId;})) ? STATE.selectedSectionId
            : ((secs.find(function(x){ return !work[x.id]; }) || secs[0] || {}).id || null);
    var src = file ? URL.createObjectURL(file) : s.mockImage.url;
    var ratio = 1;

    var bg = document.createElement("div"); bg.className = "modalbg show"; bg.id = "areaEd";
    bg.innerHTML =
        '<div class="ae">'
      +   '<div class="ae-head"><b>'+(file ? (s.mockImage ? "이미지 교체 · 구역 영역 지정" : "화면 등록 · 구역 영역 지정") : "구역 영역 편집")+'</b>'
      +     '<span class="ae-sub">'+esc(s.screenId)+' '+esc(s.title||"")+'</span><span class="sp"></span>'
      +     '<button type="button" class="ae-btn" data-ae="undo" title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button>'
      +     '<button type="button" class="ae-btn" data-ae="clear">전체 지우기</button>'
      +     '<button type="button" class="ae-btn" data-ae="cancel">취소</button>'
      +     '<button type="button" class="ae-btn primary" data-ae="done">'+(file ? "완료 · 업로드" : "완료")+'</button></div>'
      +   '<div class="ae-body">'
      +     '<div class="ae-stage"><div class="ae-canvas"><img alt="" draggable="false"><div class="ae-layer"></div></div></div>'
      +     '<div class="ae-side"><div class="ae-tip">오른쪽에서 구역을 고르고, 이미지 위를 <b>드래그</b>해서 영역을 그리세요.<br>네모는 끌어서 옮기고, 모서리(□)로 크기를 바꿀 수 있어요.<br><span style="font-size:11.5px">되돌리기 Ctrl+Z · 선택한 영역 지우기 Delete</span></div>'
      +       '<div class="ae-list"></div></div>'
      +   '</div>'
      + '</div>';
    document.body.appendChild(bg);
    var imgEl = bg.querySelector(".ae-canvas img"), layer = bg.querySelector(".ae-layer"), canvasEl = bg.querySelector(".ae-canvas");
    var listEl = bg.querySelector(".ae-list");

    function no(id){ for(var i=0;i<secs.length;i++) if(secs[i].id===id) return i+1; return 0; }
    function renderList(){
      if(!secs.length){ listEl.innerHTML = '<div class="ae-empty">이 화면에 아직 구역이 없어요.<br>이미지만 먼저 등록하고, 구역을 추가한 뒤 [영역 편집]에서 지정할 수 있어요.</div>'; return; }
      listEl.innerHTML = secs.map(function(x, i){
        var has = !!work[x.id];
        return '<div class="ae-row'+(x.id===cur?" cur":"")+'" data-id="'+esc(x.id)+'">'
          + '<span class="ae-no">'+(i+1)+'</span><span class="ae-nm">'+esc(x.title||"구역")+'</span>'
          + (has ? '<span class="ae-st ok">지정됨</span><span class="ae-x" data-x="'+esc(x.id)+'" title="이 구역의 영역만 지우기 (구역은 그대로)">×</span>'
                 : '<span class="ae-st">미지정</span>')
          + '</div>';
      }).join("");
    }
    function renderBoxes(){
      layer.innerHTML = secs.map(function(x){
        var a = work[x.id]; if(!a) return "";
        return '<div class="ae-box'+(x.id===cur?" cur":"")+'" data-id="'+esc(x.id)+'" style="'+_areaCss(a, ratio)+'">'
          + '<span class="area-no">'+no(x.id)+'</span>'
          + (x.id===cur ? '<i class="h ne" data-h="ne"></i><i class="h sw" data-h="sw"></i><i class="h se" data-h="se"></i>' : '')   // 왼쪽 위는 번호 자리
          + '</div>';
      }).join("");
    }
    function render(){ renderList(); renderBoxes(); bg.querySelector('[data-ae="undo"]').disabled = !undo.length; }
    function pushUndo(){ undo.push(clone(work)); if(undo.length > 50) undo.shift(); }
    function nextUnmapped(){ var n = secs.find(function(x){ return !work[x.id]; }); return n ? n.id : cur; }

    imgEl.onload = function(){ ratio = imgEl.naturalHeight / imgEl.naturalWidth;
      // 교체한 이미지가 더 짧아서 네모가 아래로 벗어나면 이미지 안으로 끌어올린다
      Object.keys(work).forEach(function(k){ var a = work[k];
        a.w = Math.min(a.w, 1); a.x = Math.max(0, Math.min(a.x, 1 - a.w));
        a.h = Math.min(a.h, ratio); a.y = Math.max(0, Math.min(a.y, ratio - a.h));
      });
      render(); };
    imgEl.onerror = function(){ toast("이미지를 불러오지 못했어요", true); };
    imgEl.src = src;

    // ── 그리기 / 옮기기 / 크기 조절 (포인터 좌표 → 가로 폭 기준 비율)
    function pt(e){ var r = canvasEl.getBoundingClientRect(); return { x:(e.clientX - r.left)/r.width, y:(e.clientY - r.top)/r.width, W:r.width }; }
    var drag = null;
    canvasEl.addEventListener("pointerdown", function(e){
      if(e.button !== 0 || !imgEl.naturalWidth) return;
      e.preventDefault();
      var p = pt(e), t = e.target, box = t.closest ? t.closest(".ae-box") : null;
      if(t.dataset && t.dataset.h && box){ drag = { mode:"resize", id:box.dataset.id, h:t.dataset.h, p0:p, a0:clone(work[box.dataset.id]), moved:false }; }
      else if(box){ cur = box.dataset.id; drag = { mode:"move", id:cur, p0:p, a0:clone(work[cur]), moved:false }; render(); }
      else {
        if(!cur){ toast(secs.length ? "오른쪽에서 구역을 먼저 골라 주세요" : "구역을 먼저 추가해 주세요", true); return; }
        drag = { mode:"draw", id:cur, p0:p, a0:work[cur] ? clone(work[cur]) : null, moved:false };
      }
      drag.snap = clone(work);
      canvasEl.setPointerCapture(e.pointerId);
    });
    canvasEl.addEventListener("pointermove", function(e){
      if(!drag) return;
      var p = pt(e), dx = p.x - drag.p0.x, dy = p.y - drag.p0.y;
      if(!drag.moved && Math.abs(dx*p.W) < 3 && Math.abs(dy*p.W) < 3) return;
      drag.moved = true;
      var clampX = function(v){ return Math.max(0, Math.min(1, v)); }, clampY = function(v){ return Math.max(0, Math.min(ratio, v)); };
      if(drag.mode==="draw"){
        var x1 = clampX(drag.p0.x), y1 = clampY(drag.p0.y), x2 = clampX(p.x), y2 = clampY(p.y);
        work[drag.id] = { x:Math.min(x1,x2), y:Math.min(y1,y2), w:Math.abs(x2-x1), h:Math.abs(y2-y1) };
      } else if(drag.mode==="move"){
        var a = drag.a0;
        work[drag.id] = { x:Math.max(0, Math.min(1-a.w, a.x+dx)), y:Math.max(0, Math.min(ratio-a.h, a.y+dy)), w:a.w, h:a.h };
      } else {
        var b = drag.a0, L = b.x, T = b.y, R = b.x+b.w, B = b.y+b.h;
        if(drag.h.indexOf("w")>=0) L = clampX(Math.min(R - 0.01, b.x + dx));
        if(drag.h.indexOf("e")>=0) R = clampX(Math.max(L + 0.01, R + dx));
        if(drag.h.indexOf("n")>=0) T = clampY(Math.min(B - 0.01, b.y + dy));
        if(drag.h.indexOf("s")>=0) B = clampY(Math.max(T + 0.01, B + dy));
        work[drag.id] = { x:L, y:T, w:R-L, h:B-T };
      }
      renderBoxes();
    });
    function endDrag(){
      if(!drag) return;
      var d = drag; drag = null;
      if(!d.moved){ if(d.mode==="draw" && !d.a0) delete work[d.id]; renderBoxes(); return; }
      var a = work[d.id];
      if(d.mode==="draw" && a && (a.w < 0.01 || a.h < 0.01)){ if(d.a0) work[d.id] = d.a0; else delete work[d.id]; renderBoxes(); return; }
      work[d.id] = normArea(a);
      undo.push(d.snap); if(undo.length > 50) undo.shift();
      if(d.mode==="draw") cur = nextUnmapped();   // 새로 그렸으면 다음 미지정 구역으로 자동 이동
      render();
    }
    canvasEl.addEventListener("pointerup", endDrag);
    canvasEl.addEventListener("pointercancel", endDrag);

    // ── 오른쪽 구역 목록
    listEl.addEventListener("click", function(e){
      var x = e.target.dataset && e.target.dataset.x;
      if(x){ pushUndo(); delete work[x]; cur = x; render(); return; }
      var row = e.target.closest(".ae-row"); if(!row) return;
      cur = row.dataset.id; render();
      var box = layer.querySelector('.ae-box[data-id="'+cur+'"]');
      if(box) box.scrollIntoView({ block:"nearest", behavior:"smooth" });
    });

    function close(){
      document.removeEventListener("keydown", onKey, true);
      if(file) URL.revokeObjectURL(src);
      bg.remove();
    }
    function changed(){ return !!file || stable(work) !== start; }
    function cancel(){
      if(!changed()){ close(); return; }
      uiConfirm({ title:"편집 취소", ok:"편집 버리기", danger:true, focusCancel:true,
        message: file ? "이미지를 올리지 않고 닫을까요?\n지금까지 지정한 영역도 반영되지 않아요." : "지금까지 바꾼 영역을 반영하지 않고 닫을까요?" })
        .then(function(y){ if(y) close(); });
    }
    function applyAreas(){
      // 구역은 건드리지 않고 area 칸만 바꾼다
      (s.sections||[]).forEach(function(x){ x.area = work[x.id] ? normArea(work[x.id]) : null; });
    }
    function done(){
      if(!file){
        if(stable(work) !== start){ applyAreas(); save(); renderMid(); renderDetail(); toast("구역 영역 반영됨 · 저장을 눌러야 서버에 반영돼요"); }
        close(); return;
      }
      var btn = bg.querySelector('[data-ae="done"]'); btn.disabled = true; btn.textContent = "업로드 중…";
      var old = s.mockImage;
      _uploadScreenImage(s, file).then(function(mi){
        if(old && old.path && old.path !== mi.path) queueDelete(old.path);
        s.mockImage = mi; applyAreas();
        save(); renderMid(); renderDetail();
        toast((old ? "이미지 교체됨" : "화면 이미지 등록됨") + " · 저장을 눌러야 서버에 반영돼요");
        close();
      }).catch(function(err){
        console.warn("[upload]", err);
        btn.disabled = false; btn.textContent = "완료 · 업로드";
        toast("업로드 실패 · 다시 시도해 주세요" + (/too big/.test(err && err.message) ? " (이미지가 너무 커요)" : ""), true);
      });
    }
    bg.querySelector(".ae-head").addEventListener("click", function(e){
      var a = e.target.dataset && e.target.dataset.ae; if(!a) return;
      if(a==="undo" && undo.length){ work = undo.pop(); render(); }
      else if(a==="clear"){
        if(!Object.keys(work).length) return;
        uiConfirm({ title:"영역 전체 지우기", ok:"전체 지우기", danger:true, message:"이 화면의 구역 영역 표시를 모두 지울까요?\n구역 자체는 그대로 남아요." })
          .then(function(y){ if(y){ pushUndo(); work = {}; cur = secs[0] ? secs[0].id : null; render(); } });
      }
      else if(a==="cancel") cancel();
      else if(a==="done") done();
    });
    function onKey(e){
      if(document.querySelector('.modalbg[data-ui]')) return;   // 확인 모달이 떠 있으면 그쪽이 처리
      if((e.ctrlKey || e.metaKey) && (e.key==="z" || e.key==="Z")){ e.preventDefault(); if(undo.length){ work = undo.pop(); render(); } }
      else if((e.key==="Delete" || e.key==="Backspace") && cur && work[cur]){ e.preventDefault(); pushUndo(); delete work[cur]; render(); }
      else if(e.key==="Escape"){ e.preventDefault(); cancel(); }
    }
    document.addEventListener("keydown", onKey, true);
    render();
  }

  /* ===================== 공통 정의 =====================
     정의 하나 = "칸(열)을 자유롭게 정하는 표" 하나.
       · 정책형: 칸이 [항목 | 내용] 2개인 표 (Push 발송 정책, 금칙어 정책, 외부 연계 …)
       · 목록형: 칸을 직접 정한 표 (API 목록, 토스트·팝업 문구, Push 메시지 목록 …)
     정의 ID(CD01)와 줄 ID(CD01-001)는 한번 정하면 바뀌지 않고, 지운 정의 번호는 재사용하지 않는다. (줄 번호는 구역에 연결된 적 없는 번호면 다시 쓸 수 있음)
     구역은 정의 전체(CD01) 또는 특정 줄(CD01-012)을 참조한다. 정의를 지워도 구역은 절대 지워지지 않는다. */
  var _defSel = null;          // 공통 정의 화면에서 선택된 정의 ID
  var _defQ = "";              // 공통 정의 목록 검색어
  function findDef(id){ return (STATE.defs||[]).find(function(d){ return d.id===id; }) || null; }
  function resolveRef(ref){
    var d = findDef(ref); if(d) return { def:d, row:null };
    var defs = STATE.defs||[];
    for(var i=0;i<defs.length;i++){
      var r = (defs[i].rows||[]).find(function(x){ return x.id===ref; });
      if(r) return { def:defs[i], row:r };
    }
    return null;
  }
  function _rowLabel(d, r){
    var parts = [];
    (d.columns||[]).forEach(function(c){ var v = (r.cells||{})[c.id]; if(v && parts.length < 2) parts.push(String(v).replace(/\s+/g," ")); });
    var s = parts.join(" / ");
    return s.length > 48 ? s.slice(0,48) + "…" : (s || "(빈 줄)");
  }
  // 어떤 구역이 이 정의(또는 줄)를 참조하는지
  function defUsages(d, onlyRowId){
    var ids = {};
    if(onlyRowId) ids[onlyRowId] = 1;
    else { ids[d.id] = 1; (d.rows||[]).forEach(function(r){ ids[r.id] = 1; }); }
    var out = [];
    (STATE.screens||[]).slice().sort(_byScreenIdNum).forEach(function(s){
      _orderedSecs(s).forEach(function(sec){
        (sec.defRefs||[]).forEach(function(ref){ if(ids[ref]) out.push({ screen:s, section:sec, ref:ref }); });
      });
    });
    return out;
  }
  // 표시용: "홈화면 / 기능명" , 정렬: 참조 ID(CD01 → CD01-001 → CD01-002 …) 순, 같으면 화면 순
  function _usageName(u){ return (u.screen.title || u.screen.screenId) + " / " + (u.section.title || "구역"); }
  function _sortUsages(list){
    return list.map(function(u, i){ return { u:u, i:i }; })
      .sort(function(a, b){ return a.u.ref < b.u.ref ? -1 : a.u.ref > b.u.ref ? 1 : a.i - b.i; })
      .map(function(x){ return x.u; });
  }
  function _usageText(list){
    list = _sortUsages(list);
    return list.slice(0,10).map(function(u){ return "· " + u.ref + "  " + _usageName(u); }).join("\n")
      + (list.length > 10 ? "\n… 외 "+(list.length-10)+"곳" : "");
  }
  function _nextDefCode(){
    var mx = _defCodeMax;
    (STATE.defs||[]).forEach(function(d){ var m = /^CD-?(\d+)$/.exec(d.id); if(m) mx = Math.max(mx, parseInt(m[1],10)); });
    return "CD" + String(mx+1).padStart(2,"0");   // CD01, CD02 … (100번째부터는 CD100)
  }

  // ── 화면 전환: 편집 화면 ↔ 공통 정의
  function showDefsScreen(){
    hideHistoryScreen();
    document.getElementById("mainView").style.display = "none";
    document.getElementById("defsScreen").classList.add("show");
    _syncDefsBtnLabel();
    renderDefsScreen();
  }
  function hideDefsScreen(){
    var ds = document.getElementById("defsScreen");
    if(!ds || !ds.classList.contains("show")) return;
    ds.classList.remove("show");
    if(!document.getElementById("historyScreen").classList.contains("show")) document.getElementById("mainView").style.display = "";
    _syncDefsBtnLabel();
  }
  function _defsOpen(){ var ds = document.getElementById("defsScreen"); return !!(ds && ds.classList.contains("show")); }
  function _syncDefsBtnLabel(){ var b = document.getElementById("btnDefs"); if(!b) return; var o = _defsOpen(); b.textContent = o ? "✕ 공통 정의 닫기" : "공통 정의"; b.classList.toggle("closing", o); }
  function toggleDefsScreen(){ if(_defsOpen()) hideDefsScreen(); else showDefsScreen(); }
  function openDef(id, rowId){
    var d = findDef(id); if(!d){ toast("공통 정의를 찾을 수 없어요", true); return; }
    _defSel = id;
    showDefsScreen();
    if(rowId){
      var tr = document.querySelector('#defDetail tr[data-row="'+rowId+'"]');
      if(tr){ tr.scrollIntoView({ block:"center" }); tr.classList.add("flash"); setTimeout(function(){ tr.classList.remove("flash"); }, 1600); }
    }
  }
  function gotoSection(sid, secId){
    hideDefsScreen(); hideHistoryScreen();
    STATE.selectedScreenId = sid; STATE.selectedSectionId = secId;
    renderAll();
  }

  function renderDefsScreen(){
    if(!_defsOpen()) return;
    if(_defSel && !findDef(_defSel)) _defSel = null;
    renderDefList(); renderDefDetail();
  }

  // ── 왼쪽: 공통 정의 목록 (ID 순)
  function renderDefList(){
    var box = document.getElementById("defList"); if(!box) return;
    var info = document.getElementById("defInfo"); if(info) info.textContent = "전체 " + (STATE.defs||[]).length;
    if(!_defsReady && !(STATE.defs||[]).length){
      box.innerHTML = '<div class="empty">서버 설정이 최신이 아니에요.<br>설정 SQL 을 한 번 더 실행하면 공통 정의를 쓸 수 있어요.</div>'; return;
    }
    var q = _defQ.trim().toLowerCase();
    var list = (STATE.defs||[]).filter(function(d){
      return !q || (d.id+" "+d.name+" "+d.prefix).toLowerCase().indexOf(q) >= 0;
    }).sort(function(a,b){ return a.id<b.id?-1:1; });
    if(!list.length){
      box.innerHTML = '<div class="empty">' + (q ? "검색 결과가 없어요." : '아직 공통 정의가 없어요.<br>"+ 공통 정의"로 만들어 보세요.') + '</div>'; return;
    }
    box.innerHTML = list.map(function(d){
      return '<div class="scr-row'+(d.id===_defSel?' active':'')+'" data-def-id="'+esc(d.id)+'">'
        + '<span class="sid">'+esc(d.id)+'</span><span class="nm">'+esc(d.name||"(이름 없음)")+'</span></div>';
    }).join("");
    box.querySelectorAll("[data-def-id]").forEach(function(el){
      el.addEventListener("click", function(){ _defSel = el.dataset.defId; renderDefsScreen(); });
    });
  }
  // 마지막 업데이트 = 서버에 마지막으로 저장된 시각 · 저장한 사람
  function _defUpdatedText(d){
    var m = META.defs && META.defs[d.id];
    if(!m || !m.at) return "마지막 업데이트: 아직 저장 전";
    var t = new Date(m.at), p = function(n){ return String(n).padStart(2,"0"); };
    return "마지막 업데이트: " + t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate())+" "+p(t.getHours())+":"+p(t.getMinutes())
      + (m.by ? " · " + m.by : "");
  }
  function _defStCls(d){ return d.status==="확정" ? "st-ok" : d.status==="검토중" ? "st-wr" : ""; }

  // ── 새 공통 정의 만들기
  function openNewDefModal(){
    if(document.getElementById("newDefBg")) return;
    if(!_defsReady){ uiAlert("서버 설정이 최신이 아니에요.\n설정 SQL 을 한 번 더 실행하면 공통 정의를 쓸 수 있어요."); return; }
    var code = _nextDefCode();
    var bg = document.createElement("div"); bg.className = "modalbg show"; bg.id = "newDefBg";
    bg.innerHTML = '<div class="modal" style="width:540px">'

  // 새 줄 번호 = (지금 남아 있는 줄 번호, 구역에 연결된 적 있는 번호) 중 가장 큰 번호 + 1
  //  · 실수로 만들었다 지운 줄은 번호를 다시 쓸 수 있음
  //  · 단, 어떤 구역에 연결된 번호는 지웠더라도 다시 쓰지 않음 (다른 내용이 엉뚱한 구역에 붙는 걸 막기 위함)
  function _defRowId(d){
    var pre = d.prefix + "-", mx = 0;
    function take(id){
      if(typeof id !== "string" || id.indexOf(pre) !== 0) return;
      var m = /^(\d+)$/.exec(id.slice(pre.length)); if(m) mx = Math.max(mx, parseInt(m[1], 10));
    }
    (d.rows||[]).forEach(function(r){ take(r.id); });
    (STATE.screens||[]).forEach(function(s){ (s.sections||[]).forEach(function(sec){ (sec.defRefs||[]).forEach(take); }); });
    var n = mx + 1;
    d.nextRow = n + 1;
    return pre + String(n).padStart(3,"0");
  }
  function _parseTSV(text){
    // 엑셀 복사 형식: 탭으로 칸, 줄바꿈으로 줄. 칸 안의 줄바꿈·따옴표는 "..." 로 감싸져 온다
    var rows = [], row = [], cell = "", i = 0, q = false;
    text = text.replace(/\r\n?/g, "\n");
    while(i < text.length){
      var ch = text[i];
      if(q){
        if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i += 2; continue; } q = false; i++; continue; }
        cell += ch; i++; continue;
      }
      if(ch === '"' && cell === ""){ q = true; i++; continue; }
      if(ch === "\t"){ row.push(cell); cell = ""; i++; continue; }
      if(ch === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; i++; continue; }
      cell += ch; i++;
    }
    if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
    return rows;
  }

  function bindDefDetail(box, head, d){
    // 기본 정보
    box.querySelectorAll("[data-df]").forEach(function(el){
      el.addEventListener("input", function(){
        var k = el.dataset.df;
        if(el.tagName==="TEXTAREA") _autoGrow(el);
        d[k] = el.value; _markDirty();
        if(k==="name"){ var t = head.querySelector(".dtitle"); if(t) t.textContent = d.name || "(이름 없음)"; }
      });
      el.addEventListener("change", function(){
        var k = el.dataset.df;
        if(k==="name"){ d.name = el.value.trim(); save(); renderDefList(); }
      });
    });
    // 칸 이름
    box.querySelectorAll("[data-colname]").forEach(function(el){
      el.addEventListener("input", function(){ var c = d.columns.find(function(x){ return x.id===el.dataset.colname; }); if(c){ c.name = el.value; _markDirty(); } });
    });
    // 셀 입력 + 엑셀 붙여넣기
    box.querySelectorAll(".dcell").forEach(function(el){
      el.addEventListener("input", function(){
        _autoGrow(el);
        var r = d.rows.find(function(x){ return x.id===el.dataset.cellRow; }); if(!r) return;
        r.cells = r.cells || {};
        if(el.value === "") delete r.cells[el.dataset.cellCol]; else r.cells[el.dataset.cellCol] = el.value;
        _markDirty();
      });
      el.addEventListener("paste", function(e){
        var text = (e.clipboardData || window.clipboardData).getData("text");
        if(!text || (text.indexOf("\t") < 0 && text.replace(/\n$/,"").indexOf("\n") < 0)) return;   // 한 칸짜리는 평소대로
        e.preventDefault();
        var grid = _parseTSV(text.replace(/\n$/,""));
        var r0 = d.rows.findIndex(function(x){ return x.id===el.dataset.cellRow; });
        var c0 = d.columns.findIndex(function(x){ return x.id===el.dataset.cellCol; });
        var addedCols = 0, addedRows = 0;
        grid.forEach(function(line, i){
          var ri = r0 + i;
          if(ri >= d.rows.length){ d.rows.push({ id:_defRowId(d), cells:{} }); addedRows++; }
          var row = d.rows[ri]; row.cells = row.cells || {};
          line.forEach(function(val, j){
            var ci = c0 + j;
            while(ci >= d.columns.length){ d.columns.push({ id:uid("c"), name:"칸 " + (d.columns.length + 1) }); addedCols++; }
            var cid = d.columns[ci].id;
            if(val === "") delete row.cells[cid]; else row.cells[cid] = val;
          });
        });
        save(); renderDefDetail();
        toast(grid.length + "줄 붙여넣음" + (addedRows ? " · 줄 "+addedRows+"개 추가" : "") + (addedCols ? " · 칸 "+addedCols+"개 추가" : "") + " · 저장을 눌러야 서버에 반영돼요");
      });
    });
    // 줄 이동 / 삭제 / 사용처
    box.querySelectorAll("[data-rmove]").forEach(function(el){
      el.addEventListener("click", function(){
        var i = +el.dataset.r, j = el.dataset.rmove==="up" ? i-1 : i+1;
        if(j < 0 || j >= d.rows.length) return;
        var t = d.rows[i]; d.rows[i] = d.rows[j]; d.rows[j] = t;
        save(); renderDefDetail();
      });
    });
    box.querySelectorAll("[data-rdel]").forEach(function(el){
      el.addEventListener("click", function(){
        var rid = el.dataset.rdel, u = defUsages(d, rid);
        var doDel = function(){ d.rows = d.rows.filter(function(x){ return x.id!==rid; }); save(); renderDefDetail(); };
        if(!u.length){ doDel(); toast(rid+" 줄 삭제됨 · 저장 전이면 '내 변경 버리기'로 되돌릴 수 있어요"); return; }
        uiConfirm({ title:"줄 삭제", ok:"삭제", danger:true, width:520, message:"'"+rid+"' 줄을 삭제할까요?",
          warn:"이 줄을 참조하는 구역이 "+u.length+"곳 있어요. 삭제해도 구역은 그대로 남고, 참조만 '없는 항목'으로 표시돼요.\n"+_usageText(u) })
          .then(function(y){ if(y) doDel(); });
      });
    });
    box.querySelectorAll("[data-ruse]").forEach(function(el){
      el.addEventListener("click", function(){
        var u = defUsages(d, el.dataset.ruse);
        uiAlert("'"+el.dataset.ruse+"' 줄을 참조하는 구역 "+u.length+"곳\n\n"+_usageText(u), "사용 중인 구역");
      });
    });
    box.querySelectorAll("[data-goto-sec]").forEach(function(el){
      el.addEventListener("click", function(){ gotoSection(el.dataset.gotoSid, el.dataset.gotoSec); });
    });
    // 칸 삭제
    box.querySelectorAll("[data-coldel]").forEach(function(el){
      el.addEventListener("click", function(){
        var cid = el.dataset.coldel, c = d.columns.find(function(x){ return x.id===cid; }); if(!c) return;
        var filled = d.rows.filter(function(r){ return r.cells && r.cells[cid]; }).length;
        uiConfirm({ title:"칸 삭제", ok:"칸 삭제", danger:true, message:"'"+(c.name||"이름 없는 칸")+"' 칸을 삭제할까요?",
          warn: filled ? "이 칸에 적힌 내용 "+filled+"개도 함께 사라져요." : null }).then(function(y){
          if(!y) return;
          d.columns = d.columns.filter(function(x){ return x.id!==cid; });
          d.rows.forEach(function(r){ if(r.cells) delete r.cells[cid]; });
          save(); renderDefDetail();
        });
      });
    });
    // 머리 버튼 / 표 버튼
    function act(a){
      if(a==="addrow"){
        var rid = _defRowId(d); d.rows.push({ id:rid, cells:{} }); save(); renderDefDetail();
        var first = document.querySelector('#defDetail .dcell[data-cell-row="'+rid+'"]'); if(first){ first.focus(); first.scrollIntoView({ block:"nearest" }); }
      }
      else if(a==="addcol"){
        uiPrompt({ title:"칸 추가", label:"칸 이름", placeholder:"예: 노출 조건", ok:"추가", required:true }).then(function(n){
          if(!n || !n.trim()) return;
          d.columns.push({ id:uid("c"), name:n.trim() }); save(); renderDefDetail();
        });
      }
      else if(a==="csv") exportDefCsv(d);
      else if(a==="del"){
        var u = defUsages(d);
        uiConfirm({ title:"공통 정의 삭제", ok:"삭제", danger:true, width:520,
          message:"'"+d.id+" "+d.name+"' 공통 정의를 삭제할까요?\n줄 "+d.rows.length+"개도 함께 삭제되고, 저장을 눌러야 서버에 반영돼요.",
          warn: u.length ? "이 정의(또는 줄)를 참조하는 구역이 "+u.length+"곳 있어요. 구역은 그대로 남고, 참조만 '없는 공통 정의'로 표시돼요.\n"+_usageText(u) : null })
          .then(function(y){
            if(!y) return;
            STATE.defs = STATE.defs.filter(function(x){ return x.id!==d.id; });
            _defSel = null; save(); renderDefsScreen(); toast("공통 정의 삭제됨 · 저장을 눌러야 서버에 반영돼요");
          });
      }
    }
    box.querySelectorAll("[data-dd]").forEach(function(b){ b.addEventListener("click", function(){ act(b.dataset.dd); }); });
    head.querySelectorAll("[data-dd]").forEach(function(b){ b.addEventListener("click", function(){ act(b.dataset.dd); }); });
  }

  function exportDefCsv(d){
    var q = function(v){ var s = String(v==null?"":v).replace(/"/g,'""'); return /[",\r\n]/.test(s) ? '"'+s+'"' : s; };
    var lines = [["ID"].concat(d.columns.map(function(c){ return c.name; })).map(q).join(",")];
    d.rows.forEach(function(r){ lines.push([r.id].concat(d.columns.map(function(c){ return (r.cells||{})[c.id]||""; })).map(q).join(",")); });
    var safe = String(d.name||"").replace(/[\\/:*?"<>|\s]+/g,"_").slice(0,40);
    _download("공통정의_"+d.id+(safe?"_"+safe:"")+"_"+todayStr()+".csv", new Blob(["﻿"+lines.join("\r\n")+"\r\n"], {type:"text/csv;charset=utf-8"}));
    toast("CSV 내보내기 완료 · "+d.rows.length+"줄");
  }

  // ── 구역 상세: 공통 정의 참조
  // 연관 공통 정의: ① 공통 정의 고르기 → ② 그 안의 항목(또는 정의 전체) 고르기 = 바로 추가
  var _defPick = { sec:null, def:"" };
  function _defSelect(sec){
    var refs = sec.defRefs||[];
    var cur = (_defPick.sec===sec.id && findDef(_defPick.def)) ? _defPick.def : "";
    var h = '<div class="defpick"><select data-act="defref-def"><option value="">— 공통 정의 선택 —</option>'
      + (STATE.defs||[]).slice().sort(function(a,b){ return a.id<b.id?-1:1; }).map(function(d){
          return '<option value="'+esc(d.id)+'"'+(d.id===cur?' selected':'')+'>'+esc(d.id)+' · '+esc(d.name||"(이름 없음)")+'</option>';
        }).join("") + '</select>';
    h += '<select data-act="defref-add"'+(cur?'':' disabled')+'>';
    if(!cur) h += '<option value="">← 먼저 공통 정의를 고르세요</option>';
    else {
      var d = findDef(cur), opts = [];
      if(refs.indexOf(d.id)<0) opts.push('<option value="'+esc(d.id)+'">정의 전체</option>');
      (d.rows||[]).forEach(function(r){ if(refs.indexOf(r.id)<0) opts.push('<option value="'+esc(r.id)+'">'+esc(r.id)+' · '+esc(_rowLabel(d, r))+'</option>'); });
      h += opts.length ? '<option value="">— 항목 선택 ('+opts.length+') —</option>' + opts.join("")
                       : '<option value="">이 공통 정의의 항목은 모두 추가됐어요</option>';
    }
    return h + '</select></div>';
  }
  function _defLine(ref){
    var x = '<span class="sl-x" data-act="defref-x" data-value="'+esc(ref)+'" title="참조 삭제">×</span>';
    var r = resolveRef(ref);
    if(!r) return '<div class="scrlink gone" title="삭제되었거나 없는 공통 정의"><span class="sl-id">'+esc(ref)+'</span><span class="sl-nm">(없는 공통 정의)</span>'+x+'</div>';
    var nm = r.row ? _rowLabel(r.def, r.row) + ' <em>· ' + esc(r.def.name) + '</em>' : esc(r.def.name) + ' <em>· 정의 전체</em>';
    return '<div class="scrlink def" data-act="goto-def" data-def="'+esc(r.def.id)+'" data-row="'+esc(r.row ? r.row.id : "")+'" title="공통 정의 열기"><span class="sl-id">'+esc(ref)+'</span><span class="sl-nm">'+(r.row ? esc(_rowLabel(r.def, r.row)) + ' <em>· ' + esc(r.def.name) + '</em>' : nm)+'</span>'+x+'</div>';
  }
  // 화면 상단: 이 화면의 구역들이 참조하는 공통 정의를 자동으로 모아 보여준다
  function _screenDefChips(s){
    var seen = {}, list = [];
    _orderedSecs(s).forEach(function(sec){
      (sec.defRefs||[]).forEach(function(ref){ var r = resolveRef(ref); if(r && !seen[r.def.id]){ seen[r.def.id] = 1; list.push(r.def); } });
    });
    if(!list.length) return "";
    return '<div class="defchips"><span class="lbl">연관 공통 정의</span>' + list.map(function(d){

  // 화면 선택 드롭다운 (그룹별 묶음, 화면 ID 순) — 연관 화면 ID · 페이지연결 공통
  function _screenSelect(attrs, placeholder, exclude, selected){
    var html = '<select '+attrs+'><option value="">'+esc(placeholder)+'</option>';
    var groups = (STATE.groups||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
    var buckets = groups.map(function(g){ return { label:_fmtGroup(g,"tree"), items:(STATE.screens||[]).filter(function(s){return s.groupId===g.id;}) }; });
    var orphans = (STATE.screens||[]).filter(function(s){ return !groups.some(function(g){return g.id===s.groupId;}); });
    if(orphans.length) buckets.push({ label:"분류 미지정", items:orphans });
    buckets.forEach(function(b){
      var items = b.items.filter(function(s){ return exclude.indexOf(s.screenId)<0; }).sort(_byScreenIdNum);
      if(!items.length) return;
      html += '<optgroup label="'+esc(b.label)+'">' + items.map(function(s){
        return '<option value="'+esc(s.screenId)+'"'+(s.screenId===selected?' selected':'')+'>'+esc(s.screenId)+' · '+esc(s.title||"(제목 없음)")+'</option>';
      }).join("") + '</optgroup>';
    });
    return html + '</select>';
  }

  // 입력폼 높이를 내용 줄 수에 맞춘다
  function _autoGrow(el){
    if(!el || el.offsetParent===null) return;
    var cs = getComputedStyle(el);
    var keep = [];
    for(var p = el.parentElement; p; p = p.parentElement){ if(p.scrollTop > 0) keep.push([p, p.scrollTop]); }
    el.style.height = "0px";
    var h = el.scrollHeight;
    if(cs.boxSizing === "border-box") h += el.offsetHeight - el.clientHeight;
    else h -= (parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0);
    el.style.height = Math.max(h, 44) + "px";
    keep.forEach(function(k){ k[0].scrollTop = k[1]; });
  }
  function _autoGrowAll(root){ if(root) root.querySelectorAll("textarea[data-pf2]").forEach(_autoGrow); }
  (function(){
    var box = document.getElementById("secEdit");
    if(!box || typeof ResizeObserver === "undefined") return;
    var lastW = box.clientWidth;
    new ResizeObserver(function(){ if(box.clientWidth !== lastW){ lastW = box.clientWidth; _autoGrowAll(box); } }).observe(box);
  })();

  function bindDetailHandlers(box, sec){
    box.querySelectorAll("[data-act='acc-toggle']").forEach(function(el){
      el.addEventListener("click", function(){
        var item = el.closest(".acc-item");
        if(item){ item.classList.toggle("is-open"); if(item.classList.contains("is-open")) _autoGrowAll(item); }
      });
    });
    box.querySelectorAll("[data-pf2]").forEach(function(el){
      el.addEventListener("input", function(){
        if(el.tagName === "TEXTAREA") _autoGrow(el);
        var p = el.dataset.pf2;
        sec[p] = el.value;
        _markDirty();
        if(p==="title"){
          var card=document.querySelector('.sec.selected .ti'); if(card) card.textContent=sec.title||"구역 이름";
          var dTitle=document.getElementById("secDetailTitle"); if(dTitle) dTitle.textContent=(sec.title||"구역")+" 상세 내용";
        }
        if(p==="linkedScreenId") renderDetail();
      });
    });
    box.querySelectorAll("[data-act='set-type']").forEach(function(el){
      el.onclick=function(){
        if(sec.type===el.dataset.v) return;
        sec.type = el.dataset.v; save();
        renderMid(); renderDetail(); toast("구역 종류: " + sec.type);
      };
    });
    box.querySelectorAll("[data-act='set-status']").forEach(function(el){
      el.onclick=function(){ if(sec.status===el.dataset.v) return; sec.status=el.dataset.v; save(); renderTree(); renderMid(); renderDetail(); };
    });
    // 공통 정의 참조 추가
    var defPickSel = box.querySelector("[data-act='defref-def']");
    if(defPickSel) defPickSel.onchange = function(){
      _defPick = { sec:sec.id, def:defPickSel.value };
      renderDetail();
      var nx = document.querySelector("[data-act='defref-add']");
      if(nx && !nx.disabled) nx.focus();
    };
    var defAdd = box.querySelector("[data-act='defref-add']");
    if(defAdd) defAdd.onchange = function(){
      var v = defAdd.value; if(!v) return;
      sec.defRefs = (sec.defRefs||[]).filter(function(x){ return x!==v; }).concat([v]);
      save(); renderMid(); renderDetail();
    };
    // 연관 화면 추가 (드롭다운에서 고르면 바로 한 줄 추가)
    var relAdd = box.querySelector("[data-act='rel-add']");
    if(relAdd) relAdd.onchange = function(){
      var v = relAdd.value; if(!v) return;
      sec.related = (sec.related||[]).filter(function(x){return x!==v;}).concat([v]);
      save(); renderDetail();
    };
    box.onclick = function(e){
      var t=e.target;
      while(t && t!==box){
        var a = t.dataset && t.dataset.act;
        if(a==="img-view"){ openLightbox(sec, t.dataset.img); return; }
        if(a==="img-del"){
          e.stopPropagation();
          var imgId = t.dataset.img;
          var delImg = (sec.images||[]).find(function(x){return x.id===imgId;});
          uiConfirm({ title:"이미지 삭제", ok:"삭제", danger:true, message:"이미지를 삭제할까요?" + (delImg && delImg.name ? "\n" + delImg.name : "") + "\n저장을 눌러야 서버에 반영돼요." }).then(function(y){
            if(!y) return;
            sec.images = (sec.images||[]).filter(function(x){return x.id!==imgId;});
            save(); renderDetail(); toast("이미지 삭제됨 · 저장을 눌러야 서버에 반영돼요");
            if(delImg) queueDelete(delImg.path);
          });
          return;
        }
        if(a==="defref-x"){     // 공통 정의 참조 삭제 (공통 정의 자체는 그대로)
          e.stopPropagation();
          sec.defRefs = (sec.defRefs||[]).filter(function(x){ return x!==t.dataset.value; });
          save(); renderMid(); renderDetail(); return;
        }
        if(a==="rel-x"){        // 연관 화면 한 줄 삭제
          e.stopPropagation();
          sec.related = (sec.related||[]).filter(function(x){return x!==t.dataset.value;});
          save(); renderDetail(); return;
        }
        if(a==="link-x"){       // 페이지연결 해제
          e.stopPropagation();
          sec.linkedScreenId = ""; save(); renderDetail(); return;
        }
        if(a==="goto-screen"){
          var target = findScreen(t.dataset.sid);
          if(!target){ toast("화면을 찾을 수 없어요", true); return; }
          selScr(target.screenId);
          toast("'"+(target.title||target.screenId)+"' 화면으로 이동");
          return;
        }
        t = t.parentNode;
      }
    };
    var fileInp = box.querySelector("[data-act='img-file']");
    if(fileInp) fileInp.onchange = function(e){ handleImgFiles(e.target.files, sec); e.target.value = ""; };
  }

  function handleImgFiles(files, sec){
    if(!files || !files.length) return;
    if(!SB.url){ toast("서버 연결이 없어 이미지 업로드가 안 돼요", true); return; }
    sec.images = sec.images || [];
    var list = Array.prototype.slice.call(files);
    var pending = list.length, okCount = 0;
    function done(){ if(--pending===0){ save(); renderDetail(); toast("이미지 "+okCount+"개 추가 · 저장을 눌러야 서버에 반영돼요"); } }
    list.forEach(function(f){
      if(f.size > 5*1024*1024){ toast("5MB 초과라 제외: "+f.name, true); done(); return; }
      var path = sec.id + "/" + uid("img") + "_" + encodeURIComponent(f.name);
      _storageUpload(path, f).then(function(){
        sec.images.push({ id:uid("img"), name:f.name, dataUrl:SB.url + "/storage/v1/object/public/" + SB_BUCKET + "/" + path, path:path });
        okCount++;
      }).catch(function(){ toast("업로드 실패: "+f.name, true); }).then(done);
    });
  }
  function openLightbox(sec, imgId){
    var im = (sec.images||[]).find(function(x){return x.id===imgId;}); if(!im) return;
    document.getElementById("imglbImg").src = im.dataUrl;
    document.getElementById("imglbCap").textContent = (im.name||"이미지")+" · 클릭하면 닫힘";
    document.getElementById("imglb").classList.add("show");
  }

  var MODAL_STATE = { open:false, secRef:null, work:[] };
  function openAddRelatedModal(sec){
    var s = findScreen(STATE.selectedScreenId);
    if(!s||!sec){ toast("구역이 없어요", true); return; }
    MODAL_STATE.open = true; MODAL_STATE.secRef = sec; MODAL_STATE.work = (sec.related||[]).slice();
    var others = (STATE.screens||[]).filter(function(x){return x.screenId!==s.screenId;});

    } else renderModalList();

  function renderModalList(){
    var s = findScreen(STATE.selectedScreenId);
    var body = document.getElementById("modalBody");
    var cntEl = document.getElementById("modalCnt");
    var html = "", totalShown = 0;
    (STATE.groups||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);}).forEach(function(g){
      var items = (STATE.screens||[]).filter(function(x){return x.groupId===g.id && x.screenId!==s.screenId;});
      if(!items.length) return;
      html += '<div class="grp-h"><span>'+esc(_fmtGroup(g, "select"))+'</span><span class="n">'+items.length+'</span></div>';
      items.slice().sort(_byScreenIdNum).forEach(function(x){
        var checked = MODAL_STATE.work.indexOf(x.screenId)!==-1;
        html += '<div class="pick '+(checked?"checked":"")+'" data-act="modal-pick" data-sid="'+esc(x.screenId)+'">'
              + '<input type="checkbox" '+(checked?"checked":"")+' style="width:16px;height:16px;flex:none">'
              + '<span class="sid">'+esc(x.screenId)+'</span><span class="nm">'+esc(x.title||"")+'</span></div>';
        totalShown++;
      });
    });
    body.innerHTML = totalShown ? html : '<div class="empty" style="padding:20px">선택할 화면이 없어요.</div>';
    cntEl.textContent = "선택 "+MODAL_STATE.work.length+"개";
    body.onclick = function(e){
      var node=e.target;
      while(node && node!==body && !(node.dataset && node.dataset.act==="modal-pick")) node=node.parentNode;
      if(!node||node===body) return;
      var sid = node.dataset.sid;
      var idx = MODAL_STATE.work.indexOf(sid);
      if(idx===-1){ MODAL_STATE.work.push(sid); node.classList.add("checked"); node.querySelector("input").checked=true; }
      else { MODAL_STATE.work.splice(idx,1); node.classList.remove("checked"); node.querySelector("input").checked=false; }
      cntEl.textContent = "선택 "+MODAL_STATE.work.length+"개";
      if(e.target.tagName!=="INPUT") e.preventDefault();
    };
  }
  function closeAddRelatedModal(commit){
    if(!MODAL_STATE.open) return;
    if(commit && MODAL_STATE.secRef){ MODAL_STATE.secRef.related = MODAL_STATE.work.slice(); save(); renderDetail(); }
    MODAL_STATE.open=false; MODAL_STATE.secRef=null; MODAL_STATE.work=[];
    document.getElementById("modalbg").classList.remove("show");
    var body = document.getElementById("modalBody"); if(body) body.onclick=null;
  }

      +'</div><div class="ft"><button type="button" data-act="close">취소</button><button type="button" class="primary" data-act="ok">추가</button></div></div>';
    document.body.appendChild(bg);
    _focusSoon(bg, document.getElementById("addGrpCode"));
    function commit(){
      var code=((document.getElementById("addGrpCode").value||"").trim()).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
      var name=(document.getElementById("addGrpName").value||"").trim();
      if(!code){ document.getElementById("addGrpCode").focus(); return; }
      if(!name){ document.getElementById("addGrpName").focus(); return; }
      if((STATE.groups||[]).some(function(g){return g.code===code;})){ toast("이미 있는 약칭이에요: "+code, true); return; }
      var gid = "grp_"+code;
      if((STATE.groups||[]).some(function(g){return g.id===gid;})) gid = uid("grp");
      var maxOrder = (STATE.groups||[]).reduce(function(m,g){ return Math.max(m, g.order||0); }, -1);
      STATE.groups.push({id:gid, code:code, name:name, order:maxOrder+1, _open:true});
      save(); renderAll();
      bg.remove();
    }
    bg.onclick=function(e){
      var n=e.target;
      while(n && n!==bg && !(n.dataset && (n.dataset.act==="close"||n.dataset.act==="ok"))) n=n.parentNode;
      if(!n||n===bg) return;
      if(n.dataset.act==="close"){ bg.remove(); return; }
      commit();
    };
    document.getElementById("addGrpCode").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); document.getElementById("addGrpName").focus(); } });
    document.getElementById("addGrpName").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); commit(); } });
  }
  function openAddScrModal(){
    if(document.getElementById("addScrBg")) return;
    if(!(STATE.groups||[]).length){ toast("먼저 그룹을 추가해 주세요", true); return; }
    var defId = suggestNextId();
    var bg = document.createElement("div");
    bg.className = "modalbg show"; bg.id = "addScrBg";
    bg.innerHTML =
        '<div class="modal" style="width:560px">'
      +   '<h3>새 화면 추가 <span class="sp"></span><span data-act="add-scr-close" style="cursor:pointer;font-size:18px;color:var(--sub)">✕</span></h3>'
      +   '<div class="body" style="padding:18px">'
      +     '<div class="rower"><div class="lbl">화면 ID <span class="req">*</span></div>'

      +     '<div class="rower"><div class="lbl">화면 이름 <span class="req">*</span></div>'
      +       '<input id="addScrTitle" placeholder="예: 결제 완료"><div class="tip">두 칸 모두 입력해야 추가돼요.</div></div>'
      +   '</div>'
      +   '<div class="ft"><button type="button" data-act="add-scr-close">취소</button><button type="button" class="primary" data-act="add-scr-ok">확인</button></div>'
      + '</div>';
