    var html = "", totalShown = 0;
    (STATE.groups||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);}).forEach(function(g){
      var items = (STATE.screens||[]).filter(function(x){return x.groupId===g.id && x.screenId!==s.screenId;});
      if(!items.length) return;
      html += '<div class="grp-h"><span>'+esc(_fmtGroup(g, "select"))+'</span><span class="n">'+items.length+'</span></div>';
      items.slice().sort(_byScreenIdNum).forEach(function(x){
        var checked = MODAL_STATE.work.indexOf(x.screenId)!==-1;
        html += '<div class="pick '+(checked?"checked":"")+'" data-act="modal-pick" data-sid="'+esc(x.screenId)+'">'
              + '<input type="checkbox" '+(checked?"checked":"")+' style="width:16px;height:16px;flex:none">'
              + '<span class="sid">'+esc(x.screenId)+'</span><span class="nm">'+esc(x.title||"")+'</span></div>';
        totalShown++;
      });
    });
    body.innerHTML = totalShown ? html : '<div class="empty" style="padding:20px">선택할 화면이 없어요.</div>';
    cntEl.textContent = "선택 "+MODAL_STATE.work.length+"개";
    body.onclick = function(e){
      var node=e.target;
      while(node && node!==body && !(node.dataset && node.dataset.act==="modal-pick")) node=node.parentNode;
      if(!node||node===body) return;
      var sid = node.dataset.sid;
      var idx = MODAL_STATE.work.indexOf(sid);
      if(idx===-1){ MODAL_STATE.work.push(sid); node.classList.add("checked"); node.querySelector("input").checked=true; }
      else { MODAL_STATE.work.splice(idx,1); node.classList.remove("checked"); node.querySelector("input").checked=false; }
      cntEl.textContent = "선택 "+MODAL_STATE.work.length+"개";
      if(e.target.tagName!=="INPUT") e.preventDefault();
    };
  }
  function closeAddRelatedModal(commit){
    if(!MODAL_STATE.open) return;
    if(commit && MODAL_STATE.secRef){ MODAL_STATE.secRef.related = MODAL_STATE.work.slice(); save(); renderDetail(); }
    MODAL_STATE.open=false; MODAL_STATE.secRef=null; MODAL_STATE.work=[];
    document.getElementById("modalbg").classList.remove("show");
    var body = document.getElementById("modalBody"); if(body) body.onclick=null;
  }

  /* ===================== 추가 / 삭제 ===================== */
  function newScreenShell(groupCode){
    var grp = (STATE.groups||[]).find(function(g){return g.code===groupCode;}) || (STATE.groups||[])[0] || {id:""};
    return { screenId:"__pending__", title:"새 화면", subtitle:"", link:"", groupId:grp.id, status:"작성중", seq:0, mockImage:null, tags:[], sections:[] };
  }
  function newSection(title, order){
    return { id:uid("sec"), title:title||"구역", type:"기능", desc:"", target:"", requirement:"", exception:"",
             feedback:"", author:"", outUrl:"", outLabel:"", linkedScreenId:"", images:[], related:[], note:"",
             order:order||0, status:"작성중" };
  }
  function newGrp(){
    if(document.getElementById("addGrpBg")) return;
    var bg=document.createElement("div"); bg.className="modalbg show"; bg.id="addGrpBg";
    bg.innerHTML='<div class="modal" style="width:520px">'
      +'<h3>새 그룹 추가 <span class="sp"></span><span data-act="close" style="cursor:pointer;font-size:18px;color:var(--sub)">✕</span></h3>'
      +'<div class="body" style="padding:18px">'
      +'<div class="rower"><div class="lbl">약칭(표기) <span class="req">*</span></div>'
      +'<input id="addGrpCode" placeholder="예: CM" maxlength="6">'
      +'<div class="tip">좌측 트리·화면 ID에 사용되는 짧은 코드. 영문/숫자 2~4자 권장.</div></div>'
      +'<div class="rower hl"><div class="lbl">그룹명 <span class="req">*</span></div><input id="addGrpName" placeholder="예: 공통"></div>'
      +'</div><div class="ft"><button type="button" data-act="close">취소</button><button type="button" class="primary" data-act="ok">추가</button></div></div>';
    document.body.appendChild(bg);
    setTimeout(function(){ var el=document.getElementById("addGrpCode"); if(el) el.focus(); }, 30);
    function commit(){
      var code=((document.getElementById("addGrpCode").value||"").trim()).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
      var name=(document.getElementById("addGrpName").value||"").trim();
      if(!code){ document.getElementById("addGrpCode").focus(); return; }
      if(!name){ document.getElementById("addGrpName").focus(); return; }
      if((STATE.groups||[]).some(function(g){return g.code===code;})){ toast("이미 있는 약칭이에요: "+code, true); return; }
      var gid = "grp_"+code;
      if((STATE.groups||[]).some(function(g){return g.id===gid;})) gid = uid("grp");
      var maxOrder = (STATE.groups||[]).reduce(function(m,g){ return Math.max(m, g.order||0); }, -1);
      STATE.groups.push({id:gid, code:code, name:name, order:maxOrder+1, _open:true});
      save(); renderAll();
      bg.remove();
    }
    bg.onclick=function(e){
      var n=e.target;
      while(n && n!==bg && !(n.dataset && (n.dataset.act==="close"||n.dataset.act==="ok"))) n=n.parentNode;
      if(!n||n===bg) return;
      if(n.dataset.act==="close"){ bg.remove(); return; }
      commit();
    };
    document.getElementById("addGrpCode").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); document.getElementById("addGrpName").focus(); } });
    document.getElementById("addGrpName").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); commit(); } });
  }
  function openAddScrModal(){
    if(document.getElementById("addScrBg")) return;
    if(!(STATE.groups||[]).length){ toast("먼저 그룹을 추가해 주세요", true); return; }
    var defId = suggestNextId();
    var bg = document.createElement("div");
    bg.className = "modalbg show"; bg.id = "addScrBg";
    bg.innerHTML =
        '<div class="modal" style="width:560px">'
      +   '<h3>새 화면 추가 <span class="sp"></span><span data-act="add-scr-close" style="cursor:pointer;font-size:18px;color:var(--sub)">✕</span></h3>'
      +   '<div class="body" style="padding:18px">'
      +     '<div class="rower"><div class="lbl">화면 ID <span class="req">*</span></div>'
      +       '<input id="addScrId" placeholder="예: 003-SL-HM-01" value="'+esc(defId)+'">'
      +       '<div class="tip">비워두면 추천 ID('+esc(defId)+')로 자동 입력돼요. 세 번째 칸(HM 등)의 그룹으로 들어갑니다.</div></div>'
      +     '<div class="rower"><div class="lbl">화면 이름 <span class="req">*</span></div>'
      +       '<input id="addScrTitle" placeholder="예: 결제 완료"><div class="tip">두 칸 모두 입력해야 추가돼요.</div></div>'
      +   '</div>'
      +   '<div class="ft"><button type="button" data-act="add-scr-close">취소</button><button type="button" class="primary" data-act="add-scr-ok">확인</button></div>'
      + '</div>';
    document.body.appendChild(bg);
    setTimeout(function(){ var el = document.getElementById("addScrTitle"); if(el) el.focus(); }, 40);
    function close(){ bg.remove(); }
    function commit(){
      var id = ((document.getElementById("addScrId").value) || "").trim() || defId;
      var title = ((document.getElementById("addScrTitle").value) || "").trim();
      if(!title){ toast("화면 이름을 입력해 주세요", true); return; }
      if(id==="__pending__"){ toast("사용할 수 없는 화면 ID 예요", true); return; }
      if(findScreen(id)){ toast("이미 사용 중인 화면 ID 입니다", true); return; }
      close();
      var s = newScreenShell(id.split("-")[2] || "HM");
      s.screenId = id; s.title = title;
      s.seq = parseInt(id.split("-")[3],10) || 0;
      STATE.screens.push(s);
      resyncAllScreenIds();
      var g = (STATE.groups||[]).find(function(x){return x.id===s.groupId;}); if(g) g._open = true;
      STATE.selectedScreenId = s.screenId; STATE.selectedSectionId = null;
      save(); renderAll();
      toast("화면 추가됨: "+s.screenId);
    }
    bg.addEventListener("click", function(e){
      var n = e.target;
      while(n && n!==bg){
        if(n.dataset && n.dataset.act==="add-scr-close"){ close(); return; }
        if(n.dataset && n.dataset.act==="add-scr-ok"){ commit(); return; }
        n = n.parentNode;
      }
      if(e.target===bg) close();
    });
    document.getElementById("addScrTitle").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); commit(); } });
  }
  function suggestNextId(){
    var screens = STATE.screens||[];
    var last = null, lastTotal = -1;
    screens.forEach(function(s){
      var m = typeof s.screenId==="string" && s.screenId.match(/^(\d+)-SL-([A-Z0-9]+)-(\d+)$/);
      if(m){ var t = parseInt(m[1],10); if(t > lastTotal){ lastTotal = t; last = {total:t, grp:m[2], seq:parseInt(m[3],10)}; } }
    });
    if(last) return String(last.total+1).padStart(3,"0")+"-SL-"+last.grp+"-"+String(last.seq+1).padStart(2,"0");
    var firstGrp = (STATE.groups||[]).find(function(g){return g.code==="HM";}) || (STATE.groups||[])[0] || {id:"",code:"HM"};
    var cnt = screens.filter(function(x){return x.groupId===firstGrp.id;}).length;
    return String(screens.length+1).padStart(3,"0")+"-SL-"+firstGrp.code+"-"+String(cnt+1).padStart(2,"0");
  }
  function delScr(sid){
    if(!confirm("'"+sid+"' 화면을 삭제할까요?\n(안의 구역도 함께 삭제되며, 저장을 눌러야 서버에 반영돼요)")) return;
    STATE.screens = STATE.screens.filter(function(x){return x.screenId!==sid;});
    if(STATE.selectedScreenId===sid){ STATE.selectedScreenId=null; STATE.selectedSectionId=null; }
    resyncAllScreenIds(); save(); renderAll();
  }
  function selScr(sid){
    if(sid !== STATE.selectedScreenId) _maybeWarnUnsaved();
    STATE.selectedScreenId = sid;
    var s = findScreen(sid);
    var first = s && s.sections && s.sections.length ? (s.sections.slice().sort(function(a,b){return (a.order||0)-(b.order||0);})[0]) : null;
    STATE.selectedSectionId = first ? first.id : null;
    renderAll();
  }
  function toggleGrp(gid){
    var g = (STATE.groups||[]).find(function(x){return x.id===gid;}); if(!g) return;
    g._open = (g._open===false);
    renderTree(); saveUi();
  }
  function renameGrp(gid){
    var g = (STATE.groups||[]).find(function(x){return x.id===gid;}); if(!g) return;
    var n = prompt("그룹명", g.name); if(!n || !n.trim()) return;
    g.name = n.trim(); save(); renderAll();
  }
  function delGrp(gid){
    var cnt = (STATE.screens||[]).filter(function(s){return s.groupId===gid;}).length;
    if(!confirm("이 그룹을 삭제할까요?"+(cnt?" 안에 화면 "+cnt+"개도 같이 삭제됩니다.":""))) return;
    STATE.groups = STATE.groups.filter(function(x){return x.id!==gid;});
    STATE.screens = STATE.screens.filter(function(x){return x.groupId!==gid;});
    if(STATE.selectedScreenId && !findScreen(STATE.selectedScreenId)){ STATE.selectedScreenId = null; STATE.selectedSectionId = null; }
    resyncAllScreenIds(); save(); renderAll();
  }
  function addSection(){
    var s = findScreen(STATE.selectedScreenId);
    if(!s){ toast("좌측에서 화면을 선택해 주세요", true); return; }
    var name = prompt("구역 이름", "구역 "+((s.sections||[]).length+1));
    if(!name || !name.trim()) return;
    var maxOrder = (s.sections||[]).reduce(function(m,x){ return Math.max(m, x.order||0); }, -1);
    var sec = newSection(name.trim(), maxOrder+1);
    s.sections.push(sec);
    STATE.selectedSectionId = sec.id;
    save(); renderAll();
  }
  function delSection(sid, secid){
    if(!confirm("이 구역을 삭제할까요?")) return;
    var s = findScreen(sid); if(!s) return;
    s.sections = (s.sections||[]).filter(function(x){return x.id!==secid;});
    if(STATE.selectedSectionId===secid){
      var first = s.sections.slice().sort(function(a,b){return (a.order||0)-(b.order||0);})[0];
      STATE.selectedSectionId = first ? first.id : null;
    }
    save(); renderAll();
  }

  /* ===================== 내보내기 / 가져오기 ===================== */
  function _download(name, blob){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }
  // 기존 편집기와 같은 형식(groups / screens)으로 내보낸다 → 양쪽 편집기 어디서든 가져오기 가능
  function exportJson(tag){
    safe(function(){
      var out = { schema:4, version:"1.0", updated:todayStr(), proj:"삼성라이온즈 앱 신규 개편",
                  groups:(STATE.groups||[]).map(function(g){ return {id:g.id, code:g.code, name:g.name, order:g.order, _open:true}; }),
                  screens:clone(STATE.screens||[]) };
      _download("samsung_lions_spec_"+(tag?tag+"_":"")+todayStr()+".json", new Blob([JSON.stringify(out,null,2)], {type:"application/json"}));
      toast("JSON 내보내기 완료");
    });
  }
  function exportCsv(){
    safe(function(){
      var groups = {};
      (STATE.groups||[]).forEach(function(g){ groups[g.id]=g; });
      var q = function(v){ if(v==null) return ""; var s=String(v).replace(/"/g,'""'); return /[",\r\n]/.test(s) ? ('"'+s+'"') : s; };
      var lines = ["screenId,title,group,tags,status,sections,sectionTitles"];
      (STATE.screens||[]).slice().sort(_byScreenIdNum).forEach(function(s){
        var g = groups[s.groupId];
        var secs = (s.sections||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
        lines.push([ q(s.screenId), q(s.title), q(g ? (g.code+" "+(g.name||"")) : ""), q(normTags(s.tags).join(" ")), q(s.status||""),
                     secs.length, q(secs.map(function(x){return x.title;}).join(" / ")) ].join(","));
      });
      _download("samsung_lions_"+todayStr()+".csv", new Blob(["﻿" + lines.join("\r\n") + "\r\n"], {type:"text/csv;charset=utf-8"}));
      toast("CSV 내보내기 완료 · "+(STATE.screens||[]).length+"개 화면");
    });
  }
  function importJson(e){
    var f = e.target.files && e.target.files[0]; if(!f) return;
    e.target.value = "";
    var r = new FileReader();
    r.onload = function(){
      var d = null; try{ d = JSON.parse(r.result); }catch(_){}
      if(!d || !Array.isArray(d.groups) || !Array.isArray(d.screens)){ toast("가져오기 실패 · 편집기 JSON 파일이 아니에요", true); return; }
      var st = normalizeState(d);
      if(!confirm("'"+f.name+"' 내용(화면 "+st.screens.length+"개)으로 지금 화면을 바꿀까요?\n\n아직 서버에는 올라가지 않아요. [저장]을 누르면 서버가 이 파일 내용과 똑같이 맞춰집니다\n(파일에 없는 화면·구역은 서버에서도 삭제됨).")) return;
      STATE.groups = st.groups; STATE.screens = st.screens;
      resyncAllScreenIds();
      applyUi(); save(); renderAll();
      toast("가져오기 완료 · 저장을 눌러야 서버에 반영돼요");
    };
    r.readAsText(f);
  }
  function reloadFromServer(){
    if(_unsynced && !confirm("저장하지 않은 변경사항이 있어요.\n\n불러오면 지금 변경사항은 사라집니다. (버리기 전에 JSON 백업 파일을 내려받습니다)\n계속할까요?")) return;
    if(_unsynced) exportJson("미저장백업");
    pullAll().catch(function(){});
  }

  /* ===================== 이벤트 연결 ===================== */
  function attachHeader(){
    document.getElementById("btnAddScr").onclick = openAddScrModal;
    document.getElementById("btnAddGrp").onclick = newGrp;
    document.getElementById("btnAddSec").onclick = addSection;
    document.getElementById("btnDelScr2").onclick = function(){ if(STATE.selectedScreenId) delScr(STATE.selectedScreenId); };
    document.getElementById("imp").onchange = importJson;
    document.getElementById("btnSave").onclick = saveToServer;
    document.getElementById("btnRequest").onclick = function(){ window.open("https://nick-kim-ptk.github.io/lions-request/ptkorea.html", "_blank", "noopener"); };
    document.getElementById("btnHistory").onclick = toggleHistoryScreen;
    document.getElementById("btnHistoryAdd").onclick = addHistoryEntry;
    document.getElementById("historySearch").oninput = renderHistoryList;
    var dMenu = document.getElementById("dataMenu");
    dMenu.onchange = function(){
      var v = dMenu.value; dMenu.value = "";
      if(v === "pull") reloadFromServer();
      else if(v === "exp") exportJson();
      else if(v === "csv") exportCsv();
      else if(v === "imp") document.getElementById("imp").click();
    };

    document.body.onclick = function(e){
      var t = e.target;
      while(t && t!==document.body){
        var a = t.dataset && t.dataset.act;
        if(a){
          switch(a){
            case "toggle-grp":  toggleGrp(t.dataset.gid); return;
            case "rename-grp":  e.stopPropagation(); renameGrp(t.dataset.gid); return;
            case "del-grp":     e.stopPropagation(); delGrp(t.dataset.gid); return;
            case "sel-scr":     selScr(t.dataset.sid); return;
            case "del-sec":     e.stopPropagation(); delSection(t.dataset.sid, t.dataset.secId); return;
            case "del-history": e.stopPropagation(); delHistoryEntry(t.dataset.hid); return;
            case "goto-history-screen": e.stopPropagation(); gotoHistoryScreen(t.dataset.sid); return;
          }
        }
        t = t.parentNode;
      }
    };
    document.getElementById("btnModalOk").onclick = function(){ closeAddRelatedModal(true); };
    document.getElementById("btnModalCancel").onclick = function(){ closeAddRelatedModal(false); };
    document.getElementById("imglb").onclick = function(){ document.getElementById("imglb").classList.remove("show"); };
    document.addEventListener("keydown", function(e){
      if((e.ctrlKey || e.metaKey) && (e.key==="s" || e.key==="S")){ e.preventDefault(); saveToServer(); }
    });
  }

  /* ===================== 시작 ===================== */
  function boot(){
    attachHeader();
    var local = readLocal();
    var hasLocal = !!(local && local.state && Array.isArray(local.state.screens));
    if(hasLocal){
      // 브라우저 보관본을 먼저 보여준다 (서버 응답을 기다리는 동안 빈 화면 방지)
      var st = normalizeState(local.state);
      STATE.groups = st.groups; STATE.screens = st.screens;
      BASE = local.base || null;
      VER  = local.ver  || { groups:{}, screens:{}, sections:{} };
      _pulled = !!(local.pulled && local.base);
      _unsynced = !!local.unsynced;
      applyUi(); _updateUnsavedBadge(); renderAll();
    } else {
      renderAll();
    }

    if(hasLocal && local.unsynced){
      var when = local.t ? new Date(local.t).toLocaleString() : "";
      _sbChip("미저장 작업 복원됨 · 저장 필요","#ffd166");
      setTimeout(function(){
        var keep = confirm("지난번에 서버에 저장하지 않은 변경사항이 있어요 ("+when+").\n\n[확인] 이어서 작업하기 — 저장을 누르면 서버에 반영돼요\n[취소] 버리고 서버 최신 데이터 불러오기 (버리기 전에 JSON 백업 파일을 내려받습니다)");
        if(keep){ toast("이전 작업을 복원했어요 · 저장을 눌러야 서버에 반영돼요"); }
        else { exportJson("미저장백업"); pullAll().catch(function(){}); }
      }, 60);
    } else {
      pullAll().catch(function(){
        if(hasLocal) _sbChip("서버 연결 실패 · 마지막 보관본 표시 중","#ff9c96");
      });
    }
  }

  window.addEventListener("beforeunload", function(e){
    try{
      clearTimeout(_persistT); clearTimeout(_dirtyT);
      if(BASE) _unsynced = buildChanges(BASE, rowsFromState(STATE), VER).count > 0;
      persistLocal();
      if(_unsynced){ e.preventDefault(); e.returnValue = ""; return ""; }
    }catch(_){}
  });
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") persistLocal(); });
  window.addEventListener("error", function(ev){ console.warn("[win]", ev.message); });
  window.addEventListener("unhandledrejection", function(ev){ console.warn("[rej]", ev.reason); });

  // 테스트용 진입점 (화면 동작에는 영향 없음)
  window.__SL = { get STATE(){return STATE;}, get BASE(){return BASE;}, get VER(){return VER;}, rowsFromState:rowsFromState, buildChanges:buildChanges };

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

</body>
</html>
