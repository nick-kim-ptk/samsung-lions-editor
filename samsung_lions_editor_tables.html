<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼성라이온즈 기능 정의 및 화면 설계서</title>
<style>
:root{
  --clr-brand:#0a3d91;
  --clr-brand-deeper:#062d6e;
  --clr-brand-deep:#081f56;
  --clr-brand-glow:#2f62cc;
  --clr-accent:#ffc20e;
  --bg-app:#0a1f4d;
  --bg-app-2:#0d2867;
  --panel:#ffffff;
  --panel-2:#f6f8fc;
  --line:#d7deeb;
  --line-2:#bcc7da;
  --ink:#15233f;
  --sub:#5b6a87;
  --sub-2:#8089a0;
  --ok:#1a8754;
  --warn:#b9750b;
  --draft:#808aa1;
  --danger:#c0392b;
  --danger-soft:#fde8ea;
  --hl:#fff4cc;
  --acc-soft:#e6efff;

  --fs-title:22px;
  --fs-fid:16px;
  --fs-h2:16px;
  --fs-h3:15px;
  --fs-base:14px;
  --fs-meta:13px;
  --fs-mini:12px;
  --fs-bdg:11.5px;

  /* v18 간격/리듬 표준 */
  --sp-0:2px; --sp-1:4px; --sp-2:6px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:20px; --sp-7:24px;
  --h-hdr:54px;
  --pill-h:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:linear-gradient(180deg,var(--bg-app) 0%,var(--bg-app-2) 100%);
  color:var(--ink);font-size:var(--fs-base);line-height:1.55;
  letter-spacing:-.1px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:linear-gradient(180deg,var(--bg-app) 0%,var(--bg-app-2) 100%);
  color:var(--ink);font-size:var(--fs-base);line-height:1.5;
}
.app{display:grid;grid-template-rows:50px 1fr;height:100vh}

.app{display:grid;grid-template-rows:var(--h-hdr) 1fr;height:100vh}

header{
  display:flex;align-items:center;gap:var(--sp-4);
  padding:0 18px;height:var(--h-hdr);
  background:linear-gradient(90deg,var(--clr-brand-deep),var(--clr-brand));
  color:#fff;border-bottom:2px solid var(--clr-brand-deeper);
}
header h1{
  font-size:17px;font-weight:800;letter-spacing:-.2px;
  display:flex;align-items:center;gap:var(--sp-3);margin:0;
}
header h1 .sub{font-size:11.5px;font-weight:600;color:#a8c1ee;margin-left:6px;letter-spacing:0}
header .credit{display:inline-flex;align-items:center;justify-content:center;align-self:center;margin-left:auto;margin-right:var(--sp-3);font-size:13px;font-weight:700;color:rgba(234,240,255,.78);letter-spacing:.4px}
header h1{align-self:center}
header .pill{display:inline-flex;align-items:center;height:var(--pill-h);background:rgba(255,255,255,.12);padding:0 10px;border-radius:14px;color:#eaf0ff;font-size:var(--fs-mini);font-weight:600;letter-spacing:.1px}
header .sp{flex:1;min-width:var(--sp-3)}
header button{display:inline-flex;align-items:center;justify-content:center;height:var(--pill-h);background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:5px;padding:0 14px;font-size:var(--fs-base);cursor:pointer;font-weight:600;letter-spacing:-.1px}
header button:hover{background:rgba(255,255,255,.24)}
header button.primary{background:var(--clr-accent);color:var(--clr-brand-deep);border-color:var(--clr-accent);font-weight:800}
header button.primary:hover{background:#ffd443}
header button.danger{background:rgba(255,255,255,.06);color:#ffd9c8;border-color:#c97a72}

.main{display:grid;grid-template-columns:minmax(220px,2fr) minmax(360px,4fr) minmax(360px,4fr);gap:var(--sp-4);padding:var(--sp-4);overflow:hidden}
.history-screen{display:none;padding:var(--sp-4);overflow:hidden;min-height:0}
.history-screen.show{display:flex}
.hist-compose{flex:none}
.hist-compose-label{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:6px}
.hist-compose-row{display:flex;gap:10px;align-items:stretch}
.hist-compose-row textarea{flex:1;min-height:64px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;resize:vertical;box-sizing:border-box}
.hist-compose-row textarea:focus{outline:none;border-color:var(--clr-brand);box-shadow:0 0 0 2px rgba(10,61,145,.16)}
.hist-compose-row button{flex:none;padding:0 26px;background:var(--clr-brand);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:800;font-size:14px}
.hist-compose-row button:hover{background:var(--clr-brand-deep)}
.hist-compose-tip{font-size:11.5px;color:var(--sub);margin-top:6px}
.hist-table{width:100%;border-collapse:collapse;font-size:13px}
.hist-table thead th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:9px 12px;font-size:12px;color:var(--sub);font-weight:800;border-bottom:1px solid var(--line);z-index:1}
.hist-table tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.hist-content{white-space:pre-wrap;word-break:break-word;line-height:1.6}
.hist-table tbody tr:last-child td{border-bottom:none}
.hist-table tbody tr:hover td{background:var(--acc-soft)}
.hist-ver{font-family:Consolas,monospace;font-weight:800;color:var(--clr-brand);white-space:nowrap}
.hist-chip{display:inline-block;border:1px solid var(--clr-brand);color:var(--clr-brand);border-radius:4px;padding:1px 6px;font-family:Consolas,monospace;font-size:12px;font-weight:800;cursor:pointer;margin-right:4px;white-space:nowrap}
.hist-chip:hover{background:var(--clr-brand);color:#fff}
.hist-date{white-space:nowrap;color:var(--sub);font-size:12.5px}
.hist-del{cursor:pointer;color:var(--sub-2)}
.hist-del:hover{color:var(--danger)}
.hist-author{color:var(--sub);font-weight:700;font-size:11.5px;margin-right:6px}
.hist-empty{text-align:center;color:var(--sub-2);font-size:13px;padding:40px 10px}
.col{background:var(--panel);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.35);box-shadow:0 6px 18px rgba(0,0,0,.18);min-width:0}
.col-h{display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);height:42px;border-bottom:1px solid var(--line);font-size:var(--fs-h2);font-weight:800;color:var(--ink);background:var(--panel-2);flex:none}
.col-h .pill{display:inline-flex;align-items:center;height:22px;background:var(--clr-brand);color:#fff;padding:0 10px;border-radius:11px;font-size:var(--fs-mini);font-weight:800;letter-spacing:.3px;flex:none}
.col-h .sp{flex:1;min-width:var(--sp-2)}
.col-h .info{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;background:#eef3fb;color:var(--sub);font-size:11.5px;font-weight:700;letter-spacing:-.1px;flex:none;white-space:nowrap}
.col-h button{display:inline-flex;align-items:center;height:26px;font-size:var(--fs-meta);background:#fff;border:1px solid var(--line);border-radius:13px;padding:0 12px;cursor:pointer;color:var(--ink);font-weight:700;flex:none}
.col-h button:hover{background:var(--bg-app-2);color:#fff;border-color:var(--clr-brand)}
.col-h button.primary{background:var(--clr-brand);color:#fff;border-color:var(--clr-brand)}
/* 구역 상세 패널 타이틀 옆 삭제 버튼 — 화면 삭제 버튼과 같은 아이콘 전용 버튼이지만, 이 패널은 배경이 밝아서 흰색 대신 danger 색으로 테두리를 맞춘다 */
/* .col-h button 의 기본 pill 스타일(패딩·둥근 테두리·회색 border 등)보다 확실히 우선 적용되도록 id로 지정 */
.col-h #btnDelSec2.icon-del-btn{flex:none;width:26px;height:26px;padding:0;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--danger);color:var(--danger);cursor:pointer}
.col-h #btnDelSec2.icon-del-btn:hover{background:var(--danger-soft)}
.col-b{flex:1;overflow:auto;padding:var(--sp-4);min-width:0}

.grp-row{font-size:14px;font-weight:800;padding:9px 12px;display:flex;align-items:center;gap:6px;border-radius:7px;cursor:pointer;background:var(--panel-2);margin-bottom:5px;color:var(--ink);border:1px solid var(--line)}
.grp-row:hover{background:var(--acc-soft)}
.grp-row .arrow{font-size:11px;color:var(--clr-brand);width:14px}
.grp-row .n{color:var(--sub);font-weight:600;flex:1;text-align:right;font-size:var(--fs-mini)}
.grp-row .act{opacity:0;display:flex;gap:5px;color:var(--sub);font-size:var(--fs-mini);font-weight:600}
.grp-row:hover .act{opacity:1}
.grp-row .act span{cursor:pointer;padding:0 3px}
.grp-row .act span:hover{color:var(--danger)}

.scr-row{font-size:14px;padding:7px 10px 7px 26px;border-radius:6px;cursor:pointer;color:var(--sub);display:flex;gap:8px;align-items:center;margin-bottom:3px;border:1px solid transparent}
.scr-row .sid{color:var(--clr-brand);font-weight:800;font-family:Consolas,monospace;font-size:13.5px}
.scr-row .nm{font-size:14px;color:var(--ink);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr-row.active{background:var(--acc-soft);border-color:var(--clr-brand)}
.scr-row.active .sid,.scr-row.active .nm{color:var(--clr-brand-deep)}
.scr-row.dragging{opacity:.4}
.scr-row.drag-over{background:var(--hl);outline:2px dashed var(--clr-brand)}
.grp-row.drag-over{background:var(--hl);outline:2px dashed var(--clr-brand)}

.empty{color:var(--sub-2);text-align:center;padding:48px 16px;font-size:var(--fs-meta);line-height:1.6}
.empty .em-path{color:var(--clr-brand);font-weight:700}

.screen-head{padding:14px 18px 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;line-height:1.5}
.screen-head .title{margin:6px 0 0;gap:var(--sp-3);line-height:1.4}
.screen-head .meta{font-size:14px;color:var(--clr-brand);margin:2px 0 6px;display:flex;gap:10px;align-items:center;font-family:Consolas,monospace;flex-wrap:wrap;line-height:1.5}
.screen-head .meta .scrId{font-weight:800;letter-spacing:.2px;color:var(--clr-brand);background:#eef3fb;padding:3px 9px;border-radius:5px;font-size:13.5px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:13px;font-weight:700;background:#eef3fb;color:var(--ink);border:1px solid var(--line);white-space:nowrap;letter-spacing:-.1px;flex:none}
.chip-id{background:#eef3fb;color:var(--clr-brand);font-family:Consolas,monospace;font-weight:800;letter-spacing:.2px;font-size:13.5px}
.idcopy{flex:none;width:24px;height:24px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--clr-brand);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.idcopy:hover{background:var(--acc-soft)}
.idcopy.ok{color:var(--ok);border-color:var(--ok)}
.rel-link{color:var(--clr-brand);text-decoration:underline;cursor:pointer}
.chip-grp{background:#eef3fb;color:#5b6a87;font-weight:600}
.chip-tp{background:var(--clr-brand);color:#fff;padding:0 10px;height:24px;border-radius:12px;font-size:13px;font-weight:800;letter-spacing:.1px;border:0}
.chip-sep{display:inline-flex;align-items:center;color:var(--sub);font-weight:700;margin:0 2px;font-size:13px}
/* .meta-row 제거됨 — 우측 첫줄 ID chip 영역 삭제 */
.screen-head .meta .gid{color:var(--clr-brand);font-weight:900;font-size:15px;background:transparent;padding:0}
.screen-head .meta .grpName{color:var(--ink);font-family:"Pretendard","Malgun Gothic",sans-serif;font-weight:700;font-size:13px}
.screen-head .title{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.screen-head .fid{font-family:Consolas,monospace;font-size:var(--fs-fid);font-weight:800;color:var(--clr-brand);background:transparent;padding:0}
.screen-head .fnm{font-size:var(--fs-title);font-weight:800;color:var(--ink)}
.screen-head input,.screen-head select{padding:6px 9px;border:1px solid var(--line);border-radius:4px;font-size:var(--fs-base);font-family:inherit;background:#fff}
.screen-head input:focus,.screen-head select:focus{outline:none;border-color:var(--clr-brand)}
.screen-head input.bordered{border:0;border-bottom:1px dashed var(--line);background:transparent;font-size:22px;font-weight:800;width:280px}
.screen-head .row{display:flex;gap:8px;margin-top:10px;font-size:var(--fs-meta);align-items:center;flex-wrap:wrap}
.screen-head .row .label{color:var(--sub);width:64px;flex:none;font-weight:700}

.badge{font-size:var(--fs-bdg);padding:3px 8px;border-radius:4px;font-weight:800;letter-spacing:.2px}
.b-wd{background:#e9edf5;color:var(--draft)}
.b-wr{background:#fff1d4;color:#8c5d00}
.b-ok{background:#dff4e8;color:var(--ok)}
.b-tp-func{background:var(--clr-brand);color:#fff}
.b-tp-ad{background:#ffe2c8;color:#a25b00}
.b-tp-out{background:#e8e6ff;color:#4338b0}
.b-tp-link{background:#d8e9ff;color:#1e4376}

.addsec{padding:0 16px;height:38px;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);background:var(--panel-2);border-bottom:1px solid var(--line);flex:none}
.addsec .addsec-tip{font-size:11.5px;color:var(--sub);font-weight:600;letter-spacing:-.1px;line-height:1.2}
.addsec .addsec-tip b{color:var(--clr-brand)}
.addsec button{display:inline-flex;align-items:center;height:26px;font-size:12.5px;background:var(--clr-brand);color:#fff;border:0;border-radius:5px;padding:0 14px;cursor:pointer;font-weight:800;letter-spacing:-.1px;flex:none}
.addsec button:hover{background:var(--clr-brand-deep)}

/* ── 가운데 컬럼 전체를 폰 목업으로 (1,3번 컬럼과 동일한 사이즈로 꽉 채움) ── */
.col.phone-col{background:#12172a;padding:0;align-items:stretch;justify-content:flex-start;border-radius:10px}
.phone-mock{position:relative;width:100%;height:100%;margin:0;background:#12172a;border-radius:10px;padding:12px 10px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);display:flex;flex-direction:column;flex:1;min-height:0}
.phone-mock .notch{width:84px;height:9px;background:#fff;border-radius:5px;margin:0 auto 10px;position:relative;flex:none;box-shadow:0 0 4px rgba(255,255,255,.35)}
.phone-mock .signal{position:absolute;top:14px;left:18px;display:flex;align-items:flex-end;gap:2px;z-index:2}
.phone-mock .signal i{display:block;width:3px;background:#fff;border-radius:1px;opacity:.55}
.phone-mock .signal i:nth-child(1){height:4px}
.phone-mock .signal i:nth-child(2){height:6px;opacity:.75}
.phone-mock .signal i:nth-child(3){height:8px;opacity:.9}
.phone-mock .signal i:nth-child(4){height:10px;opacity:1}
.phone-mock .screen{background:#f7f9fd;border-radius:22px;overflow:hidden;flex:1;display:flex;flex-direction:column;min-height:0}

/* 폰 화면 안 상단 앱바(원래 col-h) */
.phone-mock .screen .col-h{background:linear-gradient(90deg,var(--clr-brand-deep),var(--clr-brand));color:#fff;border-bottom:0;border-radius:0;height:46px;padding:0 16px}
.phone-mock .screen .col-h .pill{background:rgba(255,255,255,.22)}
.phone-mock .screen .col-h span:not(.pill):not(.sp){color:#fff;font-weight:700}
.phone-mock .screen .col-h button.primary{background:var(--clr-accent);color:var(--clr-brand-deep)}
.phone-mock .screen .col-h #btnDelScr2{background:transparent;color:#fff;border:1px solid #fff;width:26px;height:26px;padding:0;border-radius:6px;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.phone-mock .screen .col-h #btnDelScr2:hover{background:rgba(255,255,255,.16)}

/* 폰 화면 안 화면 정보(원래 screen-head) — 앱 안내/타이틀 영역처럼 */
.phone-mock .screen .screen-head{background:#fff;padding:12px 16px 14px;border-bottom:1px solid var(--line)}
.phone-mock .screen .screen-head input.bordered{font-size:18px;width:100%}

/* 폰 화면 안 구역 추가 툴바 */
.phone-mock .screen .addsec{background:#eef2fb}

.sec-list{padding:14px 12px 22px;flex:1;overflow:auto;min-width:0;min-height:0}
.midsplit{display:flex;align-items:stretch;gap:12px;padding:0 14px 14px;flex:1;min-height:0;overflow:hidden}
.sec{position:relative;background:var(--panel-2);border:1.5px dashed var(--line-2);border-radius:14px;padding:16px 14px 14px;margin-bottom:14px;cursor:grab;display:flex;align-items:center;gap:10px;user-select:none;min-height:52px;box-shadow:0 2px 6px rgba(20,30,60,.06)}
/* 가운데 구역 카드 톤 — 진행상황(작성중/검토중/확정)에 맞춰 카드 전체 배경이 조화를 이루도록 함 */
.sec.s-wd{background:linear-gradient(180deg,#fbfdff 0%,#eef3fb 100%);border-color:#c8d1e0}
.sec.s-wr{background:linear-gradient(180deg,#fffaf0 0%,#ffe9c4 100%);border-color:#d9ab5c}
.sec.s-ok{background:linear-gradient(180deg,#f7fbf6 0%,#e2f1e3 100%);border-color:#8fbf95}
.sec.selected{background:var(--hl);border-color:var(--clr-brand);border-style:solid;outline:1px solid var(--clr-brand)}
.sec.dragging{opacity:.4}
.sec.drag-over{border-top:3px solid var(--clr-brand)}
.sec .num{position:static;font-size:12.5px;color:#fff;font-weight:900;width:26px;height:26px;background:#bd3511;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 8px rgba(10,61,145,.4);border:2px solid #fff;align-self:center}
.sec .ti{font-size:var(--fs-base);font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.sec .bdgbox{display:flex;gap:4px;flex:none}
.sec .act{opacity:0;display:flex;gap:5px;color:var(--sub);font-size:var(--fs-mini);font-weight:700}
.sec:hover .act{opacity:1}
.sec .act span{cursor:pointer;padding:0 4px}
.sec .act span:hover{color:var(--danger)}

.sec-edit{padding:16px 18px;flex:1;overflow:auto;background:#fff}
/* 진행 상태 톤(작성중/검토중/확정) — 구역 영역 배경이 chip 색상과 조화를 이루도록 토닝 */
.sec-edit.t-wd{background:linear-gradient(180deg,#fbfdff 0%,#eef3fb 100%)}
.sec-edit.t-wr{background:linear-gradient(180deg,#fffaf0 0%,#ffe9c4 100%)}
.sec-edit.t-ok{background:linear-gradient(180deg,#f7fbf6 0%,#e2f1e3 100%)}
.sec-edit h3{font-size:var(--fs-h2);font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-edit .badgebox{display:flex;gap:6px}
.sec-edit .badgebox .badge{cursor:pointer;border:1px solid var(--line);user-select:none}
.sec-edit .badgebox .badge.active{border-color:currentColor;outline:1px solid currentColor;box-shadow:inset 0 0 0 1px currentColor}

.rower{margin-bottom:14px}
.rower .lbl{font-size:var(--fs-meta);font-weight:800;color:var(--ink);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.rower .lbl .req{color:var(--clr-accent);font-weight:900}
.rower input,.rower textarea,.rower select{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:var(--fs-base);font-family:inherit;background:#fff;color:var(--ink)}
.rower input:focus,.rower textarea:focus,.rower select:focus{outline:none;border-color:var(--clr-brand);box-shadow:0 0 0 2px rgba(10,61,145,.16)}
.rower textarea{min-height:80px;resize:vertical}
.rower.hl textarea{background:var(--hl);font-weight:700}
.rower.hl input{background:var(--hl);font-weight:700}
.rower.err input,.rower.err textarea{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.rower .tip{font-size:var(--fs-mini);color:var(--sub);margin-top:4px}
.rower .chipbox{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line);border-radius:5px;background:#fff;min-height:38px;align-items:center}
.rower .chip{background:var(--clr-brand);color:#fff;padding:3px 9px;border-radius:4px;font-size:var(--fs-mini);display:flex;gap:6px;align-items:center;font-family:Consolas,monospace;font-weight:800}
.rower .chip .x{cursor:pointer;font-size:14px;color:#ffd}
.rower .chip .x:hover{color:var(--clr-accent)}
.rower .chipadd{background:var(--clr-accent);color:var(--clr-brand-deep);border:0;border-radius:4px;padding:4px 11px;font-size:var(--fs-mini);cursor:pointer;font-weight:800}
.rower .chipadd:hover{background:#ffd443}

.typebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.typechip{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.typechip:hover{background:var(--acc-soft);border-color:var(--clr-brand)}
.typechip.on.func{background:var(--clr-brand);color:#fff;border-color:var(--clr-brand)}
.typechip.on.ad{background:#a25b00;color:#fff;border-color:#a25b00}
.typechip.on.out{background:#4338b0;color:#fff;border-color:#4338b0}
.typechip.on.link{background:#1e4376;color:#fff;border-color:#1e4376}
.typechip.on.prog{background:#5a6b85;color:#fff;border-color:#5a6b85}
.typechip.on.review{background:#b7791f;color:#fff;border-color:#b7791f}
.typechip.on.ok{background:#2e7d32;color:#fff;border-color:#2e7d32}

/* ── 진행 상황 / 구역 종류 나란히 배치 ── */
.rower-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.rower-row .rower{flex:1;margin-bottom:0;min-width:180px}

/* ── 구역 상세 아코디언: 작성된 항목만 기본 펼침, 미작성은 제목만 ── */
.acc-item{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;background:#fff}
.acc-item .acc-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-weight:800;font-size:var(--fs-meta);color:var(--ink);background:var(--panel-2);user-select:none}
.acc-item .acc-head:hover{background:var(--acc-soft)}
.acc-item .acc-arrow{font-size:11px;color:var(--clr-brand);width:12px;flex:none;transition:transform .15s}
.acc-item.is-open .acc-arrow{transform:rotate(90deg)}
.acc-item .acc-title{flex:1}
.acc-item .acc-dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.acc-item .acc-dot.filled{background:var(--ok)}
.acc-item .acc-panel{padding:12px 12px 14px;border-top:1px solid var(--line);display:none}
.acc-item.is-open .acc-panel{display:flex;flex-direction:column}
.acc-panel .rower{margin-bottom:0;flex:1;display:flex;flex-direction:column}
.acc-panel .rower textarea{flex:1;min-height:160px}
.acc-panel .rower input{min-height:44px}
/* 아코디언 패널 안에 rower로 감싸지 않고 직접 들어간 입력창들도 동일한 스타일이 적용되도록 보강 */
.acc-panel>textarea,.acc-panel>input,.acc-panel>select{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:var(--fs-base);font-family:inherit;background:#fff;color:var(--ink)}
.acc-panel>textarea:focus,.acc-panel>input:focus,.acc-panel>select:focus{outline:none;border-color:var(--clr-brand);box-shadow:0 0 0 2px rgba(10,61,145,.16)}
.acc-panel>textarea{flex:1;min-height:160px;resize:vertical}
.acc-panel>input{min-height:44px}
/* 구역 상세 입력폼(textarea): 기본 1줄 높이, Enter·줄바꿈이 늘어나면 그만큼 자동으로 높아진다.
   높이는 저장된 내용에서 매번 계산하므로 저장/새로고침 후에도 각 폼의 줄 수에 맞는 높이가 유지된다. */
.acc-item .acc-panel textarea[data-pf2]{flex:none;min-height:44px;resize:none;overflow:hidden;line-height:1.5}
/* 목적/개요(화면 헤더) 도 구역 상세 폼과 동일하게: 기본 1줄, 내용 줄 수만큼 자동으로 높아진다 */
.screen-head textarea[data-pf="subtitle"]{min-height:44px;resize:none;overflow:hidden;line-height:1.5}

.adbox{background:var(--danger-soft);border:1px solid var(--danger);border-radius:6px;padding:10px 12px;color:var(--danger);font-size:13px;font-weight:700;margin-bottom:10px}

.linkpreview{background:var(--acc-soft);border:1px solid var(--clr-brand);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.linkpreview:hover{background:var(--hl)}
.linkpreview.empty{background:var(--panel-2);border-style:dashed;color:var(--sub);cursor:default;font-size:13px}
.linkpreview .lkbtn{font-size:16px;font-weight:800;color:var(--clr-brand)}
.linkpreview .lkid{font-family:Consolas,monospace;font-size:12.5px;color:var(--sub);font-weight:700}

.imgbox{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:1px solid var(--line);border-radius:5px;background:#fff;min-height:56px;align-items:center;margin-top:6px}
.thumb{position:relative;width:72px;height:72px;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in;flex:none;background:var(--panel-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tx{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,.62);color:#fff;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.thumb .tx:hover{background:var(--danger)}
/* 관련 자료 이미지: 영역보다 크면 영역 너비에 맞춰 축소(비율 유지), 작으면 원본 크기 그대로 표시 */
.relimgs{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:8px;border:1px solid var(--line);border-radius:5px;background:#fff}
.relimg{position:relative;display:block;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in;background:var(--panel-2)}
.relimg img{display:block;max-width:100%;height:auto}
.relimg .tx{position:absolute;top:6px;right:6px;width:22px;height:22px;background:rgba(0,0,0,.62);color:#fff;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1}
.relimg .tx:hover{background:var(--danger)}
.imgadd{background:var(--acc-soft);color:var(--clr-brand);border:1px dashed var(--clr-brand);border-radius:6px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer}
.imgadd:hover{background:var(--clr-brand);color:#fff}

.scrshot{margin:0;flex:0 0 40%;min-width:130px;min-height:0;display:flex;flex-direction:column}
.scrshot .add{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:160px;border:2px dashed var(--line-2);border-radius:10px;background:var(--panel-2);color:var(--sub-2);cursor:pointer;font-size:13px;font-weight:700;text-align:center}
.scrshot .add:hover{background:var(--acc-soft);border-color:var(--clr-brand);color:var(--clr-brand)}
.scrshot .add .plus{font-size:26px;font-weight:400;line-height:1}
.scrshot .preview{flex:1;min-height:0;position:relative;display:flex;justify-content:center;align-items:flex-start;padding:10px;background:var(--panel-2);border-radius:10px;overflow:auto}
.scrshot .preview img{width:412px;max-width:100%;display:block;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:zoom-in}
.scrshot .preview .rm{position:absolute;top:16px;right:16px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;line-height:1;flex:none}
.scrshot .preview .rm:hover{background:var(--danger)}
#secList.sec-list{flex:1}

.imglb{position:fixed;inset:0;background:rgba(5,15,40,.86);display:none;align-items:center;justify-content:center;z-index:400;cursor:zoom-out;flex-direction:column}
.imglb.show{display:flex}
.imglb img{max-width:88vw;max-height:82vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
.imglb .cap{color:#cbd6ee;font-size:13px;margin-top:10px;font-family:"Pretendard","Malgun Gothic",sans-serif}

.modalbg{position:fixed;inset:0;background:rgba(8,31,86,.78);display:none;align-items:center;justify-content:center;z-index:200}
.modalbg.show{display:flex}
.modal{background:#fff;border-radius:10px;width:600px;max-width:92%;max-height:84vh;display:flex;flex-direction:column;font-size:var(--fs-base);color:var(--ink);border:2px solid var(--clr-brand);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.modal h3{padding:14px 18px;border-bottom:2px solid var(--clr-brand);font-size:var(--fs-h2);display:flex;align-items:center;gap:8px;background:var(--panel-2)}
.modal h3 .sp{flex:1}
.modal .body{padding:8px 0;flex:1;overflow:auto}
.modal .grp-h{padding:9px 16px;background:var(--bg-app-2);color:#fff;font-weight:800;font-size:var(--fs-meta);display:flex;justify-content:space-between;align-items:center}
.modal .grp-h .n{color:#c9d4ec;font-weight:600}
.modal .pick{padding:8px 16px;cursor:pointer;font-size:var(--fs-base);display:flex;gap:10px;align-items:center;font-family:Consolas,monospace}
.modal .pick:hover{background:var(--acc-soft)}
.modal .pick.checked{background:var(--hl)}
.modal .pick .sid{color:var(--clr-brand);font-weight:800;width:170px;font-size:13.5px}
.modal .pick .nm{font-family:"Pretendard","Malgun Gothic",sans-serif;color:var(--ink);font-size:var(--fs-base);font-weight:700}
.modal .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:6px;background:var(--panel-2)}
.modal .ft button{padding:8px 18px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:var(--fs-base);font-weight:700}
.modal .ft button.primary{background:var(--clr-brand);color:#fff;border-color:var(--clr-brand)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--clr-brand-deep);color:#fff;padding:9px 18px;border-radius:5px;font-size:var(--fs-base);opacity:0;transition:opacity .25s;z-index:300;font-weight:700;max-width:70%}
.toast.show{opacity:1} .toast.err{background:var(--danger)}

.placeholder{background:var(--acc-soft);border-left:4px solid var(--clr-brand);padding:12px 14px;border-radius:0 5px 5px 0;color:var(--ink);font-size:var(--fs-base);margin:6px 2px 14px;line-height:1.6;font-weight:600}
/* ---- v16 상단 정리 ---- */
.data-menu{position:relative}
.data-menu select{padding:6px 10px;border:1px solid #c8d1e0;background:#fff;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:#333}
.data-menu select:hover{background:#f6f8fc}
.data-menu .lbl{font-size:12px;color:#888;margin-right:4px}
.syncBlock{display:inline-flex;align-items:center;gap:var(--sp-3);padding:0 12px;height:var(--pill-h);border:1px solid rgba(255,255,255,.28);border-radius:14px;background:rgba(255,255,255,.06);flex:none}
.syncBlock .syncDot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(26,135,84,.7);flex:none}
.syncBlock .syncDot.err{background:var(--danger);box-shadow:0 0 6px rgba(192,57,43,.7)}
.syncBlock .syncDot.busy{background:var(--warn);box-shadow:0 0 6px rgba(185,117,11,.7);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.syncBlock #syncChip{display:inline-flex;align-items:center;width:170px;font-size:11.5px;font-weight:600;letter-spacing:-.1px;color:#cfe0ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.syncBlock .sep{width:1px;height:14px;background:rgba(255,255,255,.2);flex:none}
.syncBlock .data-menu{display:inline-flex;align-items:center;gap:6px;flex:none}
.syncBlock .data-menu .lbl{color:#a8c1ee;margin-right:2px;font-size:11px;font-weight:600;letter-spacing:0}
.syncBlock .data-menu select{height:24px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28);font-size:11.5px;padding:0 22px 0 8px;border-radius:4px;font-weight:600;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.syncBlock .data-menu select:hover{border-color:rgba(255,255,255,.45)}
.syncBlock .data-menu select option{background:#fff;color:#222}


/* 페이지 성향 뱃지 (STATIC / ADMIN / API / USER) */
.screen-head .meta .ptags{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;font-family:"Pretendard","Malgun Gothic",sans-serif}
.ptag{--c:#64748b;display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;border:1px solid var(--c);color:var(--c);background:#fff;font-size:11px;font-weight:800;letter-spacing:.4px;cursor:pointer;opacity:.38;user-select:none;font-family:inherit;transition:opacity .12s,background .12s}
.ptag:hover{opacity:.75}
.ptag.on{opacity:1;background:var(--c);color:#fff}
.tagdots{display:inline-flex;gap:3px;flex:none;align-items:center}
.tagdots i{display:block;width:8px;height:8px;border-radius:50%;background:var(--c)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>삼성라이온즈 기능 정의 및 화면 설계서</h1>
    <span class="sp"></span>
    <button type="button" id="btnRequest">요청사항</button>
    <button type="button" id="btnHistory">이력</button>
    <span class="syncBlock" role="group" aria-label="서버 상태">
      <span class="syncDot" id="syncDot"></span>
      <span id="syncChip">연결 준비 중…</span>
      <span class="sep"></span>
      <span class="data-menu"><span class="lbl">데이터</span>
        <select id="dataMenu" aria-label="데이터 관리 메뉴">
          <option value="" selected>관리</option>
          <option value="pull">서버 최신 불러오기</option>
          <option value="exp">JSON 내보내기</option>
          <option value="csv">CSV 내보내기</option>
          <option value="imp">JSON 가져오기</option>
        </select>
      </span>
    </span>
    <input type="file" id="imp" accept=".json" style="display:none">
    <span id="unsavedBadge" style="display:none;align-items:center;height:26px;padding:0 10px;border-radius:13px;background:#ffe6b3;color:#7a4b00;font-size:12px;font-weight:800;margin-right:8px;white-space:nowrap">⚠ 저장 필요</span>
    <button type="button" id="btnSave" class="primary">저장</button>
  </header>

  <div class="main" id="mainView">
    <div class="col">
      <div class="col-h"><span class="info" id="treeInfo">전체 0</span>
        <span class="sp"></span>
        <button type="button" id="btnAddScr" class="primary">+ 화면</button>
        <button type="button" id="btnAddGrp">+ 그룹</button>
      </div>
      <div class="col-b" id="tree"></div>
    </div>

    <div class="col phone-col">
      <div class="phone-mock">
        <div class="signal"><i></i><i></i><i></i><i></i></div>
        <div class="notch"></div>
        <div class="screen">
          <div class="col-h">
            <span class="pill" id="midTitlePill">-</span>
            <span id="midTitle" style="margin-left:6px">화면 선택 필요</span>
            <span class="sp"></span>
            <button type="button" id="btnDelScr2" class="primary" style="display:none" title="화면 삭제" aria-label="화면 삭제"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" clip-rule="evenodd" fill-rule="evenodd" xmlns="http://www.w3.org/2000/svg"><path d="m4.015 5.494h-.253c-.413 0-.747-.335-.747-.747s.334-.747.747-.747h5.253v-1c0-.535.474-1 1-1h4c.526 0 1 .465 1 1v1h5.254c.412 0 .746.335.746.747s-.334.747-.746.747h-.254v15.435c0 .591-.448 1.071-1 1.071-2.873 0-11.127 0-14 0-.552 0-1-.48-1-1.071zm14.5 0h-13v15.006h13zm-4.25 2.506c-.414 0-.75.336-.75.75v8.5c0 .414.336.75.75.75s.75-.336.75-.75v-8.5c0-.414-.336-.75-.75-.75zm-4.5 0c-.414 0-.75.336-.75.75v8.5c0 .414.336.75.75.75s.75-.336.75-.75v-8.5c0-.414-.336-.75-.75-.75zm3.75-4v-.5h-3v.5z"/></svg></button>
          </div>
          <div class="screen-head" id="screenHead" style="display:none"></div>
          <div class="addsec" id="addsec" style="display:none">
            <span class="addsec-tip">페이지 영역 내 구역 정보를 확인합니다.</span>
            <button type="button" id="btnAddSec">+ 구역 추가</button>
          </div>
          <div class="sec-list" id="secList"></div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="col-h"><span class="pill">구역 상세</span><span id="secDetailTitle">구역 설명 상세</span><span class="sp"></span><button type="button" id="btnDelSec2" class="icon-del-btn" data-act="del-sec" title="구역 삭제" aria-label="구역 삭제" style="display:none"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" clip-rule="evenodd" fill-rule="evenodd" xmlns="http://www.w3.org/2000/svg"><path d="m4.015 5.494h-.253c-.413 0-.747-.335-.747-.747s.334-.747.747-.747h5.253v-1c0-.535.474-1 1-1h4c.526 0 1 .465 1 1v1h5.254c.412 0 .746.335.746.747s-.334.747-.746.747h-.254v15.435c0 .591-.448 1.071-1 1.071-2.873 0-11.127 0-14 0-.552 0-1-.48-1-1.071zm14.5 0h-13v15.006h13zm-4.25 2.506c-.414 0-.75.336-.75.75v8.5c0 .414.336.75.75.75s.75-.336.75-.75v-8.5c0-.414-.336-.75-.75-.75zm-4.5 0c-.414 0-.75.336-.75.75v8.5c0 .414.336.75.75.75s.75-.336.75-.75v-8.5c0-.414-.336-.75-.75-.75zm3.75-4v-.5h-3v.5z"/></svg></button></div>
      <div class="sec-edit t-wd" id="secEdit"></div>
    </div>
  </div>

  <div class="history-screen" id="historyScreen">
    <div class="col" style="flex:1">
      <div class="col-h">
        <span class="pill">이력 관리</span>
        <span class="pill" id="historyCountPill" style="background:#eef3fb;color:var(--sub)">0건</span>
        <span class="sp"></span>
        <input id="historySearch" type="text" placeholder="내용 · 화면ID · 작성자 검색" style="height:26px;padding:0 10px;border:1px solid var(--line);border-radius:13px;font-size:12.5px;font-family:inherit;width:220px">
      </div>
      <div class="col-b" style="display:flex;flex-direction:column;gap:14px;overflow:hidden">
        <div class="hist-compose">
          <div class="hist-compose-label">수정내역</div>
          <div class="hist-compose-row">
            <textarea id="historyInput" maxlength="5000" placeholder="예) #001-SL-CM-01 수정, #002-SL-CM-02 수정"></textarea>
            <button type="button" id="btnHistoryAdd">등록</button>
          </div>
          <div class="hist-compose-tip">#화면ID 를 적으면 표에서 클릭 가능한 태그가 되어 해당 화면으로 바로 이동합니다. (최대 5,000자)</div>
        </div>
        <div id="historyTableWrap" style="flex:1;overflow:auto;min-height:0;border:1px solid var(--line);border-radius:8px">
          <table class="hist-table">
            <thead><tr><th style="width:70px">버전</th><th>이력내용</th><th style="width:150px">등록날짜</th><th style="width:36px"></th></tr></thead>
            <tbody id="historyList"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modalbg" id="modalbg">
  <div class="modal">
    <h3 id="modalTitle">연관 화면 선택 <span class="sp"></span><span id="modalCnt"></span></h3>
    <div class="body" id="modalBody"></div>
    <div class="ft">
      <button type="button" id="btnModalCancel">취소</button>
      <button type="button" id="btnModalOk" class="primary">선택 완료</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
  /* =====================================================================
     삼성라이온즈 기능 정의 및 화면 설계서
     · 데이터는 Supabase 의 sl_groups / sl_screens / sl_sections / sl_history 테이블에 행 단위로 저장
     · [저장] 을 누르면 "바뀐 행만" 골라서 sl_save 함수 한 번으로 보낸다 (한 트랜잭션 — 전부 성공 or 전부 취소)
     · 다른 사람이 먼저 고친 행을 덮어쓰려 하면 서버가 거절 → 충돌 목록을 보여주고 아무것도 저장하지 않음
     · 저장 전 작업은 브라우저에 자동 보관 → 새로고침/탭 닫힘 후에도 복원 가능
     ===================================================================== */

  // ── 안전망 / 유틸
  function safe(fn, fb){ try{return fn();}catch(e){console.error("[safe]",e&&(e.stack||e.message||e));return typeof fb==="function"?fb():fb;} }
  function esc(s){ return s==null?"":String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function str(v){ return v==null ? "" : String(v); }
  function toInt(v, fb){ var n = Number(v); return isFinite(n) ? Math.round(n) : (fb||0); }
  // 화면의 "URL 링크"는 http(s):// 주소만 허용 (javascript:/data: 등은 저장하지 않음)
  function _sanitizeLinkUrl(u){
    u = (u==null?"":String(u)).trim();
    if(!u) return "";
    if(/^(javascript|data|vbscript|file|blob):/i.test(u)) return "";
    if(!/^https?:\/\//i.test(u)) u = "https://" + u.replace(/^\/\//,"");
    if(!/^https?:\/\//i.test(u)) return "";
    return u;
  }
  function todayStr(){
    var d=new Date();
    return d.getFullYear().toString().slice(2)+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");
  }
  function uid(p){ p=p||"id"; return p+"_"+Math.random().toString(36).slice(2,8)+"_"+Date.now().toString(36).slice(-3); }
  // 키 순서와 상관없이 같은 내용이면 같은 문자열 — 변경 여부 비교용
  function stable(v){
    if(v===null || v===undefined || typeof v!=="object") return JSON.stringify(v===undefined?null:v);
    if(Array.isArray(v)) return "["+v.map(stable).join(",")+"]";
    return "{"+Object.keys(v).filter(function(k){return v[k]!==undefined;}).sort().map(function(k){return JSON.stringify(k)+":"+stable(v[k]);}).join(",")+"}";
  }
  function clone(o){ return o==null ? o : JSON.parse(JSON.stringify(o)); }

  // ── 상수
  var STATUSES      = ["작성중","검토중","확정"];
  var SECTION_TYPES = ["기능","광고","아웃링크","페이지연결"];
  var GROUPS_DEF = [
    {code:"HM", name:"홈"}, {code:"GM", name:"게임"}, {code:"TK", name:"예매"}, {code:"LG", name:"라운지"},
    {code:"MY", name:"마이페이지"}, {code:"AL", name:"전체 메뉴"}, {code:"CM", name:"공통"}
  ];
  // 페이지 성향 뱃지 — 순서·색상 고정
  var PAGE_TAGS = [
    {key:"STATIC", color:"#64748b"},
    {key:"ADMIN",  color:"#7c3aed"},
    {key:"API",    color:"#0891b2"},
    {key:"USER",   color:"#e8590c"}
  ];
  function normTags(v){
    var arr = Array.isArray(v) ? v : [];
    return PAGE_TAGS.map(function(t){return t.key;}).filter(function(k){ return arr.indexOf(k)>=0; });
  }
  function tagColor(k){ var t = PAGE_TAGS.find(function(x){return x.key===k;}); return t ? t.color : "#999"; }
  function normStatus(v){ return STATUSES.indexOf(v)>=0 ? v : "작성중"; }
  function normType(v){ return SECTION_TYPES.indexOf(v)>=0 ? v : "기능"; }

  // ── 서버 설정 (기존 편집기와 같은 Supabase 프로젝트, 새 테이블만 사용)
  var SB = { url:"https://gyfldkokgivdqtlytbze.supabase.co", key:"sb_publishable_IjEHGpxgWk3bALJs9lBKug_hqn4GrGH", user:"세현" };
  var SB_BUCKET = "samsunglion";
  var T_GROUPS = "sl_groups", T_SCREENS = "sl_screens", T_SECTIONS = "sl_sections", T_HISTORY = "sl_history";
  function _sbH(){ return { "apikey": SB.key, "Authorization": "Bearer "+SB.key, "Content-Type":"application/json", "Prefer":"return=representation" }; }

  // ── 브라우저 보관 키 (기존 편집기와 겹치지 않는 새 이름 — 같은 주소에서 열어도 서로 안 섞임)
  var LOCAL_KEY = "sl_tables_editor_v1";      // 작업 내용 + 서버 기준본(버전 포함)
  var UI_KEY    = "sl_tables_editor_ui_v1";   // 선택한 화면·접힌 그룹 등 화면 상태

  // ── 상태
  var STATE = { groups:[], screens:[], selectedScreenId:null, selectedSectionId:null, changelog:[] };
  var BASE = null;                              // 마지막으로 서버와 맞춘 시점의 행 스냅샷 (변경 비교 기준)
  var VER  = { groups:{}, screens:{}, sections:{} };   // 행별 서버 version (충돌 감지용)
  var _pulled  = false;                         // 서버 기준본(BASE)을 갖고 있는지
  var _saving  = false;
  var _unsynced = false;                        // 서버에 아직 저장 안 된 변경이 있는지
  var _navWarned = false;

  /* ===================== 상태 ↔ 테이블 행 변환 ===================== */

  // 편집기 상태 → 테이블 행 (저장·비교에 쓰는 유일한 변환 함수)
  function rowsFromState(st){
    var out = { groups:{}, screens:{}, sections:{} };
    var gids = {};
    (st.groups||[]).forEach(function(g, i){
      if(!g || !g.id) return;
      gids[g.id] = 1;
      out.groups[g.id] = { id:g.id, code:str(g.code), name:str(g.name), sort_order:toInt(g.order, i) };
    });
    (st.screens||[]).forEach(function(s){
      if(!s || !s.screenId || s.screenId==="__pending__") return;
      var mi = (s.mockImage && typeof s.mockImage==="object" && !Array.isArray(s.mockImage)) ? s.mockImage : null;
      out.screens[s.screenId] = {
        screen_id:s.screenId, group_id: gids[s.groupId] ? s.groupId : null,
        title:str(s.title), subtitle:str(s.subtitle), link:_sanitizeLinkUrl(s.link),
        status:normStatus(s.status), seq:toInt(s.seq, 0), mock_image:mi, tags:normTags(s.tags)
      };
      (s.sections||[]).forEach(function(c, i){
        if(!c || !c.id) return;
        out.sections[c.id] = {
          id:c.id, screen_id:s.screenId, title:str(c.title), sec_type:normType(c.type), status:normStatus(c.status),
          author:str(c.author), description:str(c.desc), target:str(c.target), requirement:str(c.requirement),
          exception_note:str(c.exception), feedback:str(c.feedback), note:str(c.note),
          out_url:str(c.outUrl), out_label:str(c.outLabel), linked_screen_id:str(c.linkedScreenId),
          related: Array.isArray(c.related) ? c.related.filter(function(x){return typeof x==="string";}) : [],
          images:  Array.isArray(c.images) ? c.images : [],
          sort_order:toInt(c.order, i)
        };
      });
    });
    return out;
  }

  // 서버에서 받은 행 → 편집기 상태
  function stateFromRows(gRows, sRows, cRows){
    var groups = gRows.slice().sort(function(a,b){ return (a.sort_order-b.sort_order) || (a.id<b.id?-1:1); })
      .map(function(r){ return { id:r.id, code:str(r.code), name:str(r.name), order:toInt(r.sort_order,0) }; });
    var byId = {};
    var screens = sRows.map(function(r){
      var s = { screenId:r.screen_id, groupId:r.group_id||"", title:str(r.title), subtitle:str(r.subtitle),
                link:str(r.link), status:normStatus(r.status), seq:toInt(r.seq,0),
                mockImage:(r.mock_image && typeof r.mock_image==="object") ? r.mock_image : null, tags:normTags(r.tags), sections:[] };
      byId[s.screenId] = s; return s;
    });
    cRows.slice().sort(function(a,b){ return (a.sort_order-b.sort_order) || (a.id<b.id?-1:1); }).forEach(function(r){
      var s = byId[r.screen_id]; if(!s) return;
      s.sections.push({
        id:r.id, title:str(r.title), type:normType(r.sec_type), status:normStatus(r.status), author:str(r.author),
        desc:str(r.description), target:str(r.target), requirement:str(r.requirement), exception:str(r.exception_note),
        feedback:str(r.feedback), note:str(r.note), outUrl:str(r.out_url), outLabel:str(r.out_label),
        linkedScreenId:str(r.linked_screen_id),
        related:Array.isArray(r.related)?r.related:[], images:Array.isArray(r.images)?r.images:[],
        order:toInt(r.sort_order,0)
      });
    });
    return { groups:groups, screens:screens };
  }

  // 옛 JSON(기존 편집기 내보내기 파일) 도 안전하게 읽어들인다
  function normalizeState(d){
    var groups = [], gSeen = {};
    (Array.isArray(d.groups)?d.groups:[]).forEach(function(g, i){
      if(!g || !g.id || gSeen[g.id]) return; gSeen[g.id]=1;
      groups.push({ id:String(g.id), code:str(g.code), name:str(g.name), order:toInt(g.order, i) });
    });
    var screens = [], sSeen = {}, cSeen = {};
    (Array.isArray(d.screens)?d.screens:[]).forEach(function(s){
      if(!s || typeof s.screenId!=="string") return;
      var sid = s.screenId;
      if(/-01-01$/.test(sid)) sid = sid.replace(/-01$/,"");
      if(!sid.trim() || sid==="__pending__" || sSeen[sid]) return; sSeen[sid]=1;
      var secs = [];
      (Array.isArray(s.sections)?s.sections:[]).forEach(function(c, i){
        if(!c || !c.id || cSeen[c.id]) return; cSeen[c.id]=1;
        secs.push({
          id:String(c.id), title:str(c.title||"구역"), type:normType(c.type), status:normStatus(c.status),
          author:str(c.author), desc:str(c.desc), target:str(c.target), requirement:str(c.requirement),
          exception:str(c.exception), feedback:str(c.feedback), note:str(c.note),
          outUrl:str(c.outUrl), outLabel:str(c.outLabel), linkedScreenId:str(c.linkedScreenId),
          related:Array.isArray(c.related)?c.related.filter(function(x){return typeof x==="string";}):[],
          images:Array.isArray(c.images)?c.images:[], order:toInt(c.order, i)
        });
      });
      screens.push({
        screenId:sid, groupId:str(s.groupId), title:str(s.title), subtitle:str(s.subtitle),
        link:_sanitizeLinkUrl(s.link), status:normStatus(s.status), seq:toInt(s.seq,0),
        mockImage:(s.mockImage && typeof s.mockImage==="object" && !Array.isArray(s.mockImage)) ? s.mockImage : null,
        tags:normTags(s.tags), sections:secs
      });
    });
    return { groups:groups, screens:screens };
  }

  // 기준본(BASE)과 지금 상태를 비교해서 서버로 보낼 변경 목록을 만든다
  function buildChanges(base, cur, ver){
    var ch = { groups_upsert:[], screens_upsert:[], sections_upsert:[], sections_delete:[], screens_delete:[], groups_delete:[] };
    var n = 0;
    [["groups","groups_upsert","groups_delete"],["screens","screens_upsert","screens_delete"],["sections","sections_upsert","sections_delete"]]
    .forEach(function(t){
      var b = base[t[0]]||{}, u = cur[t[0]]||{}, v = ver[t[0]]||{};
      Object.keys(u).forEach(function(id){
        if(!b[id]){ ch[t[1]].push(Object.assign({}, u[id], {base_version:null})); n++; }
        else if(stable(b[id]) !== stable(u[id])){ ch[t[1]].push(Object.assign({}, u[id], {base_version:(v[id]!=null?v[id]:null)})); n++; }
      });
      Object.keys(b).forEach(function(id){
        if(!u[id]){ ch[t[2]].push({ id:id, base_version:(v[id]!=null?v[id]:null), screen_id:b[id].screen_id||null }); n++; }
      });
    });
    return { changes:ch, count:n };
  }

  // 화면 순서는 화면 ID 앞 번호로 정해지므로, 보조값(seq)을 일괄로 다시 매기지 않는다.
  // (예전처럼 매번 다시 매기면 화면 하나만 추가해도 수십 개 행이 "수정됨"으로 저장되어
  //  다른 사람과의 충돌 가능성이 커진다)
  function resyncAllScreenIds(){ /* 의도적으로 아무것도 하지 않음 */ }

  /* ===================== 브라우저 보관 ===================== */
  function persistLocal(){
    try{
      localStorage.setItem(LOCAL_KEY, JSON.stringify({
        state:{ groups:STATE.groups, screens:STATE.screens },
        base:BASE, ver:VER, pulled:_pulled, unsynced:_unsynced, t:Date.now()
      }));
    }catch(e){ console.warn("[local save]", e); }
  }
  var _persistT = null;
  function persistLocalSoon(){ clearTimeout(_persistT); _persistT = setTimeout(persistLocal, 400); }
  function readLocal(){ try{ var r = localStorage.getItem(LOCAL_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }

  function saveUi(){
    try{
      localStorage.setItem(UI_KEY, JSON.stringify({
        sel:STATE.selectedScreenId, sec:STATE.selectedSectionId,
        closed:(STATE.groups||[]).filter(function(g){return g._open===false;}).map(function(g){return g.id;})
      }));
    }catch(_){}
  }
  function applyUi(){
    var u = null; try{ u = JSON.parse(localStorage.getItem(UI_KEY)||"null"); }catch(_){}
    var closed = (u && Array.isArray(u.closed)) ? u.closed : [];
    (STATE.groups||[]).forEach(function(g){ g._open = closed.indexOf(g.id)<0; });
    var want = (u && u.sel) || STATE.selectedScreenId;
    var s = want ? findScreen(want) : null;
    if(!s){ STATE.selectedScreenId = null; STATE.selectedSectionId = null; return; }
    STATE.selectedScreenId = s.screenId;
    var secWant = (u && u.sec) || STATE.selectedSectionId;
    var hit = (s.sections||[]).some(function(x){return x.id===secWant;});
    if(hit) STATE.selectedSectionId = secWant;
    else {
      var first = (s.sections||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);})[0];
      STATE.selectedSectionId = first ? first.id : null;
    }
  }

  // "변경 있음" 표시: 기준본과 실제로 다른지 계산해서 뱃지를 켜고 끈다 (고쳤다가 되돌리면 뱃지도 꺼짐)
  var _dirtyT = null;
  function _setUnsynced(){
    if(!_unsynced){ _unsynced = true; _navWarned = false; }
    _updateUnsavedBadge();
    clearTimeout(_dirtyT);
    _dirtyT = setTimeout(function(){
      if(BASE){
        var c = buildChanges(BASE, rowsFromState(STATE), VER).count;
        _unsynced = c > 0;
        _updateUnsavedBadge();
      }
      persistLocal();
    }, 350);
  }
  function _updateUnsavedBadge(){
    var b = document.getElementById("unsavedBadge"); if(!b) return;
    b.style.display = _unsynced ? "inline-flex" : "none";
  }
  // 편집 후 호출 — 서버로 보내지 않고 브라우저에만 보관 (서버 반영은 [저장] 버튼)
  function save(){ _setUnsynced(); }
  function _markDirty(){ _setUnsynced(); }
  function _maybeWarnUnsaved(){
    if(_unsynced && !_navWarned){ _navWarned = true; toast("저장하지 않으면 수정한 데이터가 사라질 수 있습니다", true); }
  }
  function toast(msg, err){
    var t=document.getElementById("toast"); if(!t) return;
    t.textContent=msg; t.className="toast show"+(err?" err":"");
    clearTimeout(toast._t); toast._t=setTimeout(function(){t.className="toast";}, err?2600:1600);
  }
  function _sbChip(t,c){
    var el=document.getElementById("syncChip"); var dot=document.getElementById("syncDot"); if(!el) return;
    var color = c||"#cfe0ff";
    el.textContent=t; el.title=t; el.style.color=color;
    if(dot){
      dot.classList.remove("err","busy");
      dot.style.background = color; dot.style.boxShadow = "0 0 6px " + color;
      if(/실패|에러|오류|충돌/i.test(t)) dot.classList.add("err");
      else if(/중…|중\.\.\./.test(t)) dot.classList.add("busy");
    }
  }

  /* ===================== 서버 통신 ===================== */
  function _readJson(r){
    return r.text().then(function(t){
      var j = null; if(t){ try{ j = JSON.parse(t); }catch(_){ j = null; } }
      if(!r.ok){
        var err = new Error((j && (j.message||j.error)) || ("HTTP "+r.status));
        err.status = r.status; err.body = j; throw err;
      }
      return j;
    });
  }
  // 한 번에 1000행씩 끝까지 읽는다 (행이 많아져도 잘리지 않게)
  function sbGetAll(table, order){
    var all = [], PAGE = 1000;
    function next(off){
      var url = SB.url+"/rest/v1/"+table+"?select=*&order="+order+"&limit="+PAGE+"&offset="+off;
      return fetch(url, { method:"GET", headers:_sbH() }).then(_readJson).then(function(rows){
        if(!Array.isArray(rows)) throw new Error(table+" 응답 형식 오류");
        all = all.concat(rows);
        return rows.length === PAGE ? next(off+PAGE) : all;
      });
    }
    return next(0);
  }
  function fetchServer(){
    return Promise.all([
      sbGetAll(T_GROUPS,   "sort_order.asc,id.asc"),
      sbGetAll(T_SCREENS,  "screen_id.asc"),
      sbGetAll(T_SECTIONS, "screen_id.asc,sort_order.asc,id.asc")
    ]).then(function(res){
      var ver = { groups:{}, screens:{}, sections:{} };
      res[0].forEach(function(r){ ver.groups[r.id] = r.version; });
      res[1].forEach(function(r){ ver.screens[r.screen_id] = r.version; });
      res[2].forEach(function(r){ ver.sections[r.id] = r.version; });
      return { g:res[0], s:res[1], c:res[2], ver:ver };
    });
  }
  function _missingTableMsg(e){
    var m = (e && e.message) || "";
    if((e && e.status===404) || /does not exist|schema cache|PGRST20[25]/i.test(m + " " + stable(e && e.body)))
      return "서버에 새 테이블/함수가 없어요 — 설정 SQL 을 먼저 실행해 주세요";
    return null;
  }

  // 서버 최신 데이터로 화면을 새로 채운다 (지금 화면의 미저장 변경은 버려짐 — 호출 전에 확인할 것)
  function pullAll(){
    if(!SB.url) return Promise.resolve();
    _sbChip("서버에서 불러오는 중…","#ffd166");
    return fetchServer().then(function(d){
      if(d.s.length && !("tags" in d.s[0])){
        alert("서버에 페이지 성향 뱃지(tags) 칸이 아직 없어요.\n설정 SQL 파일을 SQL Editor에서 한 번 더 실행해 주세요.\n(실행 전에는 뱃지를 눌러도 서버에 저장되지 않아요)");
      }
      var st = stateFromRows(d.g, d.s, d.c);
      STATE.groups = st.groups; STATE.screens = st.screens;
      VER = d.ver;
      BASE = rowsFromState(STATE);
      _pulled = true; _unsynced = false; _navWarned = false;
      if(!STATE.groups.length && !STATE.screens.length){
        // 서버가 완전히 비어 있으면 기본 그룹 7개를 준비해 둔다 (저장해야 서버에 올라감)
        STATE.groups = GROUPS_DEF.map(function(g,i){ return {id:"grp_"+g.code, code:g.code, name:g.name, order:i, _open:true}; });
        _unsynced = true;
        toast("서버가 비어 있어 기본 그룹을 준비했어요. 저장하면 서버에 올라갑니다.");
      }
      applyUi();
      persistLocal(); _updateUnsavedBadge();
      renderAll();
      _sbChip("서버 불러옴 · "+new Date().toLocaleTimeString(),"#8fe3ab");
    }).catch(function(e){
      console.warn("[pull]", e);
      var msg = _missingTableMsg(e);
      _sbChip(msg ? "설정 필요 · 새 테이블 없음" : "서버 연결 실패 · 브라우저 보관본으로 작업","#ff9c96");
      if(msg) alert(msg + "\n\n(자세한 오류: " + (e && e.message) + ")");
      throw e;
    });
  }

  function _conflictText(list){
    return list.map(function(c){
      if(c.t==="group"){
        var g = (STATE.groups||[]).find(function(x){return x.id===c.id;});
        return "· 그룹 " + (g ? _fmtGroup(g,"tree") : c.id);
      }
      if(c.t==="screen"){
        var s = findScreen(c.id);
        return "· 화면 " + c.id + (s && s.title ? " ("+s.title+")" : "");
      }
      var sc = c.screen_id ? findScreen(c.screen_id) : null;
      var sec = sc ? (sc.sections||[]).find(function(x){return x.id===c.id;}) : null;
      return "· 구역 " + (c.screen_id||"") + " › " + (sec && sec.title ? sec.title : c.id);
    }).join("\n");
  }

  // [저장] — 비밀번호 확인 → 바뀐 행 계산 → sl_save 호출 (전부 성공 or 전부 취소)
  function saveToServer(){
    if(_saving){ toast("저장 중이에요…"); return; }
    if(!SB.url){ toast("서버 설정이 없어요", true); return; }
    _checkSavePassword().then(function(ok){
      if(!ok) return;
      var ready = _pulled && BASE ? Promise.resolve(true) : _prepareBaseWithoutPull();
      ready.then(function(go){ if(go) _doSave(); });
    });
  }
  // 서버 기준본 없이 작업한 경우(처음부터 오프라인이었던 경우 등): 확인을 받고 서버 버전만 받아와서 저장
  function _prepareBaseWithoutPull(){
    if(!confirm("서버 최신 데이터를 확인하지 못한 상태에서 작업했어요.\n이대로 저장하면 서버 내용이 지금 화면과 똑같이 맞춰집니다\n(다른 사람의 변경이 덮어써질 수 있어요).\n\n계속할까요?")){
      return Promise.resolve(false);
    }
    _sbChip("서버 버전 확인 중…","#ffd166");
    return fetchServer().then(function(d){
      var st = stateFromRows(d.g, d.s, d.c);
      BASE = rowsFromState({ groups:st.groups, screens:st.screens });
      VER = d.ver; _pulled = true;
      return true;
    }).catch(function(e){
      _sbChip("서버 연결 실패 · 저장 안 됨","#ff9c96");
      toast(_missingTableMsg(e) || "서버에 연결할 수 없어요. 잠시 후 다시 저장해 주세요", true);
      return false;
    });
  }
  function _doSave(){
    var cur = rowsFromState(STATE);
    var built = buildChanges(BASE, cur, VER);
    if(built.count === 0){
      _unsynced = false; _updateUnsavedBadge(); persistLocal();
      toast("변경된 내용이 없어요");
      return;
    }
    _saving = true;
    _sbChip("서버 저장 중… ("+built.count+"건)","#ffd166");
    fetch(SB.url + "/rest/v1/rpc/sl_save", {
      method:"POST", headers:_sbH(),
      body: JSON.stringify({ p_changes: built.changes, p_user: SB.user })
    }).then(_readJson).then(function(res){
      res = res || {};
      ["groups","screens","sections"].forEach(function(t){
        var m = res[t] || {};
        Object.keys(m).forEach(function(k){ VER[t][k] = m[k]; });
      });
      built.changes.groups_delete.forEach(function(x){ delete VER.groups[x.id]; });
      built.changes.screens_delete.forEach(function(x){ delete VER.screens[x.id]; });
      built.changes.sections_delete.forEach(function(x){ delete VER.sections[x.id]; });
      BASE = cur;   // 저장 버튼을 누른 시점의 내용이 새 기준본 (저장 도중 고친 내용은 다음 저장에 반영됨)
      _unsynced = buildChanges(BASE, rowsFromState(STATE), VER).count > 0;
      _updateUnsavedBadge(); persistLocal();
      _sbChip("서버 저장됨 · "+SB.user+" · "+new Date().toLocaleTimeString(),"#8fe3ab");
      toast("저장됨 · "+built.count+"건 반영");
    }).catch(function(e){
      console.warn("[save]", e);
      var body = e && e.body;
      if(body && body.message === "SL_CONFLICT"){
        var list = []; try{ list = JSON.parse(body.details||"[]"); }catch(_){}
        _sbChip("저장 충돌 · 아무것도 저장 안 됨","#ff9c96");
        alert("다른 사람이 먼저 수정한 항목이 있어서 이번 저장은 전부 취소됐어요.\n(서버 데이터는 그대로입니다)\n\n" + _conflictText(list));
        if(confirm("내 작업을 JSON 파일로 백업한 뒤, 서버 최신 데이터를 불러올까요?\n\n불러온 뒤 백업 파일을 보면서 필요한 부분만 다시 입력해 주세요.\n[취소]를 누르면 지금 화면을 그대로 유지합니다.")){
          exportJson("미저장백업");
          pullAll().catch(function(){});
        }
        return;
      }
      var msg = _missingTableMsg(e);
      _sbChip(msg ? "설정 필요 · 저장 안 됨" : "서버 저장 실패 · 브라우저엔 보관됨","#ff9c96");
      if(msg) alert(msg);
      else toast("저장 실패: " + ((body && body.message) || (e && e.message) || "알 수 없는 오류"), true);
    }).then(function(){ _saving = false; });
  }

  // ── 클립보드 복사
  function copyText(text){
    function fallback(){
      var ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      return ok;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).catch(fallback);
    }
    return Promise.resolve(fallback());
  }

  // ── 저장 시 비밀번호 확인 (기존 편집기와 같은 비밀번호)
  var SAVE_PASSWORD_HASH = "158a323a7ba44870f23d96f1516dd70aa48e9a72db4ebb026b0a89e212a208ab";
  function _sha256Hex(text){
    var buf = new TextEncoder().encode(text);
    return crypto.subtle.digest("SHA-256", buf).then(function(hashBuf){
      return Array.from(new Uint8Array(hashBuf)).map(function(b){ return b.toString(16).padStart(2,"0"); }).join("");
    });
  }
  function _checkSavePassword(){
    var pw = prompt("저장하려면 비밀번호를 입력하세요.");
    if(pw===null) return Promise.resolve(false);
    if(!(window.crypto && window.crypto.subtle)){
      toast("이 브라우저에서는 비밀번호 확인을 할 수 없어요 (https 주소에서 열어 주세요)", true);
      return Promise.resolve(false);
    }
    return _sha256Hex(pw).then(function(hex){
      if(hex !== SAVE_PASSWORD_HASH){ toast("비밀번호가 올바르지 않습니다", true); return false; }
      return true;
    });
  }

  /* ===================== 이력 (sl_history 테이블) ===================== */
  function _histTimeStr(){
    var d = new Date();
    return todayStr()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function _historyPullNow(cb){
    if(!SB.url){ if(cb) cb(); return; }
    sbGetAll(T_HISTORY, "ts.desc,id.asc").then(function(rows){
      STATE.changelog = rows.map(function(row){
        return { id:row.id, text:row.content, author:row.author, ts:Number(row.ts)||0, dateStr:row.date_str };
      });
      if(cb) cb();
    }).catch(function(e){ console.warn("[history pull]",e); if(cb) cb(e); });
  }
  function showHistoryScreen(){

    var main = document.getElementById("mainView"); if(main) main.style.display = "none";
    var hs = document.getElementById("historyScreen"); if(hs) hs.classList.add("show");

  function _syncHistoryBtnLabel(){
    var btn = document.getElementById("btnHistory"); if(!btn) return;
    var hs = document.getElementById("historyScreen");
    btn.textContent = (hs && hs.classList.contains("show")) ? "이력 닫기" : "이력";

  function _linkifyHistoryText(text){
    return esc(text).replace(/#([A-Za-z0-9\-]+)/g, function(m, sid){
      if(!findScreen(sid)) return m;
      return '<span class="hist-chip" data-act="goto-history-screen" data-sid="'+esc(sid)+'" title="'+esc(sid)+' 화면으로 이동">'+esc(sid)+'</span>';
    });
  }
  var HISTORY_TEXT_MAX = 5000;
  function addHistoryEntry(){
    var ta = document.getElementById("historyInput"); if(!ta) return;
    var txt = (ta.value||"").trim();
    if(!txt){ toast("내용을 입력해 주세요", true); return; }
    if(txt.length > HISTORY_TEXT_MAX){ txt = txt.slice(0, HISTORY_TEXT_MAX); toast("이력 내용은 최대 "+HISTORY_TEXT_MAX+"자까지 저장돼요", true); }
    _checkSavePassword().then(function(ok){
      if(!ok) return;
      var entry = { id:uid("hist"), text:txt, author:SB.user||"익명", ts:Date.now(), dateStr:_histTimeStr() };
      fetch(SB.url + "/rest/v1/" + T_HISTORY, {
        method:"POST", headers:_sbH(),
        body: JSON.stringify([{ id:entry.id, content:entry.text, author:entry.author, ts:entry.ts, date_str:entry.dateStr }])
      }).then(_readJson).then(function(){
        STATE.changelog = STATE.changelog || [];
        STATE.changelog.unshift(entry);
        ta.value = "";
        var search = document.getElementById("historySearch"); if(search) search.value = "";
        renderHistoryList();
        toast("이력 등록됨");
      }).catch(function(e){
        console.warn("[history add]",e);
        toast(_missingTableMsg(e) || "이력 서버 저장 실패 · 잠시 후 다시 시도해 주세요", true);
      });
    });
  }
  function delHistoryEntry(hid){
    if(!confirm("이 이력을 삭제할까요?")) return;
    fetch(SB.url + "/rest/v1/" + T_HISTORY + "?id=eq." + encodeURIComponent(hid), { method:"DELETE", headers:_sbH() })
      .then(_readJson).then(function(){
        STATE.changelog = (STATE.changelog||[]).filter(function(h){ return h.id!==hid; });
        renderHistoryList();
      }).catch(function(e){ console.warn("[history del]",e); toast("이력 삭제 실패 · 잠시 후 다시 시도해 주세요", true); });
  }
  function renderHistoryList(){
    var tbody = document.getElementById("historyList"); if(!tbody) return;
    var all = STATE.changelog || [];
    var pill = document.getElementById("historyCountPill"); if(pill) pill.textContent = all.length+"건";
    var searchEl = document.getElementById("historySearch");
    var q = searchEl ? (searchEl.value||"").trim().toLowerCase() : "";
    var sorted = all.slice().sort(function(a,b){ return (a.ts||0)-(b.ts||0); });
    sorted.forEach(function(h,i){ h._seq = i+1; });
    sorted.reverse();
    var list = q ? sorted.filter(function(h){
      return (h.text||"").toLowerCase().indexOf(q)>=0 || (h.author||"").toLowerCase().indexOf(q)>=0;
    }) : sorted;
    if(!list.length){
      tbody.innerHTML = '<tr><td colspan="4" class="hist-empty">'+(q ? "검색 결과가 없습니다." : "등록된 이력이 없습니다.")+'</td></tr>';
      return;
    }
    tbody.innerHTML = list.map(function(h){
      return '<tr>'
        + '<td class="hist-ver">v'+String(h._seq).padStart(3,"0")+'</td>'
        + '<td class="hist-content">'+_linkifyHistoryText(h.text||"")+'</td>'
        + '<td class="hist-date">'+esc(h.dateStr||"")+'</td>'
        + '<td><span class="hist-del" data-act="del-history" data-hid="'+esc(h.id)+'" title="삭제">🗑</span></td>'
        + '</tr>';
    }).join("");
    var wrap = document.getElementById("historyTableWrap");
    if(wrap && !q) wrap.scrollTop = 0;
  }

  /* ===================== 화면 그리기 (기존 편집기와 동일한 UI) ===================== */
  function _fmtGroup(g, mode){
    var code = (g && g.code) || "";
    var raw  = ((g && g.name) || "").trim();
    var nm0  = raw.replace(/^\((.+)\)$/, "$1").trim();
    var nm   = nm0;
    if(code){
      var escC = code.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      var m  = nm0.match(new RegExp("^" + escC + "\\s*\\(?(.+?)\\)?\\s*$"));
      if(m && m[1] && m[1] !== code) nm = m[1].trim();
    }
    if(mode === "header") return nm || code;
    return code ? (nm ? (code + " " + nm) : code) : nm;
  }
  function findScreen(sid){ return (STATE.screens||[]).find(function(x){return x.screenId===sid;}); }

  function renderAll(){
    var _log=function(e){ console.warn("[renderAll]",e); };
    try{ renderTree();   }catch(e){ _log(e); }
    try{ renderMid();    }catch(e){ _log(e); }
    try{ renderDetail(); }catch(e){ _log(e); }
    try{ _updateTreeInfo(); }catch(e){ _log(e); }
    saveUi();

  // ── LEFT
  function renderTree(){
    var tree = document.getElementById("tree");
    var groups = (STATE.groups||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
    var html = "";
    groups.forEach(function(g){
      var items = (STATE.screens||[]).filter(function(s){return s.groupId===g.id;});
      var arrow = g._open===false ? "▸" : "▾";
      html += '<div class="grp-row" data-gid="'+esc(g.id)+'" data-act="toggle-grp">'
            +   '<span class="arrow">'+arrow+'</span>'
            +   '<span data-act="toggle-grp" data-gid="'+esc(g.id)+'">'+esc(_fmtGroup(g, "tree"))+'</span>'
            +   '<span class="n">'+items.length+'</span>'
            +   '<span class="act">'
            +     '<span data-act="rename-grp" data-gid="'+esc(g.id)+'" title="이름 변경">✎</span>'
            +     '<span data-act="del-grp" data-gid="'+esc(g.id)+'" title="삭제">🗑</span>'
            +   '</span>'
            + '</div>';
      if(g._open!==false){
        items.slice().sort(_byScreenIdNum).forEach(function(s){
          html += '<div class="scr-row '+(STATE.selectedScreenId===s.screenId?'active':'')+'" data-sid="'+esc(s.screenId)+'" data-act="sel-scr">'
                +   '<span class="sid">'+esc(s.screenId)+'</span>'
                +   '<span class="nm">'+esc(s.title||"")+'</span>'
                +   _tagDots(s)
                + '</div>';
        });
        if(!items.length) html += '<div class="empty" style="padding:14px 12px">빈 그룹 · "+ 화면"</div>';
      }
    });
    var orphans = (STATE.screens||[]).filter(function(s){return !(STATE.groups||[]).some(function(g){return g.id===s.groupId;});});
    if(orphans.length){
      html += '<div class="grp-row"><span class="arrow">▾</span><span>분류 미지정</span><span class="n">'+orphans.length+'</span></div>';
      orphans.slice().sort(_byScreenIdNum).forEach(function(s){
        html += '<div class="scr-row '+(STATE.selectedScreenId===s.screenId?'active':'')+'" data-sid="'+esc(s.screenId)+'" data-act="sel-scr">'
              +   '<span class="sid">'+esc(s.screenId)+'</span>'
              +   '<span class="nm">'+esc(s.title||"")+'</span>'+_tagDots(s)+'</div>';
      });
    }
    if(!groups.length && !orphans.length) html='<div class="empty">그룹이 없습니다. "+ 그룹" 으로 추가해 주세요.</div>';
    tree.innerHTML = html;
  }
  function _tagDots(s){
    var tags = normTags(s.tags);
    if(!tags.length) return "";
    return '<span class="tagdots" title="'+esc(tags.join(" · "))+'">'
         + tags.map(function(k){ return '<i style="--c:'+tagColor(k)+'"></i>'; }).join("") + '</span>';
  }
  function _byScreenIdNum(a,b){
    function num(s){ var m = typeof s.screenId==="string" && s.screenId.match(/^(\d+)/); return m ? parseInt(m[1],10) : (s.seq||0); }
    return (num(a)-num(b)) || (a.screenId<b.screenId?-1:a.screenId>b.screenId?1:0);
  }

      el.addEventListener("change", function(){
        var k = el.dataset.pf;
        if(k==="link"){
          var raw = el.value, clean = _sanitizeLinkUrl(raw);
          if(raw.trim() && !clean){ toast("http(s):// 로 시작하는 주소만 저장할 수 있어요", true); el.value = s.link || ""; return; }
          s.link = clean; el.value = clean; save();
        } else { s[k]=el.value; save(); renderTree(); }
      });
      el.addEventListener("input", function(){
        var k=el.dataset.pf;
        if(k==="link"){ _markDirty(); return; }
        s[k]=el.value; _markDirty();
        if(k==="title"){ document.getElementById("midTitle").textContent = (s.title||"(제목 없음)") + " 화면 구성"; }
      });
    });

    renderScrShot(shot, s);
    addsec.style.display = "flex";

    var secs = (s.sections||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
    if(!secs.length){
      list.innerHTML = '<div class="empty" style="padding:30px 12px"><b>아직 구역이 없어요. "+ 구역 추가"</b></div>';
      return;
    }
    list.innerHTML = secs.map(function(sec,i){
      var sel = STATE.selectedSectionId===sec.id ? "selected" : "";
      return '<div class="sec '+sel+' '+secSt(sec.status)+'" draggable="true" data-sid="'+esc(s.screenId)+'" data-sec-id="'+esc(sec.id)+'">'
           +   '<span class="num">'+(i+1)+'</span>'
           +   '<span class="badge '+tpCls(sec.type)+'" style="font-size:10.5px">'+esc(sec.type||"기능")+'</span>'
           +   '<span class="ti">'+esc(sec.title||"구역 이름")+'</span>'
           +   '<span class="bdgbox"><span class="badge '+badgeCls(sec.status)+'"><b>'+esc(sec.status||"작성중")+'</b></span></span>'
           + '</div>';
    }).join("");

    list.querySelectorAll(".sec").forEach(function(row){
      row.addEventListener("click", function(){
        STATE.selectedSectionId = row.dataset.secId; saveUi();
        renderMid(); renderDetail();
      });
      row.addEventListener("dragstart", function(e){
        row.classList.add("dragging");
        e.dataTransfer.setData("text/secId", row.dataset.secId);
        e.dataTransfer.effectAllowed="move";
      });
      row.addEventListener("dragend", function(){ row.classList.remove("dragging"); });
      row.addEventListener("dragover", function(e){ e.preventDefault(); e.dataTransfer.dropEffect="move"; row.classList.add("drag-over"); });
      row.addEventListener("dragleave", function(){ row.classList.remove("drag-over"); });
      row.addEventListener("drop", function(e){
        e.preventDefault(); row.classList.remove("drag-over");
        var secId = e.dataTransfer.getData("text/secId"); if(!secId) return;
        var ordered = (s.sections||[]).slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
        var moved = ordered.find(function(x){return x.id===secId;});
        var target = ordered.find(function(x){return x.id===row.dataset.secId;});
        if(!moved||!target||moved.id===target.id) return;
        ordered.splice(ordered.indexOf(moved),1); ordered.splice(ordered.indexOf(target),0,moved);
        ordered.forEach(function(x,i){ x.order = i; });
        save(); renderMid(); renderDetail();
      });
    });
  }

  function _storageDelete(path){
    if(!path || !SB.url) return Promise.resolve();
    return fetch(SB.url + "/storage/v1/object/" + SB_BUCKET + "/" + path, {
      method:"DELETE", headers:{ "apikey":SB.key, "Authorization":"Bearer "+SB.key }
    }).catch(function(){ /* 서버 파일 삭제 실패는 무시 */ });
  }
  function _storageUpload(path, f){
    return fetch(SB.url + "/storage/v1/object/" + SB_BUCKET + "/" + path, {
      method:"POST",
      headers:{ "apikey":SB.key, "Authorization":"Bearer "+SB.key, "Content-Type":f.type||"application/octet-stream", "x-upsert":"true" },
      body:f
    }).then(function(res){
      if(!res.ok) return res.text().then(function(t){ throw new Error(t || ("HTTP "+res.status)); });
    });
  }

  function renderScrShot(shot, s){
    if(s.mockImage && s.mockImage.url){
      shot.innerHTML =
          '<div class="preview">'
        +   '<img src="'+esc(s.mockImage.url)+'" alt="'+esc(s.mockImage.name||"")+'">'
        +   '<span class="rm" data-act="scrshot-del" title="삭제">×</span>'
        + '</div>';
    } else {
      shot.innerHTML =
          '<label class="add"><span class="plus">+</span><span>화면을 등록하세요</span>'
        +   '<input type="file" accept="image/*" data-act="scrshot-file" style="display:none"></label>';
    }
    var fileInp = shot.querySelector("[data-act='scrshot-file']");
    if(fileInp) fileInp.onchange = function(e){
      var f = e.target.files && e.target.files[0]; e.target.value = "";
      if(f) handleScrShotFile(f, s);
    };
    var rm = shot.querySelector("[data-act='scrshot-del']");
    if(rm) rm.onclick = function(e){
      e.stopPropagation();
      if(!confirm("화면 이미지를 삭제할까요?")) return;
      var old = s.mockImage; s.mockImage = null;
      save(); renderMid(); toast("화면 이미지 삭제됨 · 저장을 눌러야 서버에 반영돼요");
      if(old) _storageDelete(old.path);
    };

    if(previewImg) previewImg.onclick = function(e){ e.stopPropagation(); openShotLightbox(s.mockImage); };

  function openShotLightbox(im){
    if(!im || !im.url) return;
    document.getElementById("imglbImg").src = im.url;
    document.getElementById("imglbCap").textContent = (im.name||"화면 이미지")+" · 클릭하면 닫힘";

  function handleScrShotFile(f, s){
    if(!SB.url){ toast("서버 연결이 없어 이미지 업로드가 안 돼요", true); return; }
    if(f.size > 5*1024*1024){ toast("5MB 초과라 제외: "+f.name, true); return; }
    var extMatch = /\.([a-zA-Z0-9]+)$/.exec(f.name || "");
    var ext = extMatch ? extMatch[1].toLowerCase() : "png";
    var path = "screens/" + s.screenId + "." + ext;
    var old = s.mockImage;
    var pre = (old && old.path && old.path !== path) ? _storageDelete(old.path) : Promise.resolve();
    pre.then(function(){ return _storageUpload(path, f); }).then(function(){
      var publicUrl = SB.url + "/storage/v1/object/public/" + SB_BUCKET + "/" + path + "?v=" + Date.now();
      s.mockImage = { id:uid("shot"), name:f.name, path:path, url:publicUrl };
      save(); renderMid();
      toast("화면 이미지 등록됨 · 저장을 눌러야 서버에 반영돼요");
    }).catch(function(){ toast("업로드 실패: "+f.name, true); });
  }

  // 입력폼 높이를 내용 줄 수에 맞춘다
  function _autoGrow(el){
    if(!el || el.offsetParent===null) return;
    var cs = getComputedStyle(el);
    var keep = [];
    for(var p = el.parentElement; p; p = p.parentElement){ if(p.scrollTop > 0) keep.push([p, p.scrollTop]); }
    el.style.height = "0px";
    var h = el.scrollHeight;
    if(cs.boxSizing === "border-box") h += el.offsetHeight - el.clientHeight;
    else h -= (parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0);
    el.style.height = Math.max(h, 44) + "px";
    keep.forEach(function(k){ k[0].scrollTop = k[1]; });
  }
  function _autoGrowAll(root){ if(root) root.querySelectorAll("textarea[data-pf2]").forEach(_autoGrow); }
  (function(){
    var box = document.getElementById("secEdit");
    if(!box || typeof ResizeObserver === "undefined") return;
    var lastW = box.clientWidth;
    new ResizeObserver(function(){ if(box.clientWidth !== lastW){ lastW = box.clientWidth; _autoGrowAll(box); } }).observe(box);
  })();

  function bindDetailHandlers(box, sec){
    box.querySelectorAll("[data-act='acc-toggle']").forEach(function(el){
      el.addEventListener("click", function(){
        var item = el.closest(".acc-item");
        if(item){ item.classList.toggle("is-open"); if(item.classList.contains("is-open")) _autoGrowAll(item); }
      });
    });
    box.querySelectorAll("[data-pf2]").forEach(function(el){
      el.addEventListener("input", function(){
        if(el.tagName === "TEXTAREA") _autoGrow(el);
        var p = el.dataset.pf2;
        sec[p] = el.value;
        _markDirty();
        if(p==="title"){
          var card=document.querySelector('.sec.selected .ti'); if(card) card.textContent=sec.title||"구역 이름";
          var dTitle=document.getElementById("secDetailTitle"); if(dTitle) dTitle.textContent=(sec.title||"구역")+" 상세 내용";
        }
        if(p==="linkedScreenId") renderDetail();
      });
    });
    box.querySelectorAll("[data-act='set-type']").forEach(function(el){
      el.onclick=function(){
        if(sec.type===el.dataset.v) return;
        sec.type = el.dataset.v; save();
        renderMid(); renderDetail(); toast("구역 종류: " + sec.type);
      };
    });
    box.querySelectorAll("[data-act='set-status']").forEach(function(el){
      el.onclick=function(){ if(sec.status===el.dataset.v) return; sec.status=el.dataset.v; save(); renderMid(); renderDetail(); };
    });
    var addBtn = box.querySelector("[data-act='chip-add']");
    if(addBtn) addBtn.onclick = function(e){ e.preventDefault(); e.stopPropagation(); openAddRelatedModal(sec); };
    box.querySelectorAll("[data-act='chip-x']").forEach(function(el){
      el.onclick = function(){ sec.related = (sec.related||[]).filter(function(x){return x!==el.dataset.value;}); save(); renderDetail(); };
    });
    box.onclick = function(e){
      var t=e.target;
      while(t && t!==box){
        var a = t.dataset && t.dataset.act;
        if(a==="img-view"){ openLightbox(sec, t.dataset.img); return; }
        if(a==="img-del"){
          e.stopPropagation();
          if(!confirm("이 이미지를 삭제할까요?")) return;
          var delImg = (sec.images||[]).find(function(x){return x.id===t.dataset.img;});
          sec.images = (sec.images||[]).filter(function(x){return x.id!==t.dataset.img;});
          save(); renderDetail(); toast("이미지 삭제됨 · 저장을 눌러야 서버에 반영돼요");
          if(delImg) _storageDelete(delImg.path);
          return;
        }
        if(a==="goto-screen"){
          var target = findScreen(t.dataset.sid);
          if(!target){ toast("화면을 찾을 수 없어요", true); return; }
          selScr(target.screenId);
          toast("'"+(target.title||target.screenId)+"' 화면으로 이동");
          return;
        }
        t = t.parentNode;
      }
    };
    var fileInp = box.querySelector("[data-act='img-file']");
    if(fileInp) fileInp.onchange = function(e){ handleImgFiles(e.target.files, sec); e.target.value = ""; };
  }

  function handleImgFiles(files, sec){
    if(!files || !files.length) return;
    if(!SB.url){ toast("서버 연결이 없어 이미지 업로드가 안 돼요", true); return; }
    sec.images = sec.images || [];
    var list = Array.prototype.slice.call(files);
    var pending = list.length, okCount = 0;
    function done(){ if(--pending===0){ save(); renderDetail(); toast("이미지 "+okCount+"개 추가 · 저장을 눌러야 서버에 반영돼요"); } }
    list.forEach(function(f){
      if(f.size > 5*1024*1024){ toast("5MB 초과라 제외: "+f.name, true); done(); return; }
      var path = sec.id + "/" + uid("img") + "_" + encodeURIComponent(f.name);
      _storageUpload(path, f).then(function(){
        sec.images.push({ id:uid("img"), name:f.name, dataUrl:SB.url + "/storage/v1/object/public/" + SB_BUCKET + "/" + path, path:path });
        okCount++;
      }).catch(function(){ toast("업로드 실패: "+f.name, true); }).then(done);
    });
  }

  function renderModalList(){
    var s = findScreen(STATE.selectedScreenId);
